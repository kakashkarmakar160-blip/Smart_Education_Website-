<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice</title><style data-internal-css="css/style.css">
*{box-sizing:border-box} :root{--bg:#f7f8fc;--card:#fff;--text:#111a35;--muted:#687089;--line:#e7e8f0;--primary:#5b22c9;--primary2:#7744e8;--soft:#f1edff;--shadow:0 12px 40px rgba(34,25,75,.08)} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif;line-height:1.55} body.dark{--bg:#10111a;--card:#191b27;--text:#f7f7fb;--muted:#a9aec1;--line:#2d3040;--soft:#28213d;--shadow:0 12px 40px rgba(0,0,0,.25)} a{text-decoration:none;color:inherit}.topbar{height:70px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.dark .topbar{background:rgba(16,17,26,.9)}.brand{font-size:22px;font-weight:800;letter-spacing:-.4px}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);width:44px;height:44px;border-radius:14px;cursor:pointer;font-size:19px;display:grid;place-items:center}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6d35d4,#9c6af1);font-weight:800}.container{max-width:1180px;margin:auto;padding:28px 22px 70px}.hero{min-height:280px;border:1px solid #eee8ff;border-radius:28px;padding:42px 48px;display:flex;justify-content:space-between;align-items:center;background:radial-gradient(circle at 85% 50%,#eee7ff,transparent 35%),linear-gradient(135deg,#fff,#f4f0ff);box-shadow:var(--shadow);overflow:hidden}.dark .hero{background:linear-gradient(135deg,#1d1d2a,#211c35)}.hero h1{font-size:44px;line-height:1.15;margin:8px 0 14px;letter-spacing:-1.6px}.hero h1 span{color:#5e38d2}.hero p{color:var(--muted);max-width:650px}.hero-art{font-size:78px;text-align:center;transform:rotate(-3deg)}.hero-art div{font-size:90px;margin-top:-18px}.hero-art small{font-size:22px;color:#7142df}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--primary);margin:0}.search-wrap{margin:18px 0 34px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(35,28,75,.05);display:flex;align-items:center;padding:0 20px}.search-wrap span{font-size:30px;color:var(--muted)}.search-wrap input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:17px;padding:20px 14px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}.section-head h2,.page-intro h1{margin:4px 0;font-size:30px;letter-spacing:-.7px}.muted{color:var(--muted)}.primary{display:inline-flex;justify-content:center;align-items:center;border:0;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer}.full{width:100%}.page-intro{padding:15px 0 25px}.page-intro p:last-child{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.result-card{max-width:620px;margin:70px auto;text-align:center;background:var(--card);border:1px solid var(--line);padding:45px;border-radius:28px;box-shadow:var(--shadow)}.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:var(--soft);color:var(--primary);font-size:36px;font-weight:900}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(12,12,22,.48);display:grid;place-items:end center;z-index:50}.modal-card{width:min(900px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:30px;position:relative}.close{position:absolute;right:20px;top:18px;border:0;background:var(--soft);font-size:25px;width:42px;height:42px;border-radius:50%;cursor:pointer}@media(max-width:720px){.topbar{padding:0 14px}.brand{font-size:17px}.container{padding:18px 14px 55px}.hero{padding:28px 22px;min-height:240px}.hero h1{font-size:32px}.hero-art{font-size:55px}.hero-art div{font-size:65px}.hero-art small{font-size:16px}}
</style><style data-internal-css="css/practice-exam.css">
.practice-wrap{max-width:1000px;margin:auto;padding:28px 20px 70px}.practice-head{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(135deg,#fff,#f4f0ff);border:1px solid #eee8ff;border-radius:24px;padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}.dark .practice-head{background:linear-gradient(135deg,#1a1b28,#241d38)}.practice-head h1{margin:5px 0}.practice-badge{background:#eef9f1;color:#18723e;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap}.practice-question{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0;box-shadow:var(--shadow)}.q-top{display:flex;align-items:center;gap:10px}.q-no{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-weight:900}.q-type{font-size:12px;font-weight:900;color:var(--primary);text-transform:uppercase}.q-marks{margin-left:auto;color:var(--muted);font-weight:800}.q-text{font-size:20px;font-weight:800;margin:15px 0}.practice-options{display:grid;gap:10px}.practice-option{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:13px;padding:13px;text-align:left;cursor:pointer;font-size:16px}.practice-option:hover{border-color:var(--primary)}.practice-option.correct{background:#e9f9ef;border-color:#25a764;color:#126b3d}.practice-option.wrong{background:#fff0f1;border-color:#df4651;color:#a31f2a}.practice-text{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);resize:vertical}.practice-actions{display:flex;gap:10px;margin-top:10px}.check-btn,.solution-btn{border:1px solid #cbb8ff;background:var(--soft);color:var(--primary);padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer}.solution-box{margin-top:13px;padding:14px;border-radius:13px;background:#fffbea;border:1px solid #f2df8b}.solution-box strong{color:#8a6500}.answer-feedback{margin-top:12px;padding:11px 13px;border-radius:12px;font-weight:800}.answer-feedback.good{background:#e9f9ef;color:#126b3d}.answer-feedback.bad{background:#fff0f1;color:#a31f2a}@media(max-width:650px){.practice-head{flex-direction:column;align-items:flex-start}.q-text{font-size:18px}}
</style></head><body><header class="topbar"><button id="backPractice" class="icon-btn">←</button><div class="brand" id="practiceTitle">Practice</div><div class="top-actions"><button class="icon-btn" id="themeBtn">☾</button><a href="profile.html" class="avatar">AK</a></div></header><main class="practice-wrap"><section class="practice-head"><div><p class="eyebrow">PRACTICE ONLY</p><h1 id="paperTitle">Question Paper</h1><p id="paperMeta" class="muted"></p></div><span class="practice-badge">No Exam • No Result</span></section><div id="questionList"></div></main><script data-internal-js="js/app.js">
const THEME_KEY='smartEduTheme';

function applyTheme(){
  document.body.classList.toggle('dark', localStorage.getItem(THEME_KEY)==='dark');
  document.querySelectorAll('#themeBtn').forEach(btn=>{
    btn.textContent=document.body.classList.contains('dark')?'☀':'☾';
  });
}

function roleTarget(id){
  return id==='teacher'?'teacher-save.html':id==='computer'?'computer-save.html':'student-save.html';
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

async function loadJSON(path){
  const candidates=[path];
  if(location.pathname.includes('/frontend/')) candidates.push('../'+path);
  let last;
  for(const candidate of candidates){try{const r=await fetch(candidate,{cache:'no-store'});if(r.ok)return await r.json();last=new Error('HTTP '+r.status+' '+candidate)}catch(e){last=e}}
  throw last||new Error('Cannot load '+path);
}

function params(){ return new URLSearchParams(location.search); }

async function initRoles(){
  const grid=document.getElementById('roleGrid');
  if(!grid) return;
  const roles=await loadJSON('data/roles.json');
  const html=roles.map(r=>`
    <button class="role-card" data-role="${r.id}" type="button">
      <img src="${r.image}" alt="${escapeHtml(r.name)}">
      <div><h3>${escapeHtml(r.name)}</h3><p>${escapeHtml(r.description)}</p></div>
      <span>→</span>
    </button>`).join('');
  grid.innerHTML=html;
  document.querySelectorAll('.role-card').forEach(b=>{
    b.addEventListener('click',()=>location.href=roleTarget(b.dataset.role));
  });
}

function bindGlobal(){
  applyTheme();

  document.querySelectorAll('#themeBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      localStorage.setItem(THEME_KEY, localStorage.getItem(THEME_KEY)==='dark'?'light':'dark');
      applyTheme();
    });
  });

  document.getElementById('profileBtn')?.addEventListener('click',()=>location.href='profile.html');

  // Any avatar that is not already a link works as the profile button.
  document.querySelectorAll('.avatar:not(a)').forEach(a=>{
    if(a.id==='profileBtn') return;
    a.setAttribute('role','button');
    a.setAttribute('tabindex','0');
    a.addEventListener('click',()=>location.href='profile.html');
    a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')location.href='profile.html';});
  });

  // The purple logo is now the switch for the two question-edit pages.
  const pageMenu=document.getElementById('pageMenu');
  const pagePasswordModal=document.getElementById('pagePasswordModal');
  const pagePassword=document.getElementById('pagePassword');
  const pagePasswordMsg=document.getElementById('pagePasswordMsg');
  let pendingPage='';
  document.getElementById('pageSwitchBtn')?.addEventListener('click',()=>{
    pageMenu?.classList.remove('hidden');
  });
  document.getElementById('closePageMenu')?.addEventListener('click',()=>pageMenu?.classList.add('hidden'));
  document.getElementById('closePagePassword')?.addEventListener('click',()=>pagePasswordModal?.classList.add('hidden'));
  function openPagePassword(page){
    pendingPage=page;
    if(pagePassword){pagePassword.value='';pagePassword.focus();}
    if(pagePasswordMsg)pagePasswordMsg.textContent='';
    pagePasswordModal?.classList.remove('hidden');
    pageMenu?.classList.add('hidden');
  }
  document.getElementById('addPage1Btn')?.addEventListener('click',()=>openPagePassword('1'));
  document.getElementById('addPage2Btn')?.addEventListener('click',()=>openPagePassword('2'));
  function unlockSelectedPage(){
    if(pagePassword?.value==='AK1234'){
      if(pendingPage==='1'){
        sessionStorage.setItem('computerEditorUnlocked','1');
        location.href='computer-question-paper.html';
      }else if(pendingPage==='2'){
        sessionStorage.setItem('practiceEditorUnlocked','1');
        location.href='practice-question-paper.html?class=5&semester=1&subject=bangla';
      }
    }else if(pagePasswordMsg){
      pagePasswordMsg.textContent='this is wrong password';
    }
  }
  document.getElementById('unlockPage')?.addEventListener('click',unlockSelectedPage);
  pagePassword?.addEventListener('keydown',e=>{if(e.key==='Enter')unlockSelectedPage()});

  document.getElementById('closeProfilePanel')?.addEventListener('click',()=>{
    document.getElementById('profilePanel')?.classList.add('hidden');
  });
  document.querySelectorAll('.side-overlay').forEach(x=>x.addEventListener('click',e=>{
    if(e.target===x)x.classList.add('hidden');
  }));
}

document.addEventListener('DOMContentLoaded',()=>{
  bindGlobal();
  initRoles().catch(console.error);
});

</script><script data-internal-js="js/practice-exam.js">
const BANK='practiceQuestionBanksV1';let cls='class5',sem='1',sub='bangla',questions=[];
const NAMES={bangla:'Bengali',english:'English',physics:'Physics','life-science':'Life Science',mathematics:'Mathematics',geography:'Geography',history:'History','computer-science':'Computer Science',accountancy:'Accountancy','commercial-law':'Commercial Law','cost-tax':'Cost Tax','business-studies':'Business Studies','political-science':'Political Science','রাষ্ট্রবিজ্ঞান':'রাষ্ট্রবিজ্ঞান'};
function banks(){try{return JSON.parse(localStorage.getItem(BANK)||'{}')}catch{return {}}}
function key(){return `${cls}|${sem}|${sub}`}
function esc(s){return escapeHtml(s)}
async function init(){cls=params().get('class')||'class5';sem=String(params().get('semester')||'1').match(/[1-4]/)?.[0]||'1';sub=params().get('subject')||'bangla';const b=banks();questions=(b[key()]||[]).slice(0,20);if(!questions.length){try{const r=await fetch(`data/practice/${encodeURIComponent(cls)}/semester-${sem}/${encodeURIComponent(sub)}.json`,{cache:'no-store'});if(!r.ok)throw new Error('Question file not found');const d=await r.json();questions=(Array.isArray(d.questions)?d.questions:[]).slice(0,20)}catch(e){console.warn(e);questions=defaultQuestions(NAMES[sub]||sub)}}if(!questions.length)questions=defaultQuestions(NAMES[sub]||sub);questions=questions.slice(0,20);document.getElementById('paperTitle').textContent=`${cls.replace(/^class(?=\d)/,'Class ')} • Semester ${sem} • ${NAMES[sub]||sub}`;document.getElementById('paperMeta').textContent=`${questions.length} Questions • Practice only • Answer can be changed`;document.getElementById('questionList').innerHTML=questions.map(render).join('');bind();}

function defaultQuestions(name){const a=[];for(let i=1;i<=20;i++){const q={type:'mcq',question:`${name} Practice Question ${i}`,options:['Option A','Option B','Option C','Option D'],answer:i%4===0?'Option D':i%4===1?'Option A':i%4===2?'Option B':'Option C',marks:1,explanation:'Sample solution: review the topic and select the correct option.'};a.push(q)}return a}
function render(q,i){let body='';if(q.type==='mcq')body=`<div class="practice-options">${(q.options||[]).map((o,j)=>`<button class="practice-option ${q._answer?.chosen===j?(q._answer.correct?'correct':'wrong'):''}" data-q="${i}" data-j="${j}">${String.fromCharCode(65+j)}) ${esc(o)}</button>`).join('')}</div>`;else if(q.type==='true_false')body=`<div class="practice-options"><button class="practice-option ${q._answer?.value==='সত্য'?(q._answer.correct?'correct':'wrong'):''}" data-q="${i}" data-v="সত্য">সত্য</button><button class="practice-option ${q._answer?.value==='মিথ্যা'?(q._answer.correct?'correct':'wrong'):''}" data-q="${i}" data-v="মিথ্যা">মিথ্যা</button></div>`;else body=`<textarea class="practice-text" id="ans-${i}" rows="3" placeholder="তোমার উত্তর লিখো...">${esc(q._answer?.value||'')}</textarea><div class="practice-actions"><button class="check-btn" data-check="${i}">Check Answer</button></div>`;return `<article class="practice-question"><div class="q-top"><span class="q-no">${i+1}</span><span class="q-type">${esc(q.type||'Question')}</span><span class="q-marks">${q.marks||1} Mark</span></div><div class="q-text">${esc(q.question)}</div>${body}<div id="feedback-${i}">${q._answer?`<div class="answer-feedback ${q._answer.correct?'good':'bad'}">${q._answer.correct?'✓ Correct':'✕ Wrong'} — You can change your answer.</div>`:''}</div><button class="solution-btn" data-solution="${i}">Solution</button><div class="solution-box hidden" id="solution-${i}"><strong>Solution:</strong><div>${esc(q.answer||'Answer not added yet.')}</div>${q.explanation?`<p>${esc(q.explanation)}</p>`:''}</div></article>`}
function bind(){document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.q),Number(b.dataset.j)));document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>chooseTF(Number(b.dataset.q),b.dataset.v));document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>checkText(Number(b.dataset.check)));document.querySelectorAll('[data-solution]').forEach(b=>b.onclick=()=>document.getElementById('solution-'+b.dataset.solution).classList.toggle('hidden'));}
function choose(i,j){const q=questions[i];q._answer={chosen:j,value:q.options[j],correct:q.options[j]===q.answer};refresh(i)}
function chooseTF(i,v){const q=questions[i];q._answer={value:v,correct:v===q.answer};refresh(i)}
function checkText(i){const input=document.getElementById('ans-'+i);if(!input.value.trim())return alert('উত্তর লিখুন।');const q=questions[i],v=input.value.trim();q._answer={value:v,correct:norm(v)===norm(q.answer)};refresh(i)}
function refresh(i){const node=document.querySelectorAll('.practice-question')[i];const q=questions[i];node.outerHTML=render(q,i);bind()}
function norm(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')}
document.getElementById('backPractice').onclick=()=>history.back();init().catch(console.error);

</script></body></html>
