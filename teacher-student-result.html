.6px;color:var(--primary);margin:0}.search-wrap{margin:18px 0 34px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(35,28,75,.05);display:flex;align-items:center;padding:0 20px}.search-wrap span{font-size:30px;color:var(--muted)}.search-wrap input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:17px;padding:20px 14px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}.section-head h2,.page-intro h1{margin:4px 0;font-size:30px;letter-spacing:-.7px}.muted{color:var(--muted)}.primary{display:inline-flex;justify-content:center;align-items:center;border:0;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer}.full{width:100%}.page-intro{padding:15px 0 25px}.page-intro p:last-child{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.result-card{max-width:620px;margin:70px auto;text-align:center;background:var(--card);border:1px solid var(--line);padding:45px;border-radius:28px;box-shadow:var(--shadow)}.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:var(--soft);color:var(--primary);font-size:36px;font-weight:900}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(12,12,22,.48);display:grid;place-items:end center;z-index:50}.modal-card{width:min(900px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:30px;position:relative}.close{position:absolute;right:20px;top:18px;border:0;background:var(--soft);font-size:25px;width:42px;height:42px;border-radius:50%;cursor:pointer}@media(max-width:720px){.topbar{padding:0 14px}.brand{font-size:17px}.container{padding:18px 14px 55px}.hero{padding:28px 22px;min-height:240px}.hero h1{font-size:32px}.hero-art{font-size:55px}.hero-art div{font-size:65px}.hero-art small{font-size:16px}}
</style><style data-internal-css="css/teacher-preview.css">
.paper-wrap{max-width:1000px;margin:auto;padding:28px 20px 70px}.paper-head{background:var(--soft);border:1px solid var(--line);border-radius:24px;padding:25px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.paper-head h1{margin:4px 0}.preview-actions{display:flex;gap:10px;flex-wrap:wrap}.paper-question{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:13px 0;box-shadow:var(--shadow)}.paper-question h3{margin:0 0 10px}.paper-question .q-text{font-size:18px;font-weight:700}.paper-options{margin-top:12px;display:grid;gap:7px}.paper-options div{padding:9px 11px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}.answer-note{margin-top:12px;padding:10px 12px;background:#eefaf2;border-radius:10px;color:#176b39;font-size:13px}.empty-paper{text-align:center;padding:40px}@media(max-width:650px){.paper-head{align-items:flex-start;flex-direction:column}}

</style><style data-internal-css="css/teacher-student-result.css">
.student-answer-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(40,30,80,.05)}.answer-card-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.answer-card-head h3{margin:0;line-height:1.5}.status-badge{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.status-badge.correct{background:#e9f8ef;color:#168348}.status-badge.wrong{background:#fdecec;color:#c53030}.status-badge.unattempted{background:#f3f4f6;color:#666}.review-options{display:grid;gap:8px;margin:14px 0}.review-option{padding:10px 12px;border:1px solid var(--line);border-radius:10px}.review-option.picked-correct{background:#eaf8ef;border-color:#39a86b}.review-option.picked-wrong{background:#fff0f0;border-color:#df5555}.review-option.model-correct{box-shadow:inset 4px 0 0 #36a566}.answer-summary{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;padding-top:14px;border-top:1px solid var(--line)}.answer-summary div{display:flex;flex-direction:column;gap:5px}.answer-summary small{color:#777}.answer-summary b{font-weight:700}.edit-result-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;max-width:900px;margin:auto}.result-student-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.result-student-head h2{margin:4px 0}.edit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.edit-grid>div{display:flex;flex-direction:column;gap:7px}.edit-grid label{font-size:13px;color:#666}.readonly-mark,.mark-input{min-height:46px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafafa;font-size:16px}.mark-input{background:#fff}.success-text{color:#168348;font-weight:700}.preview-btn{display:inline-flex!important;margin-left:6px}.edit-result-btn{background:#f2edff}.dark .student-answer-card,.dark .edit-result-card{background:#17171c}.dark .readonly-mark{background:#22232a}@media(max-width:700px){.answer-card-head,.result-student-head{flex-direction:column}.answer-summary,.edit-grid{grid-template-columns:1fr}.preview-btn{margin-top:6px}}
</style></head><body><header class="topbar"><a href="teacher-profile.html" class="icon-btn">←</a><div class="brand">Student Result Preview</div><div class="top-actions"><button class="icon-btn" id="themeBtn">☾</button><a href="profile.html" class="avatar">AK</a></div></header><main class="paper-wrap"><section id="resultHead" class="paper-head"></section><section id="answerList"></section></main><script data-internal-js="js/app.js">
const THEME_KEY='smartEduTheme';

function applyTheme(){
  document.body.classList.toggle('dark', localStorage.getItem(THEME_KEY)==='dark');
  document.querySelectorAll('#themeBtn').forEach(btn=>{
    btn.textContent=document.body.classList.contains('dark')?'☀':'☾';
  });
}

function roleTarget(id){
  return id==='teacher'?'teacher-save.html':id==='computer'?'computer-save.html':'student-save.html';
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

async function loadJSON(path){
  const candidates=[path];
  if(location.pathname.includes('/frontend/')) candidates.push('../'+path);
  let last;
  for(const candidate of candidates){try{const r=await fetch(candidate,{cache:'no-store'});if(r.ok)return await r.json();last=new Error('HTTP '+r.status+' '+candidate)}catch(e){last=e}}
  throw last||new Error('Cannot load '+path);
}

function params(){ return new URLSearchParams(location.search); }

async function initRoles(){
  const grid=document.getElementById('roleGrid');
  if(!grid) return;
  const roles=await loadJSON('data/roles.json');
  const html=roles.map(r=>`
    <button class="role-card" data-role="${r.id}" type="button">
      <img src="${r.image}" alt="${escapeHtml(r.name)}">
      <div><h3>${escapeHtml(r.name)}</h3><p>${escapeHtml(r.description)}</p></div>
      <span>→</span>
    </button>`).join('');
  grid.innerHTML=html;
  document.querySelectorAll('.role-card').forEach(b=>{
    b.addEventListener('click',()=>location.href=roleTarget(b.dataset.role));
  });
}

function bindGlobal(){
  applyTheme();

  document.querySelectorAll('#themeBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      localStorage.setItem(THEME_KEY, localStorage.getItem(THEME_KEY)==='dark'?'light':'dark');
      applyTheme();
    });
  });

  document.getElementById('profileBtn')?.addEventListener('click',()=>location.href='profile.html');

  // Any avatar that is not already a link works as the profile button.
  document.querySelectorAll('.avatar:not(a)').forEach(a=>{
    if(a.id==='profileBtn') return;
    a.setAttribute('role','button');
    a.setAttribute('tabindex','0');
    a.addEventListener('click',()=>location.href='profile.html');
    a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')location.href='profile.html';});
  });

  // The purple logo is now the switch for the two question-edit pages.
  const pageMenu=document.getElementById('pageMenu');
  const pagePasswordModal=document.getElementById('pagePasswordModal');
  const pagePassword=document.getElementById('pagePassword');
  const pagePasswordMsg=document.getElementById('pagePasswordMsg');
  let pendingPage='';
  document.getElementById('pageSwitchBtn')?.addEventListener('click',()=>{
    pageMenu?.classList.remove('hidden');
  });
  document.getElementById('closePageMenu')?.addEventListener('click',()=>pageMenu?.classList.add('hidden'));
  document.getElementById('closePagePassword')?.addEventListener('click',()=>pagePasswordModal?.classList.add('hidden'));
  function openPagePassword(page){
    pendingPage=page;
    if(pagePassword){pagePassword.value='';pagePassword.focus();}
    if(pagePasswordMsg)pagePasswordMsg.textContent='';
    pagePasswordModal?.classList.remove('hidden');
    pageMenu?.classList.add('hidden');
  }
  document.getElementById('addPage1Btn')?.addEventListener('click',()=>openPagePassword('1'));
  document.getElementById('addPage2Btn')?.addEventListener('click',()=>openPagePassword('2'));
  function unlockSelectedPage(){
    if(pagePassword?.value==='AK1234'){
      if(pendingPage==='1'){
        sessionStorage.setItem('computerEditorUnlocked','1');
        location.href='computer-question-paper.html';
      }else if(pendingPage==='2'){
        sessionStorage.setItem('practiceEditorUnlocked','1');
        location.href='practice-question-paper.html?class=5&semester=1&subject=bangla';
      }
    }else if(pagePasswordMsg){
      pagePasswordMsg.textContent='this is wrong password';
    }
  }
  document.getElementById('unlockPage')?.addEventListener('click',unlockSelectedPage);
  pagePassword?.addEventListener('keydown',e=>{if(e.key==='Enter')unlockSelectedPage()});

  document.getElementById('closeProfilePanel')?.addEventListener('click',()=>{
    document.getElementById('profilePanel')?.classList.add('hidden');
  });
  document.querySelectorAll('.side-overlay').forEach(x=>x.addEventListener('click',e=>{
    if(e.target===x)x.classList.add('hidden');
  }));
}

document.addEventListener('DOMContentLoaded',()=>{
  bindGlobal();
  initRoles().catch(console.error);
});

</script><script data-internal-js="js/teacher-student-result.js">
const wanted=new URLSearchParams(location.search).get('resultId');
const results=JSON.parse(localStorage.getItem('teacherResults')||'[]');
const r=results.find(x=>x.id===wanted);
const head=document.getElementById('resultHead'),list=document.getElementById('answerList');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
if(!r){head.innerHTML='<div><p class="eyebrow">RESULT PREVIEW</p><h1>Result পাওয়া যায়নি</h1></div>';list.innerHTML='<div class="card">এই result-এর data পাওয়া যায়নি।</div>';}else{
 const name=esc(r.student?.name||r.studentName||'Student');
 head.innerHTML=`<div><p class="eyebrow">STUDENT ANSWER REVIEW</p><h1>${name}</h1><p class="muted">${esc(r.title||'Question Paper')} • ${esc(r.subject||'')} • ${r.obtained||0}/${r.totalMarks||0} • ${r.percentage||0}%</p></div><div class="preview-actions"><a class="outline" href="teacher-profile.html">Back to Profile</a><a class="primary" href="teacher-marksheet-edit.html?resultId=${encodeURIComponent(r.id)}">Edit Marks</a></div>`;
 const qs=r.questions||[]; const ans=r.answers||{}; const awarded=Array.isArray(r.awardedMarks)?r.awardedMarks:qs.map((q,i)=>ans[i]?.correct?Number(q.marks||1):0);
 list.innerHTML=qs.map((q,i)=>{
   const a=ans[i]; let studentAnswer=a?.value||'Not Answered';
   if(q.type==='mcq' && a?.chosen!==undefined) studentAnswer=q.options?.[a.chosen]??studentAnswer;
   const status=a?(a.correct?'correct':'wrong'):'unattempted';
   const label=status==='correct'?'Correct':status==='wrong'?'Wrong':'Not Answered';
   let options='';
   if(q.type==='mcq') options=`<div class="review-options">${(q.options||[]).map((o,j)=>{let cls='';if(j===a?.chosen)cls=a.correct?'picked-correct':'picked-wrong';if(o===q.answer)cls+=' model-correct';return `<div class="review-option ${cls}">${String.fromCharCode(65+j)}) ${esc(o)}</div>`}).join('')}</div>`;
   else if(q.type==='true_false') options=`<div class="review-options"><div class="review-option ${a?.value==='সত্য'?(a.correct?'picked-correct':'picked-wrong'):''}">সত্য</div><div class="review-option ${a?.value==='মিথ্যা'?(a.correct?'picked-correct':'picked-wrong'):''}">মিথ্যা</div></div>`;
   return `<article class="student-answer-card ${status}"><div class="answer-card-head"><h3>${i+1}. ${esc(q.question)}</h3><span class="status-badge ${status}">${label}</span></div>${options}<div class="answer-summary"><div><small>Student Answer</small><b>${esc(studentAnswer)}</b></div><div><small>Correct / Model Answer</small><b>${esc(q.answer||'—')}</b></div><div><small>Marks</small><b>${Number(awarded[i]||0)}/${Number(q.marks||1)}</b></div></div></article>`;
 }).join('');
}
</script></body></html>
