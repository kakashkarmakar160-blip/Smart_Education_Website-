<style>
*{box-sizing:border-box}:root{--bg:#eef1f6;--paper:#fff;--ink:#20242b;--muted:#68707d;--line:#cbd1da;--blue:#1d5fbf;--blue2:#eaf2ff;--danger:#c62828;--shadow:0 10px 28px rgba(30,40,55,.12)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Noto Sans Bengali',sans-serif}.top{height:54px;background:#fff;border-bottom:1px solid #c8cdd5;display:flex;align-items:center;gap:8px;padding:6px 10px;position:sticky;top:0;z-index:80}.back,.mini,.meta button{border:1px solid #aeb4bd;background:#fff;border-radius:5px;cursor:pointer}.back{width:36px;height:36px;font-size:19px}.brand{font-weight:900;color:#183b73;margin-right:auto}.top input{width:180px;height:34px;border:1px solid #aeb4bd;border-radius:4px;padding:5px 8px}.mini{height:34px;padding:0 10px;font-weight:800}.ribbon{background:#fff;border-bottom:1px solid #b9bec7;box-shadow:0 2px 7px rgba(0,0,0,.08);position:sticky;top:54px;z-index:70}.meta{display:grid;grid-template-columns:1.15fr .9fr .9fr 1fr .8fr .8fr auto auto auto;gap:5px;padding:5px 7px;background:#f6f7f9;border-bottom:1px solid #d6d9df}.meta input{height:31px;border:1px solid #aeb4bd;border-radius:3px;padding:4px 7px;font-size:12px}.meta button{height:31px;font-size:12px;font-weight:800}.tabs{display:flex;padding:0 6px;background:#fafafa;border-bottom:1px solid #d5d9df}.tab{border:0;background:transparent;padding:8px 16px;font-weight:900;font-size:12px;cursor:pointer;color:#4c5159}.tab.active{background:#fff;color:var(--blue);border:1px solid #c8ccd3;border-bottom-color:#fff;margin-bottom:-1px}.ribbon-row{display:flex;align-items:stretch;gap:0;padding:4px 5px;overflow-x:auto;min-height:55px}.group{display:flex;gap:3px;padding:2px 7px;border-right:1px solid #d4d7dd;align-items:flex-start}.group-title{font-size:9px;color:#666}.rbtn{height:34px;min-width:40px;border:1px solid transparent;background:#fff;border-radius:4px;padding:3px 7px;font-size:11px;font-weight:800;color:#2f3339;cursor:pointer}.rbtn:hover,.rbtn.active{background:var(--blue2);border-color:#9db9e7;color:var(--blue)}.rbtn.big{min-width:64px;height:44px}.rbtn.danger{color:#b42318}.palette{display:flex;flex-wrap:wrap;gap:3px;width:128px}.sw{width:18px;height:18px;border:1px solid #777;border-radius:2px;cursor:pointer}.fontbox{display:flex;gap:3px}.fontbox select{height:30px;border:1px solid #aeb4bd;border-radius:3px}.workspace{max-width:1260px;margin:12px auto 60px;padding:0 10px}.paper{background:#fff;box-shadow:var(--shadow);border:1px solid #cbd0d8;min-height:950px;position:relative;background-repeat:no-repeat;background-position:center;background-size:420px auto}.editor{min-height:950px;padding:58px 64px;outline:0;font-size:17px;line-height:1.72;overflow-wrap:anywhere}.editor:empty:before{content:'এখানে আপনার Notes লিখুন...';color:#9aa0aa}.editor img{max-width:100%;height:auto}.note-img{display:block;margin:14px auto;max-width:100%;cursor:pointer}.note-img.selected{outline:2px solid #3182ce;outline-offset:2px}.shape{display:inline-flex;align-items:center;justify-content:center;margin:8px;padding:18px;min-width:90px;min-height:55px;border:3px solid #1d5fbf;vertical-align:middle}.circle{border-radius:50%}.triangle{width:0!important;height:0!important;border-left:45px solid transparent!important;border-right:45px solid transparent!important;border-bottom:80px solid #1d5fbf!important;background:transparent!important;padding:0!important;min-width:0!important}.arrow{font-size:46px;color:#1d5fbf;border:0;padding:0}.page-break{height:1px;border-top:2px dashed #bbb;margin:30px 0;break-after:page}.bottom{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0}.action{border:1px solid #aeb4bd;background:#fff;border-radius:5px;padding:9px 14px;font-weight:800;cursor:pointer}.action.primary{background:#1d5fbf;color:#fff;border-color:#1d5fbf}.action.danger{color:#b42318}.code{font-size:12px;font-weight:800;color:#1d5fbf}.list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}.search{height:34px;border:1px solid #aeb4bd;border-radius:5px;padding:5px 8px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #e1e4e8}.row:last-child{border-bottom:0}.row h3{margin:0 0 3px}.muted{color:var(--muted);font-size:12px}.status{color:#16814b;font-weight:900;font-size:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:200}.hidden{display:none!important}.modal-card{width:min(920px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}.close{position:absolute;right:15px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:#eef1f6;font-size:24px;cursor:pointer}.symbols{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}.symbols button{padding:9px;border:1px solid #d3d8df;background:#fff;border-radius:6px;cursor:pointer;font-weight:800}.drawbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.drawbar input,.drawbar select{height:35px}.drawcanvas{width:100%;height:420px;border:1px solid #c7cdd5;background:#fff;touch-action:none;cursor:crosshair}.preview{padding:35px;line-height:1.7}.preview img{max-width:100%}.dark{filter:invert(1) hue-rotate(180deg)}@media(max-width:850px){.meta{grid-template-columns:repeat(2,1fr)}.editor{padding:30px 22px}.top input{width:120px}.bottom{flex-direction:column;align-items:stretch}.bottom>div{display:flex;flex-wrap:wrap}.ribbon{position:relative;top:0}.top{position:relative}}
</style></head><body>
<header class="top"><button class="back" onclick="location.href='teacher-profile.html'">←</button><div class="brand">Smart Education • Make Notes</div><input id="searchNotes" placeholder="Search Notes..."><button class="mini" id="themeBtn">☾</button><button class="mini" id="profileBtn">Teacher</button></header>
<section class="ribbon"><div class="meta"><input id="title" placeholder="Notes Title:"><input id="teacherName" placeholder="Teacher Name:"><input id="chapter" placeholder="Chapter:"><input id="subject" placeholder="Subject:"><input id="semester" placeholder="Semester:"><input id="className" placeholder="Class:"><button id="newBtn">＋ New Notes</button><button id="homeBtn">⌂</button><button id="deleteTop" class="rbtn danger">Delete</button></div>
<div class="tabs"><button class="tab active" data-tab="home">Home</button><button class="tab" data-tab="insert">Insert</button><button class="tab" data-tab="draw">Draw</button><button class="tab" data-tab="view">View</button></div>
<div class="ribbon-row">
<div class="group" data-pane="home"><button class="rbtn big" id="pasteBtn">📋<br>Paste</button><button class="rbtn big" id="selectBtn">▣<br>Select</button></div>
<div class="group" data-pane="home"><button class="rbtn" data-cmd="undo">↶ Undo</button><button class="rbtn" data-cmd="redo">↷ Redo</button><button class="rbtn" data-cmd="bold"><b>B</b></button><button class="rbtn" data-cmd="italic"><i>I</i></button><button class="rbtn" data-cmd="underline"><u>U</u></button></div>
<div class="group" data-pane="home"><div class="fontbox"><select id="fontName"><option>Arial</option><option>Georgia</option><option>Times New Roman</option><option>Cambria</option><option>Noto Sans Bengali</option></select><select id="fontSize"><option value="3">16</option><option value="4">20</option><option value="5">26</option><option value="6">32</option><option value="7">40</option></select></div><button class="rbtn" id="formatBtn">Heading</button></div>
<div class="group" data-pane="home"><div><div class="palette" id="palette"></div><div style="display:flex;gap:4px;margin-top:3px"><button class="rbtn" id="textColorBtn">A</button><button class="rbtn" id="highlightBtn">▰</button><input id="customColor" type="color" value="#1d5fbf" style="height:30px;width:34px"></div></div></div>
<div class="group" data-pane="home"><button class="rbtn" data-cmd="justifyLeft">≡ Left</button><button class="rbtn" data-cmd="justifyCenter">☷ Center</button><button class="rbtn" data-cmd="justifyRight">≣ Right</button><button class="rbtn" data-cmd="insertUnorderedList">• List</button><button class="rbtn" data-cmd="insertOrderedList">1. List</button></div>
<div class="group" data-pane="insert"><button class="rbtn" id="imageBtn">🖼 Pictures</button><button class="rbtn" id="cropBtn">✂ Crop</button><button class="rbtn" id="resizeBtn">↔ Resize</button><button class="rbtn" id="rotateBtn">⟳ Rotate</button><button class="rbtn" id="logoBtn">◉ Background Logo</button><button class="rbtn" id="shapeBtn">◇ Shapes</button><button class="rbtn" id="keyboardBtn">⌨ Keyboard</button><button class="rbtn" id="chartBtn">▥ Chart</button><button class="rbtn" id="tableBtn">▦ Table</button></div>
<div class="group" data-pane="insert"><button class="rbtn" id="pageBreakBtn">↕ Page Break</button><button class="rbtn" id="coverBtn">▤ Cover Page</button><button class="rbtn" id="blankBtn">▢ Blank Page</button></div>
<div class="group" data-pane="draw"><button class="rbtn" id="drawPadBtn">✏ Drawing Pad</button><button class="rbtn" id="quickLine">／ Line</button><button class="rbtn" id="quickArrow">➜ Arrow</button><button class="rbtn" id="quickBox">▢ Box</button><button class="rbtn" id="clearDrawBtn">⌫ Clear</button></div>
<div class="group" data-pane="view"><button class="rbtn" id="previewBtn">👁 Preview</button><button class="rbtn" id="pdfBtn">📥 Save as PDF</button><button class="rbtn" id="zoomOut">− Zoom</button><button class="rbtn" id="zoomIn">＋ Zoom</button><button class="rbtn" id="fullBtn">⛶ Full Screen</button></div>
<div class="group" data-pane="view"><button class="rbtn" id="publishBtn">Publish</button><button class="rbtn" id="unpublishBtn">Unpublish</button><button class="rbtn" id="editBtn">Edit</button><button class="rbtn" id="copyBtn">Copy Code</button></div>
</div></section>
<main class="workspace"><div class="paper" id="paper"><div id="editor" class="editor" contenteditable="true" spellcheck="true"></div></div><div class="bottom"><span class="code" id="currentCode"></span><div><button class="action" id="bottomPreview">👁 Preview</button><button class="action" id="bottomPdf">📥 Save as PDF</button><button class="action primary" id="bottomPublish">💾 Save & Publish</button></div></div><section class="list"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>My Notes</b><div class="muted">Edit | Preview | Publish | Delete</div></div><input id="listSearch" class="search" placeholder="Search my notes"></div><div id="noteList">Loading...</div></section></main>
<input id="imageInput" type="file" accept="image/*" hidden><input id="logoInput" type="file" accept="image/*" hidden>
<div id="keyboardModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><h2>⌨ Math & Science Keyboard</h2><div id="symbols" class="symbols"></div></div></div>
<div id="shapeModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><h2>◇ Shapes</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="action" data-shape="rect">Rectangle</button><button class="action" data-shape="circle">Circle</button><button class="action" data-shape="triangle">Triangle</button><button class="action" data-shape="arrow">Arrow →</button><button class="action" data-shape="line">Line ─────</button></div></div></div>
<div id="cropModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><h2>Crop Image</h2><img id="cropImage" style="max-width:100%;max-height:65vh"><div style="margin-top:10px"><button class="action primary" id="cropDone">Apply Crop</button></div></div></div>
<div id="previewModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><div id="previewArea" class="preview"></div></div></div>
<div id="chartModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><h2>Insert Simple Chart</h2><input id="chartValues" value="30,50,80,60" style="width:100%;padding:10px"><button class="action primary" id="insertChart" style="margin-top:10px">Insert Chart</button></div></div>
<div id="drawModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><h2>✏ Drawing Pad</h2><div class="drawbar"><label>Colour <input id="drawColor" type="color" value="#1d5fbf"></label><label>Size <input id="drawSize" type="range" min="1" max="24" value="4"></label><button class="action" id="drawEraser">Eraser</button><button class="action" id="drawClear">Clear</button><button class="action primary" id="insertDrawing">Insert into Notes</button></div><canvas id="drawCanvas" class="drawcanvas"></canvas></div></div>
<script>
const $=id=>document.getElementById(id),editor=$('editor');let currentId=new URLSearchParams(location.search).get('id')||null,currentUser=null,cropper=null,savedRange=null,selectedImage=null,zoom=1,drawing=null;const MAX_BYTES=350*1024;
const symbols=['+','−','×','÷','=','≠','<','>','≤','≥','±','%','∴','∵','≈','∝','∞','√','∛','∜','π','°','′','″','∠','⟂','∥','△','≅','∼','∈','∉','⊂','∪','∩','∅','Σ','Δ','α','β','γ','θ','φ','λ','μ','ρ','σ','ε','η','Ω','ω','τ','ψ','χ','ζ','→','←','↑','↓','↗','↘','×10ⁿ','sin','cos','tan','sin⁻¹','cos⁻¹','tan⁻¹','sinh','cosh','tanh','x²','x³','xʸ','1/x','10ˣ','eˣ','log','ln','e','i','Ans','!','@','#','$','&','*','_','-','/','\\','~','`','^','|','{ }','[ ]','( )'];
const palette=['#000000','#ffffff','#7f1d1d','#ef4444','#f97316','#facc15','#84cc16','#22c55e','#06b6d4','#3b82f6','#6366f1','#a855f7','#ec4899','#6b7280','#f3f4f6'];
function toast(t){const d=document.createElement('div');d.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20242b;color:#fff;padding:11px 16px;border-radius:10px;z-index:500;font-weight:800';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
function saveSel(){const s=getSelection();if(s&&s.rangeCount)savedRange=s.getRangeAt(0).cloneRange()}function restoreSel(){if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange)}}function cmd(c,v=null){editor.focus();restoreSel();document.execCommand(c,false,v)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function insertHTML(h){editor.focus();restoreSel();document.execCommand('insertHTML',false,h)}function openModal(id){$(id).classList.remove('hidden')}function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.classList.add('hidden'))}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);
// Working Home/Insert/Draw/View tabs.
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');const pane=t.dataset.tab;document.querySelectorAll('[data-pane]').forEach(g=>g.style.display=g.dataset.pane===pane?'flex':'none')});document.querySelector('.tab.active').click();
$('palette').innerHTML=palette.map(c=>`<span class="sw" style="background:${c}" data-color="${c}"></span>`).join('');document.querySelectorAll('.sw').forEach(x=>x.onclick=()=>{saveSel();applyColor(x.dataset.color,false)});function applyColor(c,h){restoreSel();editor.focus();document.execCommand(h?'hiliteColor':'foreColor',false,c)}$('textColorBtn').onclick=()=>{saveSel();applyColor($('customColor').value,false)};$('highlightBtn').onclick=()=>{saveSel();applyColor($('customColor').value,true)};document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>cmd(b.dataset.cmd));$('fontName').onchange=e=>cmd('fontName',e.target.value);$('fontSize').onchange=e=>cmd('fontSize',e.target.value);$('formatBtn').onclick=()=>cmd('formatBlock','h2');
$('selectBtn').onclick=()=>{editor.focus();document.execCommand('selectAll');saveSel()};$('pasteBtn').onclick=async()=>{try{const t=await navigator.clipboard.readText();insertHTML(esc(t).replace(/\n/g,'<br>'))}catch(e){toast('Clipboard permission দিন বা Ctrl+V ব্যবহার করুন')}};
$('pageBreakBtn').onclick=()=>insertHTML('<div class="page-break" contenteditable="false"></div><p><br></p>');$('blankBtn').onclick=()=>insertHTML('<div class="page-break" contenteditable="false"></div><p><br><br><br></p>');$('coverBtn').onclick=()=>insertHTML(`<div style="text-align:center;padding:100px 20px;page-break-after:always"><h1>${esc($('title').value||'Notes Title')}</h1><h2>${esc($('subject').value||'')}</h2><p>${esc($('chapter').value||'')}</p><p>${esc($('teacherName').value||'')}</p></div>`);
$('tableBtn').onclick=()=>{const r=Math.max(1,parseInt(prompt('Rows?',3)||3)),c=Math.max(1,parseInt(prompt('Columns?',3)||3));let h='<table style="border-collapse:collapse;width:100%;margin:12px 0">';for(let i=0;i<r;i++){h+='<tr>';for(let j=0;j<c;j++)h+='<td style="border:1px solid #888;padding:8px">Cell</td>';h+='</tr>'}insertHTML(h+'</table>')};
$('chartBtn').onclick=()=>openModal('chartModal');$('insertChart').onclick=()=>{const vals=$('chartValues').value.split(',').map(x=>Math.max(0,Math.min(100,+x.trim()||0)));insertHTML('<div style="display:flex;gap:8px;align-items:flex-end;height:180px;margin:20px 0">'+vals.map(v=>`<div style="flex:1;height:${Math.max(5,v)}%;background:#1d5fbf;position:relative"><span style="position:absolute;top:-20px;width:100%;text-align:center">${v}</span></div>`).join('')+'</div>');closeModals()};
$('keyboardBtn').onclick=()=>{saveSel();$('symbols').innerHTML=symbols.map(s=>`<button type="button">${esc(s)}</button>`).join('');document.querySelectorAll('#symbols button').forEach(b=>b.onclick=()=>insertHTML(esc(b.textContent)+' '));openModal('keyboardModal')};$('shapeBtn').onclick=()=>openModal('shapeModal');document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{const m={rect:'<span class="shape">Rectangle</span>',circle:'<span class="shape circle">Circle</span>',triangle:'<span class="shape triangle"></span>',arrow:'<span class="shape arrow">→</span>',line:'<span class="shape" style="min-width:160px;height:3px;min-height:3px;padding:0"></span>'};insertHTML(m[b.dataset.shape]);closeModals()});
async function requireUser(){if(currentUser)return currentUser;if(window.smartEduAuth?.user)currentUser=await smartEduAuth.user();if(!currentUser){const r=await supabaseClient.auth.getUser();currentUser=r.data.user}if(!currentUser)throw Error('Teacher login required');return currentUser}
async function uploadBlob(blob,tag){if(blob.size>MAX_BYTES)throw Error('Image must be within 350 KB');const u=await requireUser();const path=`${u.id}/${Date.now()}-${tag}.jpg`;const {error}=await supabaseClient.storage.from('notes-media').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(error)throw error;return supabaseClient.storage.from('notes-media').getPublicUrl(path).data.publicUrl}
function selectedImg(){return selectedImage||editor.querySelector('img.note-img.selected')}editor.addEventListener('click',e=>{document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));if(e.target.matches('img')){selectedImage=e.target;e.target.classList.add('selected')}else selectedImage=null});
$('imageBtn').onclick=()=>{saveSel();$('imageInput').click()};$('logoBtn').onclick=()=>{$('logoInput').click()};$('imageInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>MAX_BYTES){toast('ছবি 350 KB-এর মধ্যে হতে হবে');return}try{const u=await uploadBlob(f,'image');insertHTML(`<img class="note-img" src="${u}" alt="Note image">`);toast('ছবি যোগ হয়েছে')}catch(x){toast(x.message)}};$('logoInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>MAX_BYTES){toast('Background logo 350 KB-এর মধ্যে হতে হবে');return}try{const u=await uploadBlob(f,'logo');$('paper').dataset.logo=u;$('paper').style.backgroundImage=`url("${u}")`;toast('Background logo added')}catch(x){toast(x.message)}};
$('resizeBtn')?.addEventListener('click',()=>{const im=selectedImg();if(!im)return toast('আগে একটি ছবি select করুন');const w=parseInt(prompt('Width (px)',Math.round(im.getBoundingClientRect().width))||0);if(w>0)im.style.width=w+'px'});$('rotateBtn')?.addEventListener('click',()=>{const im=selectedImg();if(!im)return toast('আগে একটি ছবি select করুন');const r=(im.dataset.rotate?+im.dataset.rotate:0)+90;im.dataset.rotate=r;im.style.transform=`rotate(${r}deg)`});
$('cropBtn')?.addEventListener('click',()=>{const im=selectedImg();if(!im)return toast('আগে একটি ছবি select করুন');$('cropImage').src=im.src;openModal('cropModal');if(cropper)cropper.destroy();cropper=new Cropper($('cropImage'),{viewMode:1,autoCropArea:.85});$('cropDone').onclick=async()=>{try{const c=cropper.getCroppedCanvas({maxWidth:1800,maxHeight:1800});let q=.86,data=c.toDataURL('image/jpeg',q),blob=await(await fetch(data)).blob();while(blob.size>MAX_BYTES&&q>.25){q-=.07;data=c.toDataURL('image/jpeg',q);blob=await(await fetch(data)).blob()}im.src=await uploadBlob(blob,'crop');closeModals();toast('Crop complete')}catch(x){toast(x.message)}}});
// Draw pad.
const dc=$('drawCanvas'),ctx=dc.getContext('2d');function sizeCanvas(){const r=dc.getBoundingClientRect(),d=devicePixelRatio||1;dc.width=r.width*d;dc.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height)}function pos(e){const r=dc.getBoundingClientRect();return{x:(e.clientX||e.touches?.[0]?.clientX)-r.left,y:(e.clientY||e.touches?.[0]?.clientY)-r.top}}let drawOn=false,erase=false,last=null;function start(e){drawOn=true;last=pos(e);e.preventDefault()}function move(e){if(!drawOn)return;const p=pos(e);ctx.strokeStyle=erase?'#fff':$('drawColor').value;ctx.lineWidth=+$('drawSize').value;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault()}function end(){drawOn=false}dc.addEventListener('pointerdown',start);dc.addEventListener('pointermove',move);window.addEventListener('pointerup',end);$('drawPadBtn').onclick=()=>{openModal('drawModal');setTimeout(sizeCanvas,30)};$('drawEraser').onclick=()=>erase=!erase;$('drawClear').onclick=()=>{sizeCanvas()};$('clearDrawBtn').onclick=()=>{openModal('drawModal');setTimeout(sizeCanvas,30)};$('insertDrawing').onclick=()=>{const data=dc.toDataURL('image/png');insertHTML(`<img class="note-img" src="${data}" alt="Drawing">`);closeModals();toast('Drawing inserted')};$('quickLine').onclick=()=>insertHTML('<div style="border-top:3px solid #1d5fbf;margin:18px 0"></div>');$('quickArrow').onclick=()=>insertHTML('<div style="font-size:42px;color:#1d5fbf">→</div>');$('quickBox').onclick=()=>insertHTML('<div style="border:3px solid #1d5fbf;padding:20px;margin:12px 0">Write here</div>');
$('previewBtn').onclick=()=>showPreview();$('bottomPreview').onclick=()=>showPreview();$('pdfBtn').onclick=downloadPdf;$('bottomPdf').onclick=downloadPdf;$('publishBtn').onclick=()=>save(true);$('bottomPublish').onclick=()=>save(true);$('unpublishBtn').onclick=async()=>{if(!currentId)return toast('আগে Notes save করুন');const {error}=await supabaseClient.from('notes').update({published:false,updated_at:new Date().toISOString()}).eq('id',currentId);toast(error?error.message:'Unpublished');loadList()};$('copyBtn').onclick=async()=>{const c=$('currentCode').textContent.replace('Notes Code: ','');if(c)await navigator.clipboard.writeText(c);toast(c?'Code copied':'আগে Notes save করুন')};$('editBtn').onclick=()=>{editor.focus();toast('Edit mode active')};$('newBtn').onclick=()=>{currentId=null;history.replaceState({},'','teacher-notes.html');setForm({});loadTeacherName()};$('deleteTop').onclick=()=>{if(currentId)window.deleteNote(currentId);else toast('Delete করার মতো saved Notes নেই')};$('profileBtn').onclick=()=>location.href='teacher-profile.html';$('homeBtn').onclick=()=>location.href='teacher-profile.html';$('themeBtn').onclick=()=>document.body.classList.toggle('dark');
$('zoomIn').onclick=()=>{zoom=Math.min(1.6,zoom+.1);$('paper').style.transform=`scale(${zoom})`;$('paper').style.transformOrigin='top center'};$('zoomOut').onclick=()=>{zoom=Math.max(.7,zoom-.1);$('paper').style.transform=`scale(${zoom})`;$('paper').style.transformOrigin='top center'};$('fullBtn').onclick=()=>document.documentElement.requestFullscreen?.();
function collect(){return{title:$('title').value.trim(),class_name:$('className').value.trim(),semester:$('semester').value.trim(),subject:$('subject').value.trim(),chapter:$('chapter').value.trim(),teacher_name:$('teacherName').value.trim(),content_html:editor.innerHTML,background_logo_url:$('paper').dataset.logo||null}}function setForm(n){$('title').value=n.title||'';$('className').value=n.class_name||'';$('semester').value=n.semester||'';$('subject').value=n.subject||'';$('chapter').value=n.chapter||'';$('teacherName').value=n.teacher_name||'';editor.innerHTML=n.content_html||'';$('paper').dataset.logo=n.background_logo_url||'';$('paper').style.backgroundImage=n.background_logo_url?`url("${n.background_logo_url}")`:'';$('currentCode').textContent=n.note_code?`Notes Code: ${n.note_code}`:''}
function code(){return 'NT-'+Math.random().toString(36).slice(2,8).toUpperCase()}async function save(publish=true){try{await requireUser();const d=collect();if(!d.title)return toast('Notes Title দিন।');if(!d.content_html.trim())return toast('Notes content লিখুন।');let payload={...d,teacher_user_id:currentUser.id,published:publish,updated_at:new Date().toISOString()};if(currentId)payload.id=currentId;else payload.note_code=code();const q=currentId?supabaseClient.from('notes').update(payload).eq('id',currentId).select().single():supabaseClient.from('notes').insert(payload).select().single();const {data,error}=await q;if(error)throw error;currentId=data.id;history.replaceState({},'',`teacher-notes.html?id=${currentId}`);$('currentCode').textContent=`Notes Code: ${data.note_code}`;toast(`Notes ${publish?'published':'saved'} successfully`);loadList();if(publish)alert(`Notes published successfully!\n\nNotes Code: ${data.note_code}\n\nএই code-টি students-কে দিন।`)}catch(e){toast(e.message)}}
async function loadList(){try{await requireUser();const {data,error}=await supabaseClient.from('notes').select('*').eq('teacher_user_id',currentUser.id).order('updated_at',{ascending:false});if(error)throw error;allNotes=data||[];renderList(allNotes)}catch(e){$('noteList').textContent=e.message}}let allNotes=[];function renderList(data){$('noteList').innerHTML=data.length?data.map(n=>`<div class="row"><div><h3>${esc(n.title)}</h3><div class="muted">${esc(n.subject||'')} ${n.chapter?'• '+esc(n.chapter):''} • Code: <b>${esc(n.note_code)}</b></div><div class="${n.published?'status':'muted'}">${n.published?'● Published':'Draft'}</div></div><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="action" onclick="editNote('${n.id}')">Edit</button><button class="action" onclick="previewNote('${n.id}')">Preview</button><button class="action" onclick="togglePublish('${n.id}',${!n.published})">${n.published?'Unpublish':'Publish'}</button><button class="action" onclick="copyCode('${n.note_code}')">Copy Code</button><button class="action danger" onclick="deleteNote('${n.id}')">Delete</button></div></div>`).join(''):'<p class="muted">এখনও কোনো Notes তৈরি করা হয়নি।</p>'}window.editNote=async id=>{const {data}=await supabaseClient.from('notes').select('*').eq('id',id).maybeSingle();if(data){currentId=id;history.replaceState({},'',`teacher-notes.html?id=${id}`);setForm(data);scrollTo({top:0,behavior:'smooth'})}};window.previewNote=async id=>{const {data}=await supabaseClient.from('notes').select('*').eq('id',id).maybeSingle();if(!data)return;$('previewArea').innerHTML=`<h1>${esc(data.title)}</h1><p><b>${esc(data.subject||'')}</b> • ${esc(data.chapter||'')}</p><hr>${DOMPurify.sanitize(data.content_html,{ADD_ATTR:['style','class','target']})}`;$('previewArea').style.backgroundImage=data.background_logo_url?`url("${data.background_logo_url}")`:'';openModal('previewModal')};window.copyCode=async c=>{await navigator.clipboard.writeText(c);toast('Notes Code copied')};window.togglePublish=async(id,p)=>{const {error}=await supabaseClient.from('notes').update({published:p,updated_at:new Date().toISOString()}).eq('id',id);toast(error?error.message:(p?'Published':'Unpublished'));loadList()};window.deleteNote=async id=>{if(!confirm('এই Notes delete করবেন?'))return;const {error}=await supabaseClient.from('notes').delete().eq('id',id);if(error)toast(error.message);else{if(currentId===id){currentId=null;setForm({})}toast('Notes deleted');loadList()}};
function showPreview(){const d=collect();$('previewArea').innerHTML=`<h1>${esc(d.title)}</h1><p><b>${esc(d.subject||'')}</b> • ${esc(d.chapter||'')}</p><hr>${DOMPurify.sanitize(d.content_html,{ADD_ATTR:['style','class','target']})}`;$('previewArea').style.backgroundImage=d.background_logo_url?`url("${d.background_logo_url}")`:'';openModal('previewModal')};async function downloadPdf(){const d=collect();toast('PDF তৈরি হচ্ছে…');const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-100000px;top:0;width:794px;background:#fff;color:#111;padding:45px;font-family:Arial,"Noto Sans Bengali",sans-serif;line-height:1.6';holder.innerHTML=`<h1>${esc(d.title)}</h1><p>${esc(d.subject||'')} • ${esc(d.chapter||'')}</p><hr>${DOMPurify.sanitize(d.content_html,{ADD_ATTR:['style','class']})}`;if(d.background_logo_url){holder.style.backgroundImage=`url("${d.background_logo_url}")`;holder.style.backgroundRepeat='no-repeat';holder.style.backgroundPosition='center';holder.style.backgroundSize='420px auto'}document.body.appendChild(holder);try{const canvas=await html2canvas(holder,{scale:1.5,useCORS:true,backgroundColor:'#fff'});const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','pt','a4'),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),imgW=pw-60,pageH=Math.floor(canvas.width*ph/imgW);let off=0;while(off<canvas.height){const pc=document.createElement('canvas');pc.width=canvas.width;pc.height=Math.min(pageH,canvas.height-off);pc.getContext('2d').drawImage(canvas,0,off,canvas.width,pc.height,0,0,canvas.width,pc.height);if(off)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.9),'JPEG',30,30,imgW,pc.height*imgW/canvas.width);off+=pageH}pdf.save((d.title||'Smart-Education-Notes').replace(/[^a-z0-9\u0980-\u09ff\- ]/gi,'').trim().replace(/\s+/g,'-')+'.pdf')}finally{holder.remove()}}
async function loadTeacherName(){try{const p=await smartEduAuth.profile();if(p&&!$('teacherName').value)$('teacherName').value=p.name||''}catch(e){}}(async()=>{try{await requireUser();await loadTeacherName();if(currentId){const {data}=await supabaseClient.from('notes').select('*').eq('id',currentId).maybeSingle();if(data)setForm(data)}await loadList()}catch(e){$('noteList').textContent=e.message}})();
</script></body></html>
