<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make Notes • Smart Education</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
<style>
*{box-sizing:border-box} :root{--bg:#eef0f4;--paper:#fff;--ink:#202124;--line:#c8ccd3;--blue:#1d5fbf;--blue2:#e8f0ff;--danger:#d92d20;--shadow:0 8px 24px rgba(30,35,45,.12)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Noto Sans Bengali',sans-serif}.top{height:54px;background:#fff;border-bottom:1px solid #c7cad0;display:flex;align-items:center;padding:6px 10px;gap:8px;position:sticky;top:0;z-index:50}.back{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:5px;font-size:19px}.brand{font-weight:800;margin-right:auto;color:#1d3763}.top input{height:34px;border:1px solid #aeb4bd;border-radius:4px;padding:5px 8px;width:150px}.top .mini{height:34px;border:1px solid #aeb4bd;background:#fff;border-radius:4px;padding:0 10px;font-weight:700}.ribbon{background:#fff;border-bottom:1px solid #b9bec7;box-shadow:0 2px 5px rgba(0,0,0,.08);position:sticky;top:54px;z-index:45}.meta{display:grid;grid-template-columns:1.1fr .8fr .8fr 1fr .9fr 1fr auto;gap:5px;padding:5px 7px;background:#f6f7f9;border-bottom:1px solid #d6d9df}.meta input{height:31px;border:1px solid #aeb4bd;border-radius:3px;padding:4px 7px;font-size:12px}.meta button{height:31px;border:1px solid #b6bbc3;background:#fff;border-radius:4px;font-weight:700;font-size:12px}.tabs{display:flex;gap:0;padding:0 6px;background:#fafafa}.tab{border:0;background:transparent;padding:7px 13px;font-weight:700;font-size:12px;color:#4c5159}.tab.active{background:#fff;border:1px solid #c8ccd3;border-bottom-color:#fff;margin-bottom:-1px;color:#1d5fbf}.ribbon-row{display:flex;align-items:stretch;gap:0;padding:3px 5px;overflow-x:auto;white-space:nowrap}.group{display:flex;gap:3px;padding:2px 7px;border-right:1px solid #d4d7dd;align-items:flex-start}.group:last-child{border-right:0}.group-title{display:block;font-size:9px;color:#666;position:absolute;margin-top:43px}.rbtn{height:34px;min-width:34px;border:1px solid transparent;background:#fff;border-radius:4px;padding:3px 6px;font-size:11px;font-weight:700;color:#2f3339}.rbtn:hover,.rbtn.active{background:#eaf2ff;border-color:#9db9e7;color:#1d5fbf}.rbtn.big{min-width:62px;height:44px}.rbtn.danger{color:#b42318}.sep{width:1px;background:#d4d7dd;margin:0 4px}.palette{display:flex;flex-wrap:wrap;gap:3px;width:125px}.sw{width:18px;height:18px;border:1px solid #777;border-radius:2px;cursor:pointer}.fontbox{display:flex;gap:3px}.fontbox select{height:30px;border:1px solid #aeb4bd;border-radius:3px}.workspace{max-width:1260px;margin:12px auto 60px;padding:0 10px}.paper{background:var(--paper);box-shadow:var(--shadow);border:1px solid #cbd0d8;min-height:950px;position:relative}.editor{min-height:950px;padding:58px 64px;outline:0;font-size:17px;line-height:1.72;overflow-wrap:anywhere}.editor:empty:before{content:'এখানে আপনার Notes লিখুন...';color:#9aa0aa}.editor h1,.editor h2,.editor h3{line-height:1.25}.editor img{max-width:100%;height:auto}.note-img{display:block;margin:14px auto;max-width:100%;cursor:pointer}.note-img.selected{outline:2px solid #3182ce;outline-offset:2px}.shape{display:inline-flex;align-items:center;justify-content:center;margin:8px;padding:18px;min-width:90px;min-height:55px;border:3px solid #1d5fbf;vertical-align:middle;cursor:pointer}.circle{border-radius:50%}.triangle{width:0!important;height:0!important;border-left:45px solid transparent!important;border-right:45px solid transparent!important;border-bottom:80px solid #1d5fbf!important;background:transparent!important;padding:0!important;min-width:0!important}.arrow{font-size:46px;color:#1d5fbf;border:0;padding:0}.wm{background-repeat:no-repeat;background-position:center;background-size:420px auto}.bottom{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0}.action{border:1px solid #aeb4bd;background:#fff;border-radius:5px;padding:9px 14px;font-weight:800}.action.primary{background:#1d5fbf;color:#fff;border-color:#1d5fbf}.action.danger{color:#b42318}.code{font-size:12px;color:#6b7280}.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:grid;place-items:center;padding:14px;z-index:100}.modal.hidden{display:none}.modal-card{width:min(920px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:10px;padding:18px;position:relative}.close{position:absolute;right:10px;top:10px;border:0;background:#eef2f7;width:34px;height:34px;border-radius:50%;font-size:20px}.symbols{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}.symbols button{height:38px;border:1px solid #cbd0d8;background:#f8fafc;border-radius:5px;font-weight:800}.preview{background:#fff;color:#111;min-height:500px;padding:50px;border:1px solid #ddd}.search{border:1px solid #b7bcc4;border-radius:4px;height:31px;padding:4px 7px}.list{margin-top:14px;background:#fff;border:1px solid #cbd0d8;box-shadow:var(--shadow);padding:14px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #e2e4e8}.row:last-child{border-bottom:0}.row h3{margin:0 0 3px;font-size:16px}.small{padding:7px 9px;font-size:11px}.status{font-size:11px;font-weight:800;color:#087443}.muted{color:#6b7280;font-size:12px}.toast{position:fixed;right:16px;bottom:16px;background:#202124;color:#fff;padding:11px 15px;border-radius:7px;z-index:200}.page-break{border-top:2px dashed #888;margin:30px 0;height:1px}.chart{display:inline-block;border:1px solid #bbb;padding:10px;margin:10px}.chartbars{display:flex;align-items:flex-end;gap:8px;height:140px}.bar{width:28px;background:#4a79c9}.bar span{display:block;margin-top:-18px;font-size:10px;text-align:center}
@media(max-width:900px){.meta{grid-template-columns:repeat(2,1fr)}.editor{padding:28px 20px}.top input{width:110px}.brand{font-size:14px}.top .mini{display:none}}
</style>
</head>
<body>
<header class="top"><button class="back" onclick="location.href='teacher-profile.html'">←</button><div class="brand">Smart Education • Make Notes</div><input id="searchNotes" placeholder="Search Notes..."><button class="mini" id="themeBtn">☾</button><button class="mini" id="profileBtn">Teacher</button></header>
<section class="ribbon">
  <div class="meta">
    <input id="title" placeholder="Notes Title:"><input id="teacherName" placeholder="Teacher Name:"><input id="chapter" placeholder="Chapter:"><input id="subject" placeholder="Subject:"><input id="semester" placeholder="Semester:"><input id="className" placeholder="Class:">
    <button id="newBtn">＋ New Notes</button><button id="homeBtn">⌂</button><button id="deleteTop" class="rbtn danger">Delete</button>
  </div>
  <div class="tabs"><button class="tab active">Home</button><button class="tab">Insert</button><button class="tab">Draw</button><button class="tab">View</button></div>
  <div class="ribbon-row">
    <div class="group">
      <button class="rbtn big" id="pasteBtn">📋<br>Paste</button><button class="rbtn big" id="selectBtn">▣<br>Select</button>
    </div>
    <div class="group"><button class="rbtn" id="cropBtn">✂ Crop</button><button class="rbtn" id="resizeBtn">↔ Resize</button><button class="rbtn" id="rotateBtn">⟳ Rotate</button></div>
    <div class="group"><button class="rbtn" data-cmd="undo">↶ Undo</button><button class="rbtn" data-cmd="redo">↷ Redo</button><button class="rbtn" data-cmd="bold"><b>B</b></button><button class="rbtn" data-cmd="italic"><i>I</i></button><button class="rbtn" data-cmd="underline"><u>U</u></button></div>
    <div class="group"><div class="fontbox"><select id="fontName"><option>Arial</option><option>Georgia</option><option>Times New Roman</option><option>Cambria</option><option>Noto Sans Bengali</option></select><select id="fontSize"><option value="3">26</option><option value="2">18</option><option value="4">30</option><option value="5">36</option><option value="6">44</option></select></div><button class="rbtn" id="formatBtn">Heading</button></div>
    <div class="group"><div><div class="palette" id="palette"></div><div style="display:flex;gap:4px;margin-top:3px"><button class="rbtn" id="textColorBtn">A</button><button class="rbtn" id="highlightBtn">▰</button><input id="customColor" type="color" value="#1d5fbf" style="height:30px;width:34px"></div></div></div>
    <div class="group"><button class="rbtn" data-cmd="justifyLeft">≡ Left</button><button class="rbtn" data-cmd="justifyCenter">☷ Center</button><button class="rbtn" data-cmd="justifyRight">≣ Right</button><button class="rbtn" data-cmd="insertUnorderedList">• List</button><button class="rbtn" data-cmd="insertOrderedList">1. List</button></div>
    <div class="group"><button class="rbtn" id="shapeBtn">◇ Shapes</button><button class="rbtn" id="keyboardBtn">⌨ Keyboard</button><button class="rbtn" id="imageBtn">🖼 Pictures</button><button class="rbtn" id="logoBtn">◉ Background Logo</button><button class="rbtn" id="chartBtn">▥ Chart</button></div>
    <div class="group"><button class="rbtn" id="tableBtn">▦ Table</button><button class="rbtn" id="pageBreakBtn">↕ Page Break</button><button class="rbtn" id="coverBtn">▤ Cover Page</button><button class="rbtn" id="blankBtn">▢ Blank Page</button></div>
    <div class="group"><button class="rbtn" id="previewBtn">Preview</button><button class="rbtn" id="pdfBtn">Save as PDF</button><button class="rbtn" id="publishBtn">Publish</button><button class="rbtn" id="unpublishBtn">Unpublish</button><button class="rbtn" id="editBtn">Edit</button><button class="rbtn" id="copyBtn">Copy Code</button></div>
  </div>
</section>
<main class="workspace">
  <div class="paper" id="paper"><div id="editor" class="editor" contenteditable="true" spellcheck="true"></div></div>
  <div class="bottom"><span class="code" id="currentCode"></span><div><button class="action" id="bottomPreview">👁 Preview</button><button class="action" id="bottomPdf">📥 Save as PDF</button><button class="action primary" id="bottomPublish">💾 Save & Publish</button></div></div>
  <section class="list"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>My Notes</b><div class="muted">Edit | Preview | Publish | Delete</div></div><input id="listSearch" class="search" placeholder="Search my notes"></div><div id="noteList">Loading...</div></section>
</main>
<input id="imageInput" type="file" accept="image/*" hidden><input id="logoInput" type="file" accept="image/*" hidden>
<div id="keyboardModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><h2>⌨ Math & Science Keyboard</h2><div id="symbols" class="symbols"></div></div></div>
<div id="shapeModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><h2>◇ Shapes</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="action" data-shape="rect">Rectangle</button><button class="action" data-shape="circle">Circle</button><button class="action" data-shape="triangle">Triangle</button><button class="action" data-shape="arrow">Arrow →</button><button class="action" data-shape="line">Line ─────</button></div></div></div>
<div id="cropModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><h2>Crop Image</h2><img id="cropImage" style="max-width:100%;max-height:65vh"><div style="margin-top:10px"><button class="action primary" id="cropDone">Apply Crop</button></div></div></div>
<div id="previewModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><div id="previewArea" class="preview"></div></div></div>
<div id="chartModal" class="modal hidden"><div class="modal-card"><button class="close" data-close>×</button><h2>Insert Simple Chart</h2><p class="muted">Bars লিখুন: 30,50,80,60</p><input id="chartValues" value="30,50,80,60" style="width:100%;padding:10px"><button class="action primary" id="insertChart" style="margin-top:10px">Insert Chart</button></div></div>
<script>
const $=id=>document.getElementById(id),editor=$('editor');let currentId=new URLSearchParams(location.search).get('id')||null,currentUser=null,cropper=null,savedRange=null,selectedImage=null;const MAX_BYTES=350*1024;
const symbols=['+','−','×','÷','=','≠','<','>','≤','≥','±','%','∶','::','∴','∵','≈','∝','∞','√','∛','∜','^','π','°','′','″','∠','⟂','∥','△','≅','∼','∈','∉','⊂','∪','∩','∅','Σ','Δ','α','β','γ','θ','φ','λ','μ','ρ','σ','ε','η','Ω','ω','τ','ψ','χ','ζ','→','←','↑','↓','↗','↘','↙','↖','×10ˣ','sin','cos','tan','sin⁻¹','cos⁻¹','tan⁻¹','sinh','cosh','tanh','x²','x³','1/x','10ˣ','eˣ','log','ln','π','e','i','Ans','!','@','#','$','&','*','_','-','/','\\','~','`','^','|','{ }','[ ]','( )'];
const palette=['#000000','#ffffff','#7f1d1d','#ef4444','#f97316','#facc15','#84cc16','#22c55e','#06b6d4','#3b82f6','#6366f1','#a855f7','#ec4899','#6b7280','#f3f4f6'];
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function saveSel(){const s=getSelection();if(s&&s.rangeCount){savedRange=s.getRangeAt(0).cloneRange()}}function restoreSel(){if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange)}}
function cmd(c,v=null){editor.focus();restoreSel();document.execCommand(c,false,v)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function insertHTML(h){editor.focus();restoreSel();document.execCommand('insertHTML',false,h)}
function openModal(id){$(id).classList.remove('hidden')}function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.classList.add('hidden'))}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);
$('palette').innerHTML=palette.map(c=>`<span class="sw" style="background:${c}" data-color="${c}"></span>`).join('');document.querySelectorAll('.sw').forEach(x=>x.onclick=()=>{saveSel();applyColor(x.dataset.color,false)});
function applyColor(c,highlight){restoreSel();editor.focus();document.execCommand(highlight?'hiliteColor':'foreColor',false,c)}
$('textColorBtn').onclick=()=>{saveSel();applyColor($('customColor').value,false)};$('highlightBtn').onclick=()=>{saveSel();applyColor($('customColor').value,true)};
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>cmd(b.dataset.cmd));
$('fontName').onchange=e=>cmd('fontName',e.target.value);$('fontSize').onchange=e=>cmd('fontSize',e.target.value);$('formatBtn').onclick=()=>cmd('formatBlock','h2');
$('selectBtn').onclick=()=>{editor.focus();document.execCommand('selectAll');saveSel()};$('pasteBtn').onclick=async()=>{try{const t=await navigator.clipboard.readText();insertHTML(esc(t).replace(/\n/g,'<br>'))}catch(e){toast('Clipboard permission দিন বা Ctrl+V ব্যবহার করুন')}};
$('pageBreakBtn').onclick=()=>insertHTML('<div class="page-break" contenteditable="false"></div><p><br></p>');$('blankBtn').onclick=()=>insertHTML('<div class="page-break" contenteditable="false"></div><p><br><br><br></p>');$('coverBtn').onclick=()=>insertHTML(`<div style="text-align:center;padding:100px 20px;page-break-after:always"><h1>${esc($('title').value||'Notes Title')}</h1><h2>${esc($('subject').value||'')}</h2><p>${esc($('chapter').value||'')}</p><p>${esc($('teacherName').value||'')}</p></div>`);
$('tableBtn').onclick=()=>{const r=Math.max(1,parseInt(prompt('Rows?',3)||3)),c=Math.max(1,parseInt(prompt('Columns?',3)||3));let h='<table style="border-collapse:collapse;width:100%;margin:12px 0">';for(let i=0;i<r;i++){h+='<tr>';for(let j=0;j<c;j++)h+=`<td style="border:1px solid #888;padding:8px">Cell</td>`;h+='</tr>'}insertHTML(h+'</table>')};
$('chartBtn').onclick=()=>{saveSel();openModal('chartModal')};$('insertChart').onclick=()=>{const vals=$('chartValues').value.split(',').map(x=>Math.max(0,Math.min(100,+x.trim()||0)));insertHTML(`<div class="chart"><div class="chartbars">${vals.map(v=>`<div class="bar" style="height:${Math.max(5,v)}px"><span>${v}</span></div>`).join('')}</div></div>`);closeModals()};
$('shapeBtn').onclick=()=>{saveSel();openModal('shapeModal')};document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{const t=b.dataset.shape;let h=t==='rect'?'<span class="shape">Text</span>':t==='circle'?'<span class="shape circle">Text</span>':t==='triangle'?'<span class="shape triangle"></span>':t==='arrow'?'<span class="shape arrow">→</span>':'<span class="shape">────────</span>';insertHTML(h);closeModals()});
$('keyboardBtn').onclick=()=>{saveSel();$('symbols').innerHTML=symbols.map(s=>`<button>${s}</button>`).join('');$('symbols').querySelectorAll('button').forEach(b=>b.onclick=()=>insertHTML(esc(b.textContent)));openModal('keyboardModal')};
async function fileData(f){if(f.size>MAX_BYTES)throw Error('প্রতিটি ছবি/লোগো সর্বোচ্চ 350 KB হতে হবে।');return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function uploadBlob(blob,kind){if(blob.size>MAX_BYTES)throw Error('Compress করার পরেও ছবিটি 350 KB-এর বেশি হচ্ছে।');const path=`${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2)}-${kind}.jpg`;const up=await supabaseClient.storage.from('notes-media').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;return supabaseClient.storage.from('notes-media').getPublicUrl(path).data.publicUrl}
$('imageBtn').onclick=()=>{saveSel();$('imageInput').click()};$('logoBtn').onclick=()=>{saveSel();$('logoInput').click()};$('imageInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const data=await fileData(f);$('cropImage').src=data;openModal('cropModal');if(cropper)cropper.destroy();cropper=new Cropper($('cropImage'),{viewMode:1,autoCropArea:.85,background:false})}catch(x){toast(x.message)}};
$('cropDone').onclick=async()=>{try{const c=cropper.getCroppedCanvas({maxWidth:1800,maxHeight:1800});let q=.86,data=c.toDataURL('image/jpeg',q);let blob=await(await fetch(data)).blob();while(blob.size>MAX_BYTES&&q>.25){q-=.07;data=c.toDataURL('image/jpeg',q);blob=await(await fetch(data)).blob()}const url=await uploadBlob(blob,'image');restoreSel();insertHTML(`<img class="note-img" src="${url}" alt="Note image">`);closeModals();toast('ছবি যোগ হয়েছে')}catch(x){toast(x.message)}};
$('logoInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const data=await fileData(f);let blob=await(await fetch(data)).blob();const url=await uploadBlob(blob,'logo');$('paper').classList.add('wm');$('paper').style.backgroundImage=`url("${url}")`;$('paper').dataset.logo=url;toast('Background logo added')}catch(x){toast(x.message)}};
function selectedImg(){return selectedImage||editor.querySelector('img.note-img.selected')}
editor.addEventListener('click',e=>{document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));if(e.target.matches('img')){selectedImage=e.target;e.target.classList.add('selected')}else selectedImage=null});
$('resizeBtn').onclick=()=>{const im=selectedImg();if(!im){toast('আগে একটি ছবি select করুন');return}const w=parseInt(prompt('Width (px)',Math.round(im.getBoundingClientRect().width))||0);if(w>0)im.style.width=w+'px'};$('rotateBtn').onclick=()=>{const im=selectedImg();if(!im){toast('আগে একটি ছবি select করুন');return}const r=(im.dataset.rotate?+im.dataset.rotate:0)+90;im.dataset.rotate=r;im.style.transform=`rotate(${r}deg)`};$('cropBtn').onclick=()=>{const im=selectedImg();if(!im){toast('আগে একটি ছবি select করুন');return}$('cropImage').src=im.src;openModal('cropModal');if(cropper)cropper.destroy();cropper=new Cropper($('cropImage'),{viewMode:1,autoCropArea:.85,background:false});$('cropDone').onclick=async()=>{try{const c=cropper.getCroppedCanvas({maxWidth:1800,maxHeight:1800});let q=.86,data=c.toDataURL('image/jpeg',q),blob=await(await fetch(data)).blob();while(blob.size>MAX_BYTES&&q>.25){q-=.07;data=c.toDataURL('image/jpeg',q);blob=await(await fetch(data)).blob()}const url=await uploadBlob(blob,'crop');im.src=url;closeModals();toast('Crop complete')}catch(x){toast(x.message)}}};
$('profileBtn').onclick=()=>location.href='teacher-profile.html';$('homeBtn').onclick=()=>location.href='teacher-profile.html';$('themeBtn').onclick=()=>document.body.classList.toggle('dark');
async function requireUser(){if(currentUser)return currentUser;if(window.smartEduAuth?.getUser){currentUser=await smartEduAuth.getUser()}if(!currentUser&&window.supabaseClient){const r=await supabaseClient.auth.getUser();currentUser=r.data.user}if(!currentUser)throw Error('Teacher login required');return currentUser}
function collect(){return{title:$('title').value.trim(),class_name:$('className').value.trim(),semester:$('semester').value.trim(),subject:$('subject').value.trim(),chapter:$('chapter').value.trim(),teacher_name:$('teacherName').value.trim(),content_html:editor.innerHTML,background_logo_url:$('paper').dataset.logo||null}}
function setForm(n){$('title').value=n.title||'';$('className').value=n.class_name||'';$('semester').value=n.semester||'';$('subject').value=n.subject||'';$('chapter').value=n.chapter||'';$('teacherName').value=n.teacher_name||'';editor.innerHTML=n.content_html||'';$('paper').dataset.logo=n.background_logo_url||'';$('paper').style.backgroundImage=n.background_logo_url?`url("${n.background_logo_url}")`:'';$('currentCode').textContent=n.note_code?`Notes Code: ${n.note_code}`:''}
function code(){return 'NT-'+Math.random().toString(36).slice(2,8).toUpperCase()}
async function save(publish=true){try{await requireUser();const d=collect();if(!d.title){toast('Notes Title দিন।');return}if(!d.content_html.trim()){toast('Notes content লিখুন।');return}let payload={...d,teacher_user_id:currentUser.id,published:publish,updated_at:new Date().toISOString()};if(currentId)payload.id=currentId;else payload.note_code=code();const q=currentId?supabaseClient.from('notes').update(payload).eq('id',currentId).select().single():supabaseClient.from('notes').insert(payload).select().single();const {data,error}=await q;if(error)throw error;currentId=data.id;history.replaceState({},'',`teacher-notes.html?id=${currentId}`);$('currentCode').textContent=`Notes Code: ${data.note_code}`;toast(`Notes ${publish?'published':'saved'} successfully`);await loadList();if(publish)alert(`Notes published successfully!\n\nNotes Code: ${data.note_code}\n\nএই code-টি students-কে দিন।`)}catch(e){toast(e.message)}}
async function loadList(){try{await requireUser();const {data,error}=await supabaseClient.from('notes').select('*').eq('teacher_user_id',currentUser.id).order('updated_at',{ascending:false});if(error)throw error;renderList(data||[])}catch(e){$('noteList').textContent=e.message}}
function renderList(data){$('noteList').innerHTML=data.length?data.map(n=>`<div class="row"><div><h3>${esc(n.title)}</h3><div class="muted">${esc(n.subject||'')} ${n.chapter?'• '+esc(n.chapter):''} • Code: <b>${esc(n.note_code)}</b></div><div class="${n.published?'status':'muted'}">${n.published?'● Published':'Draft'}</div></div><div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"><button class="action small" onclick="editNote('${n.id}')">Edit</button><button class="action small" onclick="previewNote('${n.id}')">Preview</button><button class="action small" onclick="togglePublish('${n.id}',${!n.published})">${n.published?'Unpublish':'Publish'}</button><button class="action small" onclick="copyCode('${n.note_code}')">Copy Code</button><button class="action danger small" onclick="deleteNote('${n.id}')">Delete</button></div></div>`).join(''):'<p class="muted">এখনও কোনো Notes তৈরি করা হয়নি।</p>'}
window.editNote=async id=>{const {data}=await supabaseClient.from('notes').select('*').eq('id',id).maybeSingle();if(data){currentId=id;history.replaceState({},'',`teacher-notes.html?id=${id}`);setForm(data);scrollTo({top:0,behavior:'smooth'})}};window.previewNote=async id=>{const {data}=await supabaseClient.from('notes').select('*').eq('id',id).maybeSingle();if(!data)return;$('previewArea').innerHTML=`<h1>${esc(data.title)}</h1><p><b>${esc(data.subject||'')}</b> • ${esc(data.chapter||'')}</p><hr>${DOMPurify.sanitize(data.content_html,{ADD_ATTR:['style','class','target']})}`;$('previewArea').style.backgroundImage=data.background_logo_url?`url("${data.background_logo_url}")`:'';openModal('previewModal')};window.copyCode=async c=>{await navigator.clipboard.writeText(c);toast('Notes Code copied')};window.togglePublish=async(id,p)=>{const {error}=await supabaseClient.from('notes').update({published:p,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{toast(p?'Published':'Unpublished');loadList()}};window.deleteNote=async id=>{if(!confirm('এই Notes delete করবেন?'))return;const {error}=await supabaseClient.from('notes').delete().eq('id',id);if(error)toast(error.message);else{if(currentId===id){currentId=null;setForm({})}toast('Notes deleted');loadList()}};
function showPreview(){const d=collect();$('previewArea').innerHTML=`<h1>${esc(d.title)}</h1><p><b>${esc(d.subject||'')}</b> • ${esc(d.chapter||'')}</p><hr>${DOMPurify.sanitize(d.content_html,{ADD_ATTR:['style','class','target']})}`;$('previewArea').style.backgroundImage=d.background_logo_url?`url("${d.background_logo_url}")`:'';openModal('previewModal')}
async function downloadPdf(){const d=collect();toast('PDF তৈরি হচ্ছে…');const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-100000px;top:0;width:794px;background:#fff;color:#111;padding:45px;font-family:Arial,"Noto Sans Bengali",sans-serif;line-height:1.6';holder.innerHTML=`<h1>${esc(d.title)}</h1><p>${esc(d.subject||'')} • ${esc(d.chapter||'')}</p><hr>${DOMPurify.sanitize(d.content_html,{ADD_ATTR:['style','class']})}`;if(d.background_logo_url){holder.style.backgroundImage=`url("${d.background_logo_url}")`;holder.style.backgroundRepeat='no-repeat';holder.style.backgroundPosition='center';holder.style.backgroundSize='420px auto'}document.body.appendChild(holder);try{const canvas=await html2canvas(holder,{scale:1.5,useCORS:true,backgroundColor:'#fff'});const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','pt','a4'),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),imgW=pw-60,pageH=Math.floor(canvas.width*ph/imgW);let off=0;while(off<canvas.height){const pc=document.createElement('canvas');pc.width=canvas.width;pc.height=Math.min(pageH,canvas.height-off);pc.getContext('2d').drawImage(canvas,0,off,canvas.width,pc.height,0,0,canvas.width,pc.height);if(off)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.9),'JPEG',30,30,imgW,pc.height*imgW/canvas.width);off+=pageH}pdf.save((d.title||'Smart-Education-Notes').replace(/[^a-z0-9\u0980-\u09ff\- ]/gi,'').trim().replace(/\s+/g,'-')+'.pdf')}finally{holder.remove()}}
$('previewBtn').onclick=showPreview;$('bottomPreview').onclick=showPreview;$('pdfBtn').onclick=downloadPdf;$('bottomPdf').onclick=downloadPdf;$('publishBtn').onclick=()=>save(true);$('bottomPublish').onclick=()=>save(true);$('unpublishBtn').onclick=async()=>{if(currentId){const {error}=await supabaseClient.from('notes').update({published:false}).eq('id',currentId);if(error)toast(error.message);else{toast('Unpublished');loadList()}}};$('copyBtn').onclick=async()=>{const codeText=$('currentCode').textContent.replace('Notes Code: ','');if(codeText)await navigator.clipboard.writeText(codeText);toast(codeText?'Code copied':'আগে Notes save করুন')};$('editBtn').onclick=()=>{editor.focus();toast('Edit mode active')};$('newBtn').onclick=()=>{currentId=null;history.replaceState({},'','teacher-notes.html');setForm({});loadTeacherName()};$('deleteTop').onclick=()=>{if(currentId)window.deleteNote(currentId);else toast('Delete করার মতো saved Notes নেই')};$('searchNotes').oninput=e=>{$('listSearch').value=e.target.value;filterList(e.target.value)};$('listSearch').oninput=e=>filterList(e.target.value);let allNotes=[];function filterList(q){const x=q.toLowerCase();renderList(allNotes.filter(n=>(n.title||'').toLowerCase().includes(x)||(n.subject||'').toLowerCase().includes(x)||(n.chapter||'').toLowerCase().includes(x)))}
async function loadTeacherName(){try{const p=await smartEduAuth?.profile?.();if(p&&!$('teacherName').value)$('teacherName').value=p.name||''}catch(e){}}
(async()=>{try{await requireUser();await loadTeacherName();if(currentId){const {data}=await supabaseClient.from('notes').select('*').eq('id',currentId).maybeSingle();if(data)setForm(data)}const {data}=await supabaseClient.from('notes').select('*').eq('teacher_user_id',currentUser.id).order('updated_at',{ascending:false});allNotes=data||[];renderList(allNotes)}catch(e){$('noteList').textContent=e.message}})();
</script>
</body></html>
