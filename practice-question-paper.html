sg" class="success-text"></span></div></main><div id="editorModal" class="modal hidden"><div class="modal-card question-modal"><button id="closeEditor" class="close">×</button><p class="eyebrow" id="modalEyebrow">QUESTION 1</p><h2>Edit Question</h2><div class="form-grid"><div class="field"><label>Question Type</label><select id="qType"><option value="mcq">MCQ</option><option value="short">Short Answer</option><option value="true_false">True / False</option><option value="fill_blank">Fill in the Blank</option><option value="paragraph">Paragraph</option><option value="essay">Essay</option></select></div><div class="field"><label>Marks</label><input id="qMarks" type="number" min="1" max="20" value="1"></div><div class="field full"><label>Question *</label><textarea id="qText" rows="4" maxlength="1000"></textarea></div></div><div id="qExtra"></div><div class="modal-actions"><button id="cancelEditor" class="outline">Cancel</button><button id="saveEditor" class="primary">Save Question</button></div><p id="editorError" class="danger"></p></div></div><script data-internal-js="js/app.js">
const THEME_KEY='smartEduTheme';

function applyTheme(){
  document.body.classList.toggle('dark', localStorage.getItem(THEME_KEY)==='dark');
  document.querySelectorAll('#themeBtn').forEach(btn=>{
    btn.textContent=document.body.classList.contains('dark')?'☀':'☾';
  });
}

function roleTarget(id){
  return id==='teacher'?'teacher-save.html':id==='computer'?'computer-save.html':'student-save.html';
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

async function loadJSON(path){
  const candidates=[path];
  if(location.pathname.includes('/frontend/')) candidates.push('../'+path);
  let last;
  for(const candidate of candidates){try{const r=await fetch(candidate,{cache:'no-store'});if(r.ok)return await r.json();last=new Error('HTTP '+r.status+' '+candidate)}catch(e){last=e}}
  throw last||new Error('Cannot load '+path);
}

function params(){ return new URLSearchParams(location.search); }

async function initRoles(){
  const grid=document.getElementById('roleGrid');
  if(!grid) return;
  const roles=await loadJSON('data/roles.json');
  const html=roles.map(r=>`
    <button class="role-card" data-role="${r.id}" type="button">
      <img src="${r.image}" alt="${escapeHtml(r.name)}">
      <div><h3>${escapeHtml(r.name)}</h3><p>${escapeHtml(r.description)}</p></div>
      <span>→</span>
    </button>`).join('');
  grid.innerHTML=html;
  document.querySelectorAll('.role-card').forEach(b=>{
    b.addEventListener('click',()=>location.href=roleTarget(b.dataset.role));
  });
}

function bindGlobal(){
  applyTheme();

  document.querySelectorAll('#themeBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      localStorage.setItem(THEME_KEY, localStorage.getItem(THEME_KEY)==='dark'?'light':'dark');
      applyTheme();
    });
  });

  document.getElementById('profileBtn')?.addEventListener('click',()=>location.href='profile.html');

  // Any avatar that is not already a link works as the profile button.
  document.querySelectorAll('.avatar:not(a)').forEach(a=>{
    if(a.id==='profileBtn') return;
    a.setAttribute('role','button');
    a.setAttribute('tabindex','0');
    a.addEventListener('click',()=>location.href='profile.html');
    a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')location.href='profile.html';});
  });

  // The purple logo is now the switch for the two question-edit pages.
  const pageMenu=document.getElementById('pageMenu');
  const pagePasswordModal=document.getElementById('pagePasswordModal');
  const pagePassword=document.getElementById('pagePassword');
  const pagePasswordMsg=document.getElementById('pagePasswordMsg');
  let pendingPage='';
  document.getElementById('pageSwitchBtn')?.addEventListener('click',()=>{
    pageMenu?.classList.remove('hidden');
  });
  document.getElementById('closePageMenu')?.addEventListener('click',()=>pageMenu?.classList.add('hidden'));
  document.getElementById('closePagePassword')?.addEventListener('click',()=>pagePasswordModal?.classList.add('hidden'));
  function openPagePassword(page){
    pendingPage=page;
    if(pagePassword){pagePassword.value='';pagePassword.focus();}
    if(pagePasswordMsg)pagePasswordMsg.textContent='';
    pagePasswordModal?.classList.remove('hidden');
    pageMenu?.classList.add('hidden');
  }
  document.getElementById('addPage1Btn')?.addEventListener('click',()=>openPagePassword('1'));
  document.getElementById('addPage2Btn')?.addEventListener('click',()=>openPagePassword('2'));
  function unlockSelectedPage(){
    if(pagePassword?.value==='AK1234'){
      if(pendingPage==='1'){
        sessionStorage.setItem('computerEditorUnlocked','1');
        location.href='computer-question-paper.html';
      }else if(pendingPage==='2'){
        sessionStorage.setItem('practiceEditorUnlocked','1');
        location.href='practice-question-paper.html?class=5&semester=1&subject=bangla';
      }
    }else if(pagePasswordMsg){
      pagePasswordMsg.textContent='this is wrong password';
    }
  }
  document.getElementById('unlockPage')?.addEventListener('click',unlockSelectedPage);
  pagePassword?.addEventListener('keydown',e=>{if(e.key==='Enter')unlockSelectedPage()});

  document.getElementById('closeProfilePanel')?.addEventListener('click',()=>{
    document.getElementById('profilePanel')?.classList.add('hidden');
  });
  document.querySelectorAll('.side-overlay').forEach(x=>x.addEventListener('click',e=>{
    if(e.target===x)x.classList.add('hidden');
  }));
}

document.addEventListener('DOMContentLoaded',()=>{
  bindGlobal();
  initRoles().catch(console.error);
});

</script><script data-internal-js="js/practice-question-paper.js">
const MAX=20,BANK_KEY='practiceQuestionBanksV1',SEM=['1','2','3','4'];
const SUBJECTS={
'class5':['bangla','english','physics','life-science','mathematics','geography','history'],'class6':['bangla','english','physics','life-science','mathematics','geography','history'],'class7':['bangla','english','physics','life-science','mathematics','geography','history'],'class8':['bangla','english','physics','life-science','mathematics','geography','history'],'class9':['bangla','english','physics','life-science','mathematics','geography','history'],'class10':['bangla','english','physics','life-science','mathematics','geography','history'],'class11-science':['bangla','english','physics','life-science','mathematics','computer-science'],'class12-science':['bangla','english','physics','life-science','mathematics','computer-science'],'class11-commerce':['accountancy','commercial-law','cost-tax','business-studies'],'class12-commerce':['accountancy','commercial-law','cost-tax','business-studies'],'class11-arts':['bangla','english','geography','history','political-science','রাষ্ট্রবিজ্ঞান'],'class12-arts':['bangla','english','geography','history','political-science','রাষ্ট্রবিজ্ঞান']};
const NAMES={bangla:'Bengali',english:'English',physics:'Physics','life-science':'Life Science',mathematics:'Mathematics',geography:'Geography',history:'History','computer-science':'Computer Science',accountancy:'Accountancy','commercial-law':'Commercial Law','cost-tax':'Cost Tax','business-studies':'Business Studies','political-science':'Political Science','রাষ্ট্রবিজ্ঞান':'রাষ্ট্রবিজ্ঞান'};
let cls=params().get('class')||'class5',sem=(params().get('semester')||'1').match(/[1-4]/)?.[0]||'1',sub=params().get('subject')||'bangla',bank={},editing=null;
if(sessionStorage.getItem('practiceEditorUnlocked')!=='1')location.href='index.html';
const esc=s=>escapeHtml(s);function read(){try{return JSON.parse(localStorage.getItem(BANK_KEY)||'{}')}catch{return {}}}function key(){return `${cls}|${sem}|${sub}`}
function baseQuestions(){
  const name=NAMES[sub]||sub;
  const templates=[
    ['mcq',`What is a key topic of ${name}?`,['Basic concept','Advanced concept','Historical note','None of these'],'Basic concept',1,'The first option is the sample correct answer.'],
    ['mcq',`${name}: Which option is most appropriate?`,['Option A','Option B','Option C','Option D'],'Option B',1,'Option B is the sample answer.'],
    ['true_false',`${name} — Practice statement 3`,null,null,1,'This is a sample True/False solution.'],

    ['mcq',`${name} practice question 6`,['First','Second','Third','Fourth'],'First',1,'First is the sample answer.'],
    ['fill_blank',`${name} — Complete the statement.`,null,'correct answer',1,'The blank should contain the model answer.'],
    ['mcq',`${name} practice question 8`,['A','B','C','D'],'C',1,'C is the sample answer.'],
    ['true_false',`${name} — Practice statement 9`,null,null,1,'This is a sample True/False solution.'],
    ['short',`${name} — Mention one feature.`,null,'One relevant feature.',2,'The model answer gives one valid feature.'],
    ['mcq',`${name} practice question 11`,['Correct','Wrong','Maybe','Not given'],'Correct',1,'Correct is the sample answer.'],
    ['mcq',`${name} practice question 12`,['One','Two','Three','Four'],'Two',1,'Two is the sample answer.'],
    ['fill_blank',`${name} — Fill in the missing word.`,null,'important term',1,'The model answer is the important term.'],
    ['mcq',`${name} practice question 14`,['North','South','East','West'],'East',1,'East is the sample answer.'],
    ['true_false',`${name} — Practice statement 15`,null,null,1,'This is a sample True/False solution.'],
    ['short',`${name} — Give a short answer.`,null,'A concise correct answer.',2,'The model answer is a concise correct response.'],
    ['mcq',`${name} practice question 17`,['Yes','No','Both','Neither'],'Yes',1,'Yes is the sample answer.'],
    ['mcq',`${name} practice question 18`,['10','20','30','40'],'20',1,'20 is the sample answer.'],
    ['fill_blank',`${name} — Complete the key term.`,null,'practice term',1,'The model answer completes the term.'],
    ['short',`${name} — Write a brief note.`,null,'A brief note on the topic.',2,'The model answer is a short note.']
  ]
  return templates.map((t,i)=>{let q={type:t[0],question:t[1],marks:t[4],answer:t[3],explanation:t[5]};if(t[0]==='mcq')q.options=t[2];if(t[0]==='true_false')q.answer=i%2?'মিথ্যা':'সত্য';return q});
}
async function seed(){bank=read();const k=key();if(!Array.isArray(bank[k])){try{const r=await fetch(`data/practice/${cls}/semester-${sem}/${sub}.json`);const d=await r.json();bank[k]=(d.questions||[]).slice(0,MAX)}catch{bank[k]=baseQuestions().slice(0,MAX)}}else bank[k]=bank[k].slice(0,MAX);localStorage.setItem(BANK_KEY,JSON.stringify(bank))}
function fillSubjects(){const sel=document.getElementById('editorSubject');sel.innerHTML=(SUBJECTS[cls]||[]).map(s=>`<option value="${esc(s)}">${esc(NAMES[s]||s)}</option>`).join('');if(!SUBJECTS[cls].includes(sub))sub=SUBJECTS[cls][0];sel.value=sub}
function render(){document.getElementById('editorClass').value=cls;document.getElementById('editorSemester').value=sem;fillSubjects();document.getElementById('editorSubject').value=sub;const qs=bank[key()]||[];document.getElementById('subjectTitle').textContent=`${NAMES[sub]||sub} • ${cls.replace('class','Class ')} • Semester ${sem}`;document.getElementById('questionCount').textContent=`${qs.length} / ${MAX} Questions`;document.getElementById('questionList').innerHTML=qs.map((q,i)=>`<article class="question-row"><span class="q-number">${i+1}</span><div class="q-info"><h3>${esc(q.question||'Untitled Question')}</h3><p>${esc(typeName(q.type))} • ${q.marks||1} Mark${Number(q.marks||1)>1?'s':''}</p></div><div class="row-actions"><button class="edit-btn" data-edit="${i}">✎ Edit</button><button class="delete-btn" data-delete="${i}">🗑 Delete</button></div></article>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeQuestion(Number(b.dataset.delete)))}
function typeName(t){return({mcq:'MCQ',short:'Short Answer',true_false:'True / False',fill_blank:'Fill in the Blank',paragraph:'Paragraph',essay:'Essay'})[t]||'Question'}
function openEditor(i){editing=i;const q=bank[key()][i]||{type:'mcq',question:'',options:['','','',''],answer:'',marks:1};document.getElementById('modalEyebrow').textContent=`QUESTION ${i+1}`;document.getElementById('qType').value=q.type||'mcq';document.getElementById('qMarks').value=q.marks||1;document.getElementById('qText').value=q.question||'';document.getElementById('editorError').textContent='';extra(q);document.getElementById('editorModal').classList.remove('hidden')}
function extra(q={}){const type=document.getElementById('qType').value,box=document.getElementById('qExtra');if(type==='mcq'){const o=q.options||['','','',''];box.innerHTML=`<div class="option-editor">${[0,1,2,3].map(i=>`<div class="option-line"><b>${String.fromCharCode(65+i)})</b><input id="opt${i}" value="${esc(o[i]||'')}" placeholder="Option ${String.fromCharCode(65+i)}"></div>`).join('')}</div><div class="answer-row"><select id="qAnswer"><option value="">Correct option</option>${[0,1,2,3].map(i=>`<option value="${i}" ${(o[i]||'')===q.answer?'selected':''}>${String.fromCharCode(65+i)}) ${esc(o[i]||'Option '+String.fromCharCode(65+i))}</option>`).join('')}</select><textarea id="qExplanation" rows="3" placeholder="Solution">${esc(q.explanation||'')}</textarea></div>`}else if(type==='true_false')box.innerHTML=`<div class="answer-row"><select id="qAnswer"><option value="সত্য" ${q.answer==='সত্য'?'selected':''}>সত্য</option><option value="মিথ্যা" ${q.answer==='মিথ্যা'?'selected':''}>মিথ্যা</option></select><textarea id="qExplanation" rows="3" placeholder="Solution">${esc(q.explanation||'')}</textarea></div>`;else box.innerHTML=`<div class="answer-row"><input id="qAnswer" value="${esc(q.answer||'')}" placeholder="Correct / Model Answer"><textarea id="qExplanation" rows="3" placeholder="Solution">${esc(q.explanation||'')}</textarea></div>`}
function addQuestion(){if(bank[key()].length>=MAX)return alert('একটি Class + Semester + Subject-এ সর্বোচ্চ ২০টি প্রশ্ন রাখা যাবে।');bank[key()].push({type:'mcq',question:'',options:['','','',''],answer:'',marks:1});openEditor(bank[key()].length-1)}
function saveEditor(){const err=document.getElementById('editorError'),text=document.getElementById('qText').value.trim(),type=document.getElementById('qType').value,marks=Math.max(1,Math.min(20,Number(document.getElementById('qMarks').value)||1));if(!text){err.textContent='Question লিখুন।';return}let q={type,question:text,marks};if(type==='mcq'){q.options=[0,1,2,3].map(i=>document.getElementById('opt'+i).value.trim());if(q.options.some(x=>!x)){err.textContent='চারটি option পূরণ করুন।';return}const ai=Number(document.getElementById('qAnswer').value);if(!Number.isInteger(ai)){err.textContent='Correct option নির্বাচন করুন।';return}q.answer=q.options[ai]}else{q.answer=document.getElementById('qAnswer').value.trim();if(!q.answer){err.textContent='Correct / Model Answer লিখুন।';return}}q.explanation=document.getElementById('qExplanation')?.value.trim()||'';bank[key()][editing]=q;localStorage.setItem(BANK_KEY,JSON.stringify(bank));closeEditor();render();document.getElementById('saveMsg').textContent='✓ Question saved.'}
function removeQuestion(i){if(!confirm(`Question ${i+1} delete করবেন?`))return;bank[key()].splice(i,1);localStorage.setItem(BANK_KEY,JSON.stringify(bank));render()}function closeEditor(){document.getElementById('editorModal').classList.add('hidden')}
document.getElementById('editorClass').onchange=async e=>{cls=e.target.value;sub=SUBJECTS[cls][0];await seed();render()};document.getElementById('editorSemester').onchange=async e=>{sem=e.target.value;await seed();render()};document.getElementById('editorSubject').onchange=async e=>{sub=e.target.value;await seed();render()};document.getElementById('addQuestion').onclick=addQuestion;document.getElementById('saveEditor').onclick=saveEditor;document.getElementById('cancelEditor').onclick=closeEditor;document.getElementById('closeEditor').onclick=closeEditor;document.getElementById('qType').onchange=()=>extra({});seed().then(render);

</script></body></html>
