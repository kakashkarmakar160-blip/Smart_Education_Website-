<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMR Examination</title>
<style>
*{box-sizing:border-box}:root{--bg:#f7f8fc;--card:#fff;--text:#111a35;--muted:#687089;--line:#e7e8f0;--primary:#5b22c9;--primary2:#7744e8;--soft:#f1edff;--shadow:0 12px 40px rgba(34,25,75,.08)}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif}.dark{--bg:#10111a;--card:#191b27;--text:#f7f7fb;--muted:#a9aec1;--line:#2d3040;--soft:#28213d}.topbar{height:70px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:21px}.icon{width:44px;height:44px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;font-size:20px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6d35d4,#9c6af1);font-weight:900}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}.paper{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.head{padding:28px 30px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;font-weight:900;letter-spacing:1.7px;color:var(--primary);margin:0}.head h1{margin:6px 0;font-size:34px}.head p{color:var(--muted)}.form{padding:28px 30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field.full{grid-column:1/-1}.field label{font-weight:800}.field input,.field select{padding:13px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;font:inherit;outline:none}.field input:focus,.field select:focus{border-color:var(--primary)}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.set{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:14px;border-radius:12px;font-weight:900;cursor:pointer}.set.active{border-color:var(--primary);background:var(--soft);color:var(--primary)}.info{padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--soft);margin:10px 0 20px;color:var(--text)}.primary{width:100%;border:0;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:14px 18px;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer}.msg{color:#b3261e;font-weight:800;margin:8px 0}.hidden{display:none}@media(max-width:600px){.topbar{padding:0 12px}.brand{font-size:17px}.head,.form{padding:22px 18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.sets{grid-template-columns:repeat(2,1fr)}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body><header class="topbar"><button class="icon" id="back">←</button><div class="brand">OMR Examination</div><div style="display:flex;gap:9px;align-items:center"><button class="icon" id="theme">☾</button><div class="avatar">AK</div></div></header>
<main class="wrap"><section class="paper"><div class="head"><p class="eyebrow">OMR EXAMINATION</p><h1>Student</h1><p id="meta">Enter your details before starting the examination.</p></div><div class="form"><div class="grid"><div class="field"><label>Registration No. *</label><input id="reg" placeholder="Enter registration number" autocomplete="off"></div><div class="field"><label>Roll No. *</label><input id="roll" placeholder="Enter roll number" autocomplete="off"></div><div class="field"><label>Name of the Student *</label><input id="name" placeholder="Enter your name" autocomplete="name"></div><div class="field full"><label>Question Booklet Set *</label><div class="sets" id="sets"></div></div></div><div class="info" id="info">Question Booklet Set নির্বাচন করুন। Teacher যে set দিয়েছেন সেটিই নির্বাচন করুন।</div><div class="msg" id="msg"></div><button class="primary" id="start">LET'S START EXAM</button></div></section></main>
<script>
const THEME_KEY='smartEduTheme';function apply(){document.body.classList.toggle('dark',localStorage.getItem(THEME_KEY)==='dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'☀':'☾';}apply();document.getElementById('theme').onclick=()=>{localStorage.setItem(THEME_KEY,localStorage.getItem(THEME_KEY)==='dark'?'light':'dark');apply();};
const data=JSON.parse(sessionStorage.getItem('teacherExam')||'null');if(!data){location.href='student-paper.html';}
const qs=Array.isArray(data?.questions)?data.questions:[];const sets=['W','X','Y','Z'];let selected='W';const setCounts=Object.fromEntries(sets.map(s=>[s,qs.filter(q=>q.type==='omr'&&String(q.omrSet||'W').toUpperCase()===s).length]));
const setBox=document.getElementById('sets');sets.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='set'+(s===selected?' active':'');b.textContent=s+(setCounts[s]?` (${setCounts[s]})`:'');b.onclick=()=>{selected=s;document.querySelectorAll('.set').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('info').textContent=setCounts[s]?`Set ${s}-এ ${setCounts[s]}টি question আছে।`: `Set ${s}-এ এখনো কোনো question তৈরি করা হয়নি।`;};setBox.appendChild(b);});
try{const p=JSON.parse(localStorage.getItem('studentProfile')||'{}');if(p.name)document.getElementById('name').value=p.name;}catch{}
document.getElementById('back').onclick=()=>history.back();
document.getElementById('start').onclick=()=>{const reg=document.getElementById('reg').value.trim(),roll=document.getElementById('roll').value.trim(),name=document.getElementById('name').value.trim();if(!reg){document.getElementById('msg').textContent='Registration No. দিন।';return;}if(!roll){document.getElementById('msg').textContent='Roll No. দিন।';return;}if(!name){document.getElementById('msg').textContent='Student Name দিন।';return;}if(!setCounts[selected]){document.getElementById('msg').textContent=`Set ${selected}-এ কোনো question নেই। Teacher-এর তৈরি করা set নির্বাচন করুন।`;return;}sessionStorage.setItem('omrStudentInfo',JSON.stringify({registrationNo:reg,rollNo:roll,name,set:selected}));location.href='omr-exam.html';};
</script></body></html>
