<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Live Class • Smart Education"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}:root{--bg:#f7f8fc;--card:#fff;--text:#111a35;--muted:#687089;--line:#e7e8f0;--primary:#5b22c9;--primary2:#7744e8;--soft:#f1edff;--shadow:0 12px 40px rgba(34,25,75,.08)}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif}.top{height:70px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px;position:sticky;top:0;z-index:20}.back,.theme{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}.brand{font-weight:900;font-size:20px}.wrap{max-width:950px;margin:auto;padding:32px 18px 70px}.hero{padding:28px;border-radius:26px;background:linear-gradient(135deg,#fff,#f2edff);border:1px solid #e7ddff;box-shadow:var(--shadow);margin-bottom:20px}.hero h1{margin:4px 0 8px}.hero p{color:var(--muted)}.form{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:800;font-size:13px}.field input,.field select{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.primary{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:900;cursor:pointer}.outline{border:1px solid var(--line);border-radius:12px;padding:12px 18px;background:var(--card);font-weight:900;cursor:pointer}.hint{margin-top:14px;padding:12px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding:20px 14px 50px}}</style></head><body><header class="top"><button class="back" onclick="location.href='teacher-profile.html'">←</button><div class="brand">🎥 Smart Education • Live Class</div><button class="theme" id="theme">☾</button></header><main class="wrap"><section class="hero"><p style="color:#5b22c9;font-weight:900;letter-spacing:1px">TEACHER LIVE CLASS</p><h1>Create a Live Classroom</h1><p>ভিডিও database-এ save হবে না। Live connection Jitsi Meet-এর মাধ্যমে হবে এবং আপনার website শুধু class metadata/code রাখবে।</p></section><section class="form"><div class="grid"><div class="field full"><label>Class Title</label><input id="title" placeholder="যেমন: Physics — Current Electricity"></div><div class="field"><label>Class</label><input id="className" placeholder="Class 12"></div><div class="field"><label>Semester</label><input id="semester" placeholder="1st Semester"></div><div class="field"><label>Subject</label><input id="subject" placeholder="Physics"></div><div class="field"><label>Chapter / Topic</label><input id="chapter" placeholder="Current Electricity"></div><div class="field"><label>Start Time</label><input id="start" type="datetime-local"></div><div class="field"><label>Duration</label><select id="duration"><option value="30">30 Minutes</option><option value="45">45 Minutes</option><option value="60" selected>60 Minutes</option><option value="90">90 Minutes</option><option value="120">120 Minutes</option><option value="180">180 Minutes</option></select></div></div><div class="hint">Teacher Live Class-এ Camera, Mic, Screen Share, Chat, Whiteboard/Annotation, Student controls এবং countdown timer থাকবে।</div><div class="actions"><button class="primary" id="create">🔴 Create & Start Live Class</button><button class="outline" onclick="location.href='teacher-profile.html'">Cancel</button></div></section></main><script>const $=id=>document.getElementById(id);function code(){return 'LC-'+Math.random().toString(36).slice(2,8).toUpperCase()}function room(){return 'SmartEdu'+code().replace(/-/g,'')+Math.random().toString(36).slice(2,7)}async function user(){const r=await supabaseClient.auth.getUser();return r.data.user}async function profile(){const u=await user();if(!u)return null;const r=await supabaseClient.from('profiles').select('*').eq('id',u.id).maybeSingle();return r.data}function localISO(){const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}$('start').value=localISO();$('create').onclick=async()=>{try{const u=await user();if(!u)throw Error('Teacher login required');const pr=await profile();const title=$('title').value.trim();if(!title)throw Error('Class Title দিন।');const c=code();const r=room();const start=new Date($('start').value).toISOString();const payload={live_code:c,room_name:r,teacher_user_id:u.id,teacher_name:pr?.name||u.user_metadata?.display_name||'Teacher',title,class_name:$('className').value.trim(),semester:$('semester').value.trim(),subject:$('subject').value.trim(),chapter:$('chapter').value.trim(),starts_at:start,duration_minutes:+$('duration').value,status:'live'};const {data,error}=await supabaseClient.from('live_classes').insert(payload).select().single();if(error)throw error;location.href=`live-class.html?code=${encodeURIComponent(data.live_code)}&role=teacher`}catch(e){alert(e.message)}};$('theme').onclick=()=>document.body.classList.toggle('dark');</script></body></html>
