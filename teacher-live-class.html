<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Live Class • Smart Education</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
*{box-sizing:border-box}
:root{--bg:#f7f8fc;--card:#fff;--text:#111a35;--muted:#687089;--line:#e7e8f0;--primary:#5b22c9;--primary2:#7744e8;--soft:#f1edff;--shadow:0 12px 40px rgba(34,25,75,.08)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif;line-height:1.55}
body.dark{--bg:#10111a;--card:#191b27;--text:#f7f7fb;--muted:#a9aec1;--line:#2d3040;--soft:#28213d;--shadow:0 12px 40px rgba(0,0,0,.25)}
.topbar{height:70px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}
.dark .topbar{background:rgba(16,17,26,.92)}
.brand{font-size:22px;font-weight:800;letter-spacing:-.4px}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);width:44px;height:44px;border-radius:14px;cursor:pointer;font-size:19px;display:grid;place-items:center}
.container{max-width:1180px;margin:auto;padding:28px 22px 70px}
.hero{min-height:210px;border:1px solid #eee8ff;border-radius:28px;padding:34px 42px;display:flex;justify-content:space-between;align-items:center;background:radial-gradient(circle at 85% 50%,#eee7ff,transparent 35%),linear-gradient(135deg,#fff,#f4f0ff);box-shadow:var(--shadow);overflow:hidden}
.dark .hero{background:linear-gradient(135deg,#1d1d2a,#211c35);border-color:var(--line)}
.hero h1{font-size:40px;line-height:1.15;margin:8px 0 12px;letter-spacing:-1.3px}
.hero h1 span{color:#5e38d2}.hero p{color:var(--muted);max-width:680px}.hero-art{font-size:80px}
.form-card{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--primary);margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:800;font-size:13px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #5b22c91a}
.hint{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--soft);color:var(--muted);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.primary,.outline{border-radius:13px;padding:12px 18px;font-weight:900;cursor:pointer;text-decoration:none}.primary{border:0;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}.outline{border:1px solid var(--line);background:var(--card);color:var(--text)}
@media(max-width:700px){.topbar{padding:0 14px}.brand{font-size:17px}.container{padding:18px 14px 50px}.hero{padding:25px 22px;min-height:auto}.hero h1{font-size:30px}.hero-art{font-size:55px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body>
<header class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="icon-btn" onclick="location.href='teacher-profile.html'" aria-label="Back">←</button>
    <div class="brand">Smart Education</div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="theme" aria-label="Dark mode">☾</button>
    <button class="icon-btn" onclick="location.href='teacher-profile.html'" aria-label="Profile">👤</button>
  </div>
</header>
<main class="container">
  <section class="hero">
    <div>
      <p class="eyebrow">TEACHER • LIVE CLASS</p>
      <h1>Create <span>Live Classroom</span></h1>
      <p>একটি Live Class তৈরি করুন। Video site-এর database-এ save হবে না; live connection Jitsi Meet-এর মাধ্যমে হবে।</p>
    </div>
    <div class="hero-art">🎥</div>
  </section>
  <section class="form-card">
    <p class="eyebrow">CLASS INFORMATION</p>
    <div class="grid">
      <div class="field full"><label>Class Title</label><input id="title" placeholder="যেমন: Physics — Current Electricity"></div>
      <div class="field"><label>Class</label><input id="className" placeholder="Class 12"></div>
      <div class="field"><label>Semester</label><input id="semester" placeholder="1st Semester"></div>
      <div class="field"><label>Subject</label><input id="subject" placeholder="Physics"></div>
      <div class="field"><label>Chapter / Topic</label><input id="chapter" placeholder="Current Electricity"></div>
      <div class="field"><label>Start Time</label><input id="start" type="datetime-local"></div>
      <div class="field"><label>Duration</label><select id="duration"><option value="30">30 Minutes</option><option value="45">45 Minutes</option><option value="60" selected>60 Minutes</option><option value="90">90 Minutes</option><option value="120">120 Minutes</option><option value="180">180 Minutes</option></select></div>
    </div>
    <div class="hint">🎤 Mic • 📷 Camera • 🖥️ Screen Share • 💬 Chat • ✏️ Whiteboard/Annotation • ⭐ Student Rating • 🚫 Block/Kick</div>
    <div class="actions">
      <button class="primary" id="create">🔴 Create & Start Live Class</button>
      <button class="outline" onclick="location.href='teacher-profile.html'">Cancel</button>
    </div>
  </section>
</main>
<script>const $=id=>document.getElementById(id);function code(){return 'LC-'+Math.random().toString(36).slice(2,8).toUpperCase()}function room(){return 'SmartEdu'+code().replace(/-/g,'')+Math.random().toString(36).slice(2,7)}async function user(){const r=await supabaseClient.auth.getUser();return r.data.user}async function profile(){const u=await user();if(!u)return null;const r=await supabaseClient.from('profiles').select('*').eq('id',u.id).maybeSingle();return r.data}function localISO(){const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}$('start').value=localISO();$('create').onclick=async()=>{try{const u=await user();if(!u)throw Error('Teacher login required');const pr=await profile();const title=$('title').value.trim();if(!title)throw Error('Class Title দিন।');const c=code();const r=room();const start=new Date($('start').value).toISOString();const payload={live_code:c,room_name:r,teacher_user_id:u.id,teacher_name:pr?.name||u.user_metadata?.display_name||'Teacher',title,class_name:$('className').value.trim(),semester:$('semester').value.trim(),subject:$('subject').value.trim(),chapter:$('chapter').value.trim(),starts_at:start,duration_minutes:+$('duration').value,status:'live'};const {data,error}=await supabaseClient.from('live_classes').insert(payload).select().single();if(error)throw error;location.href=`live-class.html?code=${encodeURIComponent(data.live_code)}&role=teacher`}catch(e){alert(e.message)}};$('theme').onclick=()=>document.body.classList.toggle('dark');</script></body></html>
