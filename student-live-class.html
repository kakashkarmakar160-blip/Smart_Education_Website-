<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Live Class • Smart Education</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
*{box-sizing:border-box}
:root{--bg:#f7f8fc;--card:#fff;--text:#111a35;--muted:#687089;--line:#e7e8f0;--primary:#5b22c9;--primary2:#7744e8;--soft:#f1edff;--shadow:0 12px 40px rgba(34,25,75,.08)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif;line-height:1.55}
body.dark{--bg:#10111a;--card:#191b27;--text:#f7f7fb;--muted:#a9aec1;--line:#2d3040;--soft:#28213d;--shadow:0 12px 40px rgba(0,0,0,.25)}
.topbar{height:70px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}
.dark .topbar{background:rgba(16,17,26,.92)}
.brand{font-size:22px;font-weight:800;letter-spacing:-.4px}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);width:44px;height:44px;border-radius:14px;cursor:pointer;font-size:19px;display:grid;place-items:center}
.container{max-width:1180px;margin:auto;padding:28px 22px 70px}
.hero{min-height:210px;border:1px solid #eee8ff;border-radius:28px;padding:34px 42px;display:flex;justify-content:space-between;align-items:center;background:radial-gradient(circle at 85% 50%,#eee7ff,transparent 35%),linear-gradient(135deg,#fff,#f4f0ff);box-shadow:var(--shadow);overflow:hidden}
.dark .hero{background:linear-gradient(135deg,#1d1d2a,#211c35);border-color:var(--line)}
.hero h1{font-size:40px;line-height:1.15;margin:8px 0 12px;letter-spacing:-1.3px}
.hero h1 span{color:#5e38d2}.hero p{color:var(--muted);max-width:680px}.hero-art{font-size:80px}
.form-card{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--primary);margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:800;font-size:13px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #5b22c91a}
.hint{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--soft);color:var(--muted);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.primary,.outline{border-radius:13px;padding:12px 18px;font-weight:900;cursor:pointer;text-decoration:none}.primary{border:0;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}.outline{border:1px solid var(--line);background:var(--card);color:var(--text)}
@media(max-width:700px){.topbar{padding:0 14px}.brand{font-size:17px}.container{padding:18px 14px 50px}.hero{padding:25px 22px;min-height:auto}.hero h1{font-size:30px}.hero-art{font-size:55px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body>
<header class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="icon-btn" onclick="location.href='student-profile.html'">←</button>
    <div class="brand">Smart Education</div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="theme">☾</button>
    <button class="icon-btn" onclick="location.href='student-profile.html'">👤</button>
  </div>
</header>
<main class="container">
  <section class="hero">
    <div><p class="eyebrow">STUDENT • LIVE CLASS</p><h1>Join <span>Live Class</span></h1><p>Teacher-এর দেওয়া Live Code ব্যবহার করে আপনার Live Classroom-এ প্রবেশ করুন।</p></div>
    <div class="hero-art">🎥</div>
  </section>
  <section class="form-card">
    <p class="eyebrow">LIVE CLASS CODE</p>
    <div class="field" style="margin-top:18px"><label>Live Code</label><input id="code" placeholder="যেমন: LC-ABC123" autocomplete="off"></div>
    <div class="hint">Teacher-এর দেওয়া code ঠিকভাবে লিখুন। Class শুরু হওয়ার পর আপনি Camera, Mic, Chat ও Screen Share-এর অনুমতি ব্যবহার করতে পারবেন।</div>
    <div class="actions"><button class="primary" id="join">🎥 Join Live Class</button><button class="outline" onclick="location.href='student-profile.html'">Cancel</button></div>
  </section>
</main>
<script>const $=id=>document.getElementById(id);$('join').onclick=async()=>{const c=$('code').value.trim().toUpperCase();if(!c)return $('msg').textContent='Live Code দিন।';const {data,error}=await supabaseClient.from('live_classes').select('id,live_code,status').eq('live_code',c).maybeSingle();if(error||!data)return $('msg').textContent='Live Class পাওয়া যায়নি।';if(data.status==='ended'||data.status==='cancelled')return $('msg').textContent='এই Live Class শেষ হয়ে গেছে।';location.href=`live-class.html?code=${encodeURIComponent(c)}&role=student`};$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('join').click()});$('theme').onclick=()=>document.body.classList.toggle('dark');</script></body></html>
