<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Live Class • Smart Education"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}:root{--bg:#f7f8fc;--card:#fff;--text:#111a35;--muted:#687089;--line:#e7e8f0;--primary:#5b22c9;--primary2:#7744e8;--soft:#f1edff;--shadow:0 12px 40px rgba(34,25,75,.08)}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif}.top{height:70px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px}.back,.theme{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}.brand{font-weight:900;font-size:20px}.wrap{max-width:700px;margin:auto;padding:50px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow);text-align:center}.card h1{margin:4px 0 8px}.card p{color:var(--muted)}input{width:100%;padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);font-size:18px;text-align:center;letter-spacing:1px}.primary{width:100%;margin-top:12px;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:900;font-size:16px;cursor:pointer}.msg{margin-top:12px;color:#c62828;font-weight:800}</style></head><body><header class="top"><button class="back" onclick="location.href='student-profile.html'">←</button><div class="brand">🎥 Smart Education • Live Class</div><button class="theme" id="theme">☾</button></header><main class="wrap"><section class="card"><div style="font-size:54px">🔴</div><h1>Join Live Class</h1><p>Teacher-এর দেওয়া Live Code লিখুন।</p><input id="code" placeholder="LC-XXXXXX" autocomplete="off"><button class="primary" id="join">Join Live Class</button><div id="msg" class="msg"></div></section></main><script>const $=id=>document.getElementById(id);$('join').onclick=async()=>{const c=$('code').value.trim().toUpperCase();if(!c)return $('msg').textContent='Live Code দিন।';const {data,error}=await supabaseClient.from('live_classes').select('id,live_code,status').eq('live_code',c).maybeSingle();if(error||!data)return $('msg').textContent='Live Class পাওয়া যায়নি।';if(data.status==='ended'||data.status==='cancelled')return $('msg').textContent='এই Live Class শেষ হয়ে গেছে।';location.href=`live-class.html?code=${encodeURIComponent(c)}&role=student`};$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('join').click()});$('theme').onclick=()=>document.body.classList.toggle('dark');</script><script id="smartEduGlobalDesign">(()=>{try{const d=JSON.parse(localStorage.getItem('smartEduCustomDesignV1')||'{}');if(!Object.keys(d).length)return;const st=document.createElement('style');st.textContent=`:root{--bg:${d.bg||'#f7f8fc'};--user-font:${Number(d.font)||16}px;--user-radius:${Number(d.radius)||20}px}body{font-size:var(--user-font)!important;background-color:${d.bg||''}!important;${d.image?`background-image:linear-gradient(#ffffff88,#ffffff88),url("${d.image}")!important;background-size:cover!important;background-attachment:fixed!important;`:''}}.card,.panel,.history-card,.teacher-paper,.student-resource,.student-category,.role-card,.tool-card,.box{border-radius:var(--user-radius)!important;filter:brightness(${Number(d.bright||100)/100})}.card,.panel,.history-card,.teacher-paper,.student-resource,.student-category,.role-card,.tool-card{zoom:${Number(d.box||100)/100}}`;document.head.appendChild(st)}catch(e){console.warn('Design settings',e)}})();</script></body></html>
