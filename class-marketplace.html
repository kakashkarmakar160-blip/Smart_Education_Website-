<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Education Class Marketplace</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
:root{--bg:#f6f7fc;--card:#fff;--ink:#182039;--muted:#68728b;--line:#e6e8f0;--p:#612bd1;--soft:#f0eaff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,'Noto Sans Bengali',sans-serif}header{background:#171522;color:white;padding:16px max(16px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}header a{color:white;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:22px 16px 60px}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tabs button,.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--p);color:white;font-weight:700;cursor:pointer;white-space:nowrap}.tabs button{background:white;color:var(--ink);border:1px solid var(--line)}.tabs button.active{background:var(--p);color:white}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px #2020440b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;color:#182039;font:inherit}textarea{min-height:90px}.full{grid-column:1/-1}.muted{color:var(--muted)}.hidden{display:none!important}.cover{width:100%;height:145px;object-fit:cover;border-radius:12px;background:var(--soft)}.item{display:flex;flex-direction:column;gap:9px}.price{font-size:23px;font-weight:900;color:#13834c}.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#eee9fa;color:#4f26a5}.danger{background:#ffe8e8;color:#b42318}.status{font-size:12px;border-radius:20px;padding:4px 9px;background:#fff4d9;color:#875b00;display:inline-block}.status.ok{background:#e1f7e9;color:#16723a}.status.no{background:#ffe8e8;color:#b42318}.notice{padding:12px;background:#f0eaff;border-radius:10px;margin:12px 0}.resource{border-top:1px solid var(--line);padding:12px 0}.resource a{color:var(--p);font-weight:700}
/* Student class resource experience */
.student-categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.student-category{border:1px solid #e7e8f3;border-radius:20px;padding:20px 12px;min-height:132px;text-align:center;font-weight:800;color:#15234c;cursor:pointer;box-shadow:0 5px 18px #20204412;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.student-category .ico{font-size:42px;line-height:1.2}.student-category small{font-weight:600;color:#45516d}
.student-resource{display:grid;grid-template-columns:105px 1fr;gap:14px;align-items:center;border:1px solid #e4e8f3;border-radius:18px;padding:12px;margin:12px 0;background:white;box-shadow:0 5px 18px #2020440d}
.student-teacher-photo{width:105px;height:145px;object-fit:cover;border-radius:13px;background:#eaf2ff}
.student-resource h3{margin:3px 0 8px}.student-resource p{margin:5px 0;color:#58627a}.student-resource-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.student-resource-actions a,.student-resource-actions button{display:inline-block;text-decoration:none;border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:#612bd1;color:white}.student-resource-actions .download{background:#e8f7ed;color:#16723a}
.student-teacher-head{display:flex;align-items:center;gap:13px;padding:13px;background:#fff;border:1px solid #e6e8f0;border-radius:16px;margin:12px 0}.student-teacher-head img{width:66px;height:66px;border-radius:50%;object-fit:cover;background:#eaf2ff}.student-back{margin:12px 0}.student-category-view{min-height:55vh}.student-category-view .student-resource{grid-template-columns:120px 1fr}.student-category-view .student-resource h3{font-size:19px}.student-category-view .student-resource p{font-size:14px}
@media(max-width:520px){.student-resource{grid-template-columns:82px 1fr;gap:10px;padding:10px}.student-teacher-photo{width:82px;height:120px}.student-category{min-height:118px;padding:14px 8px}.student-category .ico{font-size:36px}}
@media(max-width:620px){.fields{grid-template-columns:1fr}header{padding:13px 16px}.wrap{padding:15px 12px 50px}}
</style></head><body><header><a href="index.html"><b>🎓 Smart Education</b></a><span>Class Marketplace</span><a href="teacher-profile.html">← Profile</a></header><main class="wrap"><h1 id="heading">Class Marketplace</h1><p class="muted" id="subhead">শিক্ষকের ক্লাস তৈরি করুন অথবা প্রকাশিত ক্লাস খুঁজুন।</p><div class="tabs" id="tabs"><button data-tab="browse" class="active">Find Classes</button><button data-tab="enrolled">My Classes</button><button data-tab="mine">My Classes</button><button data-tab="create">Create Class</button><button data-tab="requests">Admission Requests</button><button data-tab="students">Manage Students</button></div><div id="msg" class="notice hidden"></div>
<section id="browse" class="view"><div class="panel"><h2>Find Your Class</h2><div class="fields"><div><label>Class</label><select id="fclass"><option value="">All Classes</option><option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select></div><div><label>Semester</label><select id="fsem"><option value="">All Semesters</option><option>Semester 1</option><option>Semester 2</option><option>Semester 3</option><option>Semester 4</option></select></div><div><label>Subject</label><input id="fsubject" placeholder="Accountancy"></div><div><label>Teacher / Class name</label><input id="fsearch" placeholder="Search"></div><button class="btn full" id="search">Search Classes</button></div></div><div class="grid" id="catalog" style="margin-top:16px"></div></section>
<section id="enrolled" class="view hidden"><div class="grid" id="enrolledlist"></div></section>
<section id="create" class="view hidden"><div class="panel"><h2>Create Your Class</h2><form id="classform" class="fields"><div><label>Class Name *</label><input name="class_name" required placeholder="Class 12 Accountancy"></div><div><label>School Class *</label><select name="school_class" required><option value="">Select</option><option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select></div><div><label>Subject Name *</label><input name="subject" required></div><div><label>Semester</label><select name="semester"><option value="">Not applicable</option><option>Semester 1</option><option>Semester 2</option><option>Semester 3</option><option>Semester 4</option></select></div><div><label>Course Price (₹) *</label><input name="price" type="number" min="0" step="1" value="0" required></div><div><label>Class Logo (image only, max 300 KB)</label><input name="logo" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="full"><label>Class Description</label><textarea name="description" placeholder="এই ক্লাসে কী শেখানো হবে..."></textarea></div><button class="btn full">Create Class</button></form></div></section>
<section id="mine" class="view hidden"><div class="grid" id="myclasses"></div></section>
<section id="requests" class="view hidden"><div class="grid" id="requestlist"></div></section>
<section id="students" class="view hidden"><div class="grid" id="studentlist"></div></section>
<section id="detail" class="view hidden"><button class="btn secondary" id="back">← Back</button><div id="detailbody" style="margin-top:14px"></div><div class="panel" style="margin-top:14px"><h3>Manage Class Details</h3><form id="editclassform" class="fields"><div><label>Class Name *</label><input name="class_name" required></div><div><label>School Class *</label><select name="school_class" required><option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select></div><div><label>Subject *</label><input name="subject" required></div><div><label>Semester</label><select name="semester"><option value="">Not applicable</option><option>Semester 1</option><option>Semester 2</option><option>Semester 3</option><option>Semester 4</option></select></div><div><label>Course Price (₹)</label><input name="price" type="number" min="0" step="1" required></div><div><label>Change Class Logo (max 300 KB)</label><input name="logo" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="full"><label>Description</label><textarea name="description"></textarea></div><div class="actions full"><button class="btn">Save Class Changes</button><button type="button" class="btn secondary" id="togglepublish">Unpublish Class</button></div></form></div><div class="panel" style="margin-top:14px"><h3>Add class resource</h3><form id="resourceform" class="fields"><input type="hidden" name="class_id"><div><label>Resource Type</label><select name="resource_type"><option>PDF</option><option>Notes</option><option>Book</option><option>Recorded Class</option><option>Live Class</option><option>Course</option></select></div><div><label>Resource Title</label><input name="title" required></div><div class="full"><label>Resource Link (https://)</label><input name="url" type="url" required placeholder="https://..."></div><div><label>Cover Image (max 300 KB)</label><input name="cover" type="file" accept="image/*"></div><div class="full"><button class="btn">Save Resource Link</button></div></form><div id="resources"></div></div></section></main>
<div id="modal" class="hidden" style="position:fixed;inset:0;background:#0008;z-index:10;display:grid;place-items:center;padding:15px"><div class="panel" style="width:min(520px,100%);max-height:95vh;overflow:auto"><h2>Class Admission Request</h2><p class="muted" id="requestclass"></p><form id="requestform" class="fields"><input type="hidden" name="class_id"><div class="full"><label>Enter your name *</label><input name="student_name" required></div><div class="full"><label>Enter your phone number *</label><input name="phone" type="tel" required></div><div class="full"><label>Enter your email *</label><input name="email" type="email" required></div><div class="full"><label>Enter your address *</label><textarea name="address" required></textarea></div><button class="btn">Submit Request</button><button type="button" class="btn secondary" id="cancel">Cancel</button></form></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),db=window.supabaseClient;let user=null,profile=null,activeClass=null,classes=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(t,bad=false){$('msg').textContent=t;$('msg').classList.remove('hidden');$('msg').style.background=bad?'#ffe9e9':'#f0eaff'}function hideMsg(){$('msg').classList.add('hidden')}function img(d){return d?`<img class="cover" src="${d}" alt="Class cover">`:`<div class="cover" style="display:grid;place-items:center;font-size:45px">🎓</div>`}async function current(){if(!db)throw Error('Supabase connection পাওয়া যায়নি।');const r=await db.auth.getUser();user=r.data.user;if(!user)throw Error('প্রথমে Smart Education-এ প্রবেশ করুন।');const p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data||{};}
function tab(name){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(name).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));hideMsg();if(name==='mine')loadMine();if(name==='requests')loadRequests();if(name==='students')loadStudents();if(name==='browse')loadCatalog();if(name==='enrolled')loadEnrolled()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));async function fileData(f){if(!f)return null;if(f.size>300*1024)throw Error('ছবির সাইজ 300 KB-এর বেশি হতে পারবে না।');if(!f.type.startsWith('image/'))throw Error('শুধু ছবি আপলোড করা যাবে।');return await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
$('classform').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target),logo=await fileData(f.get('logo'));const {error}=await db.from('teacher_classes').insert({teacher_id:user.id,class_name:f.get('class_name'),school_class:f.get('school_class'),subject:f.get('subject'),semester:f.get('semester')||null,price:Number(f.get('price')),description:f.get('description'),logo_data:logo,published:true});if(error)throw error;e.target.reset();say('ক্লাস তৈরি ও Publish হয়েছে।');tab('mine')}catch(x){say(x.message,true)}};
function classCard(c,owner=false){return `<article class="card item">${img(c.logo_data)}<h3>${esc(c.class_name)}</h3><div class="muted">${esc(c.school_class)} · ${esc(c.semester||'')} · ${esc(c.subject)}</div><div class="muted">Teacher: ${esc(c.teacher_name||'Teacher')}</div><div class="price">₹${Number(c.price||0)}</div>${owner?`<div class="actions"><button class="btn" onclick="openClass('${c.id}')">Manage Class</button><button class="btn secondary" onclick="publishClass('${c.id}',${!c.published})">${c.published?'Unpublish':'Publish'}</button></div>`:`<button class="btn" onclick="requestJoin('${c.id}','${esc(c.class_name)}')">Request to Join</button>`}</article>`}
async function loadCatalog(){try{let q=db.from('teacher_classes').select('*').eq('published',true).order('created_at',{ascending:false});if($('fclass').value)q=q.eq('school_class',$('fclass').value);if($('fsem').value)q=q.eq('semester',$('fsem').value);if($('fsubject').value)q=q.ilike('subject','%'+$('fsubject').value+'%');if($('fsearch').value){let v=$('fsearch').value;q=q.ilike('class_name','%'+v+'%')}let r=await q;if(r.error)throw r.error;classes=r.data||[];$('catalog').innerHTML=classes.map(c=>classCard(c)).join('')||'<p class="muted">কোনও Published Class পাওয়া যায়নি।</p>'}catch(e){say(e.message,true)}}$('search').onclick=loadCatalog;
window.requestJoin=(id,name)=>{$('requestclass').textContent=name;$('requestform').elements.class_id.value=id;$('modal').classList.remove('hidden')};$('cancel').onclick=()=>$('modal').classList.add('hidden');$('requestform').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target);let {error}=await db.from('class_admission_requests').insert({class_id:f.get('class_id'),student_id:user.id,student_name:f.get('student_name'),phone:f.get('phone'),email:f.get('email'),address:f.get('address'),status:'pending'});if(error)throw error;$('modal').classList.add('hidden');say('আবেদন জমা হয়েছে। শিক্ষক অনুমোদন করলে My Classes-এ দেখতে পাবে।')}catch(x){say(x.message,true)}};
async function loadMine(){try{let r=await db.from('teacher_classes').select('*').eq('teacher_id',user.id).order('created_at',{ascending:false});if(r.error)throw r.error;$('myclasses').innerHTML=(r.data||[]).map(c=>classCard(c,true)).join('')||'<p>এখনও কোনও ক্লাস তৈরি করা হয়নি।</p>'}catch(e){say(e.message,true)}}window.publishClass=async(id,v)=>{try{let r=await db.from('teacher_classes').update({published:v}).eq('id',id);if(r.error)throw r.error;loadMine()}catch(e){say(e.message,true)}};
window.openClass=async id=>{try{let r=await db.from('teacher_classes').select('*').eq('id',id).eq('teacher_id',user.id).single();if(r.error)throw r.error;activeClass=r.data;tab('detail');document.querySelectorAll('#detail > .panel').forEach(p=>p.classList.remove('hidden'));$('detailbody').innerHTML=`<div class="card">${img(activeClass.logo_data)}<h2>${esc(activeClass.class_name)}</h2><p>${esc(activeClass.subject)} · ${esc(activeClass.school_class)} · ${esc(activeClass.semester||'')}</p><b>Price: ₹${activeClass.price}</b><p>${esc(activeClass.description)}</p></div>`;const ef=$('editclassform');ef.elements.class_name.value=activeClass.class_name||'';ef.elements.school_class.value=activeClass.school_class||'Class 7';ef.elements.subject.value=activeClass.subject||'';ef.elements.semester.value=activeClass.semester||'';ef.elements.price.value=activeClass.price??0;ef.elements.description.value=activeClass.description||'';$('togglepublish').textContent=activeClass.published?'Unpublish Class':'Publish Class';$('resourceform').elements.class_id.value=id;$('resourceform').classList.remove('hidden');loadResources()}catch(e){say(e.message,true)}};$('back').onclick=()=>tab('mine');
$('editclassform').onsubmit=async e=>{e.preventDefault();try{if(!activeClass)throw Error('প্রথমে একটি Class নির্বাচন করুন।');const f=new FormData(e.target),logo=await fileData(f.get('logo'));const changes={class_name:f.get('class_name'),school_class:f.get('school_class'),class_level:f.get('school_class'),subject:f.get('subject'),semester:f.get('semester')||null,price:Number(f.get('price')),description:f.get('description')};if(logo)changes.logo_data=logo;const r=await db.from('teacher_classes').update(changes).eq('id',activeClass.id).eq('teacher_id',user.id);if(r.error)throw r.error;activeClass={...activeClass,...changes};say('Class-এর তথ্য সফলভাবে Update হয়েছে।');$('detailbody').innerHTML=`<div class="card">${img(activeClass.logo_data)}<h2>${esc(activeClass.class_name)}</h2><p>${esc(activeClass.subject)} · ${esc(activeClass.school_class)} · ${esc(activeClass.semester||'')}</p><b>Price: ₹${activeClass.price}</b><p>${esc(activeClass.description)}</p></div>`;loadMine()}catch(x){say(x.message,true)}};
$('togglepublish').onclick=async()=>{try{const v=!activeClass.published;const r=await db.from('teacher_classes').update({published:v}).eq('id',activeClass.id).eq('teacher_id',user.id);if(r.error)throw r.error;activeClass.published=v;$('togglepublish').textContent=v?'Unpublish Class':'Publish Class';say(v?'Class Publish করা হয়েছে।':'Class Unpublish করা হয়েছে।');}catch(x){say(x.message,true)}};async function loadResources(){let r=await db.from('class_resources').select('*').eq('class_id',activeClass.id).order('created_at');if(r.error){say(r.error.message,true);return}$('resources').innerHTML=(r.data||[]).map(x=>`<div class="resource"><b>${esc(x.resource_type)}: ${esc(x.title)}</b><br><a href="${esc(x.url||x.resource_url||'')}" target="_blank" rel="noopener">Open Resource ↗</a><button class="btn secondary" onclick="editResource('${x.id}')">Edit</button><button class="btn danger" onclick="deleteResource('${x.id}')">Delete</button></div>`).join('')||'<p class="muted">এখনও Resource যোগ হয়নি।</p>'}window.editResource=async id=>{const old=await db.from('class_resources').select('*').eq('id',id).single();if(old.error){say(old.error.message,true);return}const nt=prompt('Resource-এর নতুন নাম লিখুন',old.data.title);if(nt===null)return;const nu=prompt('নতুন HTTPS Link দিন',(old.data.url||old.data.resource_url||''));if(nu===null)return;if(!/^https:\/\//i.test(nu)){say('সঠিক HTTPS Link দিন।',true);return}const r=await db.from('class_resources').update({title:nt,url:nu,resource_url:nu}).eq('id',id);if(r.error)say(r.error.message,true);else{say('Resource Update হয়েছে।');loadResources()}};window.deleteResource=async id=>{if(!confirm('এই Resource মুছে ফেলবেন?'))return;let r=await db.from('class_resources').delete().eq('id',id);if(r.error)say(r.error.message,true);else loadResources()};$('resourceform').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target),cover=await fileData(f.get('cover')),url=f.get('url');if(!/^https:\/\//i.test(url))throw Error('নিরাপদ HTTPS Link দিন।');let r=await db.from('class_resources').insert({class_id:f.get('class_id'),resource_type:f.get('resource_type'),title:f.get('title'),url,resource_url:url,cover_data:cover});if(r.error)throw r.error;e.target.reset();$('resourceform').elements.class_id.value=activeClass.id;loadResources();say('Resource সংরক্ষিত হয়েছে।')}catch(x){say(x.message,true)}};
async function loadRequests(){try{let r=await db.from('class_admission_requests').select('*,teacher_classes!inner(class_name,teacher_id)').eq('teacher_classes.teacher_id',user.id).order('created_at',{ascending:false});if(r.error)throw r.error;$('requestlist').innerHTML=(r.data||[]).map(x=>`<article class="card"><h3>${esc(x.student_name)}</h3><p>${esc(x.teacher_classes.class_name)}</p><p>☎ ${esc(x.phone)}<br>✉ ${esc(x.email)}<br>${esc(x.address)}</p><span class="status">${esc(x.status)}</span><div class="actions"><button class="btn" onclick="decide('${x.id}','accepted','${x.class_id}','${x.student_id}')">Accept</button><button class="btn danger" onclick="decide('${x.id}','rejected','','')">Reject</button></div></article>`).join('')||'<p>কোনও আবেদন নেই।</p>'}catch(e){say(e.message,true)}}window.decide=async(id,status,cid,sid)=>{try{let requestRow=await db.from('class_admission_requests').select('student_name').eq('id',id).single();if(requestRow.error)throw requestRow.error;let r=await db.from('class_admission_requests').update({status}).eq('id',id);if(r.error)throw r.error;if(status==='accepted'){let a=await db.from('class_enrollments').upsert({class_id:cid,student_id:sid,student_name:requestRow.data.student_name,status:'active'},{onConflict:'class_id,student_id'});if(a.error)throw a.error}loadRequests();say(status==='accepted'?'আবেদন গ্রহণ করা হয়েছে।':'আবেদন Reject করা হয়েছে।')}catch(e){say(e.message,true)}};
async function loadEnrolled(){try{let r=await db.from('class_enrollments').select('*,teacher_classes!inner(*)').eq('student_id',user.id).eq('status','active');if(r.error)throw r.error;$('enrolledlist').innerHTML=(r.data||[]).map(x=>`<article class="card item">${img(x.teacher_classes.logo_data)}<h3>${esc(x.teacher_classes.class_name)}</h3><p>${esc(x.teacher_classes.subject)} · ${esc(x.teacher_classes.school_class)} · ${esc(x.teacher_classes.semester||'')}</p><div class="price">₹${Number(x.teacher_classes.price||0)}</div><button class="btn" onclick="openStudentClass('${x.class_id}')">Open Class</button></article>`).join('')||'<p>এখনও কোনও অনুমোদিত ক্লাস নেই।</p>'}catch(e){say(e.message,true)}}const studentTypeMeta={
 'PDF':{icon:'📕',bg:'linear-gradient(135deg,#f4d8ff,#fbe9ff)',desc:'PDF বই ও অধ্যয়ন सामग्री'},
 'NOTES':{icon:'📘',bg:'linear-gradient(135deg,#cceaff,#e4f5ff)',desc:'শিক্ষকের তৈরি Notes'},
 'BOOK':{icon:'📚',bg:'linear-gradient(135deg,#d5f7e8,#eafff4)',desc:'বই ও পাঠ্যসামগ্রী'},
 'RECORDED CLASS':{icon:'🎙️',bg:'linear-gradient(135deg,#c9f7e7,#e5fff5)',desc:'রেকর্ড করা ক্লাস'},
 'LIVE CLASS':{icon:'📡',bg:'linear-gradient(135deg,#ffdce7,#fff0f4)',desc:'Live Class Link'},
 'COURSE':{icon:'🎓',bg:'linear-gradient(135deg,#e2e2ff,#f0efff)',desc:'সম্পূর্ণ Course'}
};
function typeKey(v){const t=String(v||'').trim().toUpperCase();if(t.includes('PDF'))return 'PDF';if(t.includes('NOTE'))return 'NOTES';if(t.includes('BOOK'))return 'BOOK';if(t.includes('RECORD'))return 'RECORDED CLASS';if(t.includes('LIVE'))return 'LIVE CLASS';return 'COURSE'}
async function getTeacherCard(c){let name='শিক্ষক',photo='';try{const q=await db.from('profiles').select('name,teacher_dp_url,avatar_url').eq('id',c.teacher_id).maybeSingle();if(!q.error&&q.data){name=q.data.name||name;photo=q.data.teacher_dp_url||q.data.avatar_url||''}}catch{}return {name,photo}}
window.openStudentClass=async id=>{try{
 let enr=await db.from('class_enrollments').select('id,status').eq('class_id',id).eq('student_id',user.id).eq('status','active').maybeSingle();if(enr.error)throw enr.error;if(!enr.data)throw Error('এই Class-এ তোমার ভর্তি এখনও অনুমোদিত হয়নি।');
 let r=await db.from('teacher_classes').select('*').eq('id',id).single();if(r.error)throw r.error;activeClass=r.data;tab('detail');
 const teacher=await getTeacherCard(activeClass);
 $('detailbody').innerHTML=`<div class="card">${img(activeClass.logo_data)}<h2>${esc(activeClass.class_name)}</h2><p>${esc(activeClass.subject)} · ${esc(activeClass.school_class)} · ${esc(activeClass.semester||'')}</p><b>Price: ₹${Number(activeClass.price||0)}</b><p>${esc(activeClass.description||'')}</p></div><div class="student-teacher-head">${teacher.photo?`<img src="${esc(teacher.photo)}" alt="Teacher">`:'<div style="width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#eaf2ff;font-size:28px">👩‍🏫</div>'}<div><b>${esc(teacher.name)}</b><div class="muted">এই ক্লাসের শিক্ষক</div></div></div><h2>শিক্ষার বিষয়বস্তু</h2><p class="muted">যে বিভাগটি খুলতে চাও, সেটিতে চাপ দাও।</p><div id="studentCategoryGrid" class="student-categories"></div><div id="studentResourceArea" class="hidden"></div>`;
 document.querySelectorAll('#detail > .panel').forEach(p=>p.classList.add('hidden'));
 const rf=$('resourceform');rf.classList.add('hidden');
 const list=await db.from('class_resources').select('*').eq('class_id',id).order('created_at');if(list.error)throw list.error;
 const resources=list.data||[];const grouped={};resources.forEach(x=>{const k=typeKey(x.resource_type);(grouped[k] ||= []).push(x)});
 const cats=Object.keys(grouped);$('studentCategoryGrid').innerHTML=cats.map(k=>{const m=studentTypeMeta[k];return `<button class="student-category" style="background:${m.bg}" onclick="showStudentResources('${k}')"><span class="ico">${m.icon}</span><span>${k}</span><small>${grouped[k].length}টি Resource</small></button>`}).join('')||'<p class="muted">শিক্ষক এখনও কোনও Resource যোগ করেননি।</p>';
 window._studentResources=grouped;window._studentTeacher=teacher;window._studentClass=id;
 }catch(e){say(e.message,true)}};
window.showStudentResources=function(k){const items=(window._studentResources||{})[k]||[];const teacher=window._studentTeacher||{name:'শিক্ষক',photo:''};const area=$('studentResourceArea'),grid=$('studentCategoryGrid');grid.classList.add('hidden');area.classList.remove('hidden');area.classList.add('student-category-view');area.innerHTML=`<button class="btn secondary student-back" id="backToStudentCategories">← সব বিভাগে ফিরে যাও</button><h2>${esc(k)}</h2><div class="muted">${items.length}টি Resource</div>`+items.map(x=>{const url=x.url||x.resource_url||'';const photo=teacher.photo||x.teacher_photo||'';return `<article class="student-resource">${photo?`<img class="student-teacher-photo" src="${esc(photo)}" alt="${esc(teacher.name)}">`:'<div class="student-teacher-photo" style="display:grid;place-items:center;font-size:36px">👩‍🏫</div>'}<div><b>${esc(teacher.name)}</b><h3>${esc(x.title||k)}</h3><p>${esc(x.description||x.resource_type||k)}</p><div class="student-resource-actions"><a href="${esc(url)}" target="_blank" rel="noopener">View ${esc(k)} ↗</a><button class="download" onclick="downloadStudentResource('${x.id}')">⬇ Download</button></div></div></article>`}).join('')||'<p>এই বিভাগে কোনও Resource নেই।</p>';$('backToStudentCategories').onclick=()=>{area.classList.add('hidden');area.innerHTML='';grid.classList.remove('hidden')};};
window.downloadStudentResource=async function(id){const all=Object.values(window._studentResources||{}).flat();const item=all.find(x=>String(x.id)===String(id));if(!item)return;const url=item.url||item.resource_url;if(!url){say('Download link পাওয়া যায়নি।',true);return}try{const response=await fetch(url);if(!response.ok)throw Error('Download failed');const blob=await response.blob();const objectUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=objectUrl;a.download=(item.title||'Smart-Education-Resource').replace(/[\\/:*?"<>|]/g,'_');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),30000);say('ফাইলটি এই ডিভাইসে Download হচ্ছে। এটি Supabase Database-এ সংরক্ষণ করা হচ্ছে না।')}catch(e){window.open(url,'_blank','noopener');say('বাইরের লিংকের Download অনুমতি না থাকায় লিংকটি নতুন ট্যাবে খোলা হয়েছে। সেখান থেকে Download করো।',true)}};
async function loadStudents(){try{let r=await db.from('class_enrollments').select('*,teacher_classes!inner(class_name,teacher_id)').eq('teacher_classes.teacher_id',user.id);if(r.error)throw r.error;$('studentlist').innerHTML=(r.data||[]).map(x=>`<article class="card"><h3>${esc(x.student_name||'Student')}</h3><p>${esc(x.teacher_classes.class_name)}</p><span class="status ok">${esc(x.status)}</span><button class="btn danger" onclick="removeStudent('${x.id}')">Remove from Class</button></article>`).join('')||'<p>এখনও কোনও Enrolled Student নেই।</p>'}catch(e){say(e.message,true)}}window.removeStudent=async id=>{if(!confirm('ছাত্রের এই ক্লাসের Access বন্ধ করবেন?'))return;let r=await db.from('class_enrollments').update({status:'removed'}).eq('id',id);if(r.error)say(r.error.message,true);else loadStudents()};
(async()=>{try{await current();if(location.hash==='#teacher'){tab('create')}else if(location.hash==='#student'){document.querySelector('[data-tab="mine"]').classList.add('hidden');document.querySelector('[data-tab="enrolled"]').classList.remove('hidden');document.querySelector('[data-tab="create"]').classList.add('hidden');document.querySelector('[data-tab="requests"]').classList.add('hidden');document.querySelector('[data-tab="students"]').classList.add('hidden');tab('browse')}else tab('browse');const directId=new URLSearchParams(location.search).get('class');if(directId&&location.hash==='#student'){const c=await db.from('teacher_classes').select('*').eq('id',directId).eq('published',true).maybeSingle();if(c.error)throw c.error;if(c.data)requestJoin(c.data.id,c.data.class_name||'Teacher Class');else say('এই Class আর Publish করা নেই।',true)}}catch(e){say(e.message,true)}})();})();
</script></body></html>
