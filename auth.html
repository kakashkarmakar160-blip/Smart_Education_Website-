<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Education — Enter Your Name</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f7f8fc;--card:#fff;--text:#111a35;--muted:#687089;--line:#e7e8f0;--primary:#5b22c9;--primary2:#7744e8;--soft:#f1edff;--shadow:0 12px 40px rgba(34,25,75,.10)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif;line-height:1.55}
body.dark{--bg:#10111a;--card:#191b27;--text:#f7f7fb;--muted:#a9aec1;--line:#2d3040;--soft:#28213d;--shadow:0 12px 40px rgba(0,0,0,.28)}
.topbar{height:70px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.dark .topbar{background:rgba(16,17,26,.9)}.brand{font-size:22px;font-weight:800}.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);width:44px;height:44px;border-radius:14px;cursor:pointer;font-size:19px;display:grid;place-items:center}
.wrap{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:28px 18px 60px}
.card{width:min(100%,460px);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}
.logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#6d35d4,#9c6af1);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900;margin-bottom:18px}
h1{margin:0 0 7px;font-size:28px}.sub{color:var(--muted);margin:0 0 22px}
label{display:block;font-weight:700;margin:13px 0 7px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);font-size:15px;outline:none}input:focus{border-color:var(--primary)}
.primary{width:100%;margin-top:20px;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,#5b22c9,#7744e8);color:#fff;font-size:16px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.7;cursor:wait}
.secondary{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--text);font-weight:700;cursor:pointer}
.msg{display:none;margin-top:15px;padding:12px 13px;border-radius:12px;font-size:14px}.msg.show{display:block}.msg.error{background:#fff0f0;color:#a32121}.msg.ok{background:#edf9f0;color:#176b31}.hint{font-size:13px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html">Smart Education</a><button class="icon-btn" id="themeBtn" type="button">🌙</button></header>
<main class="wrap"><section class="card">
<div class="logo">SE</div>
<h1>Enter Your Name</h1>
<p class="sub">Smart Education-এ প্রবেশ করতে শুধু আপনার নাম লিখুন।</p>
<form id="nameForm">
<label for="name">Your Name</label>
<input id="name" type="text" autocomplete="name" maxlength="80" required placeholder="Enter your name">
<button class="primary" id="submitBtn" type="submit">Continue →</button>
</form>
<div id="msg" class="msg"></div>
<p class="hint">কোনো Email, Google বা Phone OTP লাগবে না। আপনার জন্য Supabase একটি আলাদা User ID তৈরি করবে।</p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const qs=new URLSearchParams(location.search);
const next=qs.get('next')||'index.html';
const msg=document.getElementById('msg');
const form=document.getElementById('nameForm');
const submitBtn=document.getElementById('submitBtn');
function showMsg(t,ok=false){msg.textContent=t;msg.className='msg show '+(ok?'ok':'error')}

form.addEventListener('submit',async e=>{
 e.preventDefault();
 const name=document.getElementById('name').value.trim();
 if(name.length<2){showMsg('দয়া করে অন্তত ২ অক্ষরের নাম দিন।');return;}
 msg.className='msg'; submitBtn.disabled=true; submitBtn.textContent='Creating User…';
 try{
  if(!window.supabaseClient) throw new Error('Supabase connection পাওয়া যায়নি।');
  let user=(await supabaseClient.auth.getUser()).data?.user||null;
  if(!user){
    const {data,error}=await supabaseClient.auth.signInAnonymously({options:{data:{display_name:name,name:name}}});
    if(error) throw error;
    user=data?.user||null;
  }else{
    const {error}=await supabaseClient.auth.updateUser({data:{display_name:name,name:name}});
    if(error) throw error;
  }
  if(!user) throw new Error('User তৈরি করা যায়নি।');
  try{await smartEduAuth.saveProfile({name,phone:'',role:'',className:'',semester:''});}catch(profileError){console.warn('Profile save skipped:',profileError);}
  localStorage.setItem('smartEduUserName',name);
  localStorage.setItem('smartEduUserId',user.id);
  showMsg('স্বাগতম, '+name+'! User ID তৈরি হয়েছে।',true);
  setTimeout(()=>location.href=next,300);
 }catch(err){
  console.error(err);
  const raw=err?.message||'কাজটি সম্পন্ন করা যায়নি।';
  if(/anonymous/i.test(raw)) showMsg('Anonymous Sign-ins Supabase-এ চালু করা নেই। Authentication → Sign In / Providers → Anonymous Sign-Ins ON করে Save করুন।');
  else showMsg(raw);
 }finally{
  submitBtn.disabled=false; submitBtn.textContent='Continue →';
 }
});

(async()=>{
 try{
  const u=await smartEduAuth.user();
  if(u && !qs.get('force')){
   const existingName=u.user_metadata?.display_name||u.user_metadata?.name||localStorage.getItem('smartEduUserName');
   if(existingName){ document.getElementById('name').value=existingName; location.href=next; }
  }
 }catch(e){}
})();

(function(){
 const dark=localStorage.getItem('smartEduDark')==='1' || localStorage.getItem('smartEduTheme')==='dark';
 if(dark)document.body.classList.add('dark');
 document.getElementById('themeBtn').textContent=dark?'☀️':'🌙';
 document.getElementById('themeBtn').onclick=()=>{
  document.body.classList.toggle('dark');
  const d=document.body.classList.contains('dark');
  localStorage.setItem('smartEduDark',d?'1':'0');
  localStorage.setItem('smartEduTheme',d?'dark':'light');
  document.getElementById('themeBtn').textContent=d?'☀️':'🌙';
 };
})();
</script>
</body></html>
