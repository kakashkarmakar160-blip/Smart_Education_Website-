<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Exam</title><style data-internal-css="css/style.css">
*{box-sizing:border-box} :root{--bg:#f7f8fc;--card:#fff;--text:#111a35;--muted:#687089;--line:#e7e8f0;--primary:#5b22c9;--primary2:#7744e8;--soft:#f1edff;--shadow:0 12px 40px rgba(34,25,75,.08)} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif;line-height:1.55} body.dark{--bg:#10111a;--card:#191b27;--text:#f7f7fb;--muted:#a9aec1;--line:#2d3040;--soft:#28213d;--shadow:0 12px 40px rgba(0,0,0,.25)} a{text-decoration:none;color:inherit}.topbar{height:70px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.dark .topbar{background:rgba(16,17,26,.9)}.brand{font-size:22px;font-weight:800;letter-spacing:-.4px}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);width:44px;height:44px;border-radius:14px;cursor:pointer;font-size:19px;display:grid;place-items:center}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6d35d4,#9c6af1);font-weight:800}.container{max-width:1180px;margin:auto;padding:28px 22px 70px}.hero{min-height:280px;border:1px solid #eee8ff;border-radius:28px;padding:42px 48px;display:flex;justify-content:space-between;align-items:center;background:radial-gradient(circle at 85% 50%,#eee7ff,transparent 35%),linear-gradient(135deg,#fff,#f4f0ff);box-shadow:var(--shadow);overflow:hidden}.dark .hero{background:linear-gradient(135deg,#1d1d2a,#211c35)}.hero h1{font-size:44px;line-height:1.15;margin:8px 0 14px;letter-spacing:-1.6px}.hero h1 span{color:#5e38d2}.hero p{color:var(--muted);max-width:650px}.hero-art{font-size:78px;text-align:center;transform:rotate(-3deg)}.hero-art div{font-size:90px;margin-top:-18px}.hero-art small{font-size:22px;color:#7142df}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--primary);margin:0}.search-wrap{margin:18px 0 34px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(35,28,75,.05);display:flex;align-items:center;padding:0 20px}.search-wrap span{font-size:30px;color:var(--muted)}.search-wrap input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:17px;padding:20px 14px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}.section-head h2,.page-intro h1{margin:4px 0;font-size:30px;letter-spacing:-.7px}.muted{color:var(--muted)}.primary{display:inline-flex;justify-content:center;align-items:center;border:0;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer}.full{width:100%}.page-intro{padding:15px 0 25px}.page-intro p:last-child{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.result-card{max-width:620px;margin:70px auto;text-align:center;background:var(--card);border:1px solid var(--line);padding:45px;border-radius:28px;box-shadow:var(--shadow)}.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:var(--soft);color:var(--primary);font-size:36px;font-weight:900}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(12,12,22,.48);display:grid;place-items:end center;z-index:50}.modal-card{width:min(900px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:30px;position:relative}.close{position:absolute;right:20px;top:18px;border:0;background:var(--soft);font-size:25px;width:42px;height:42px;border-radius:50%;cursor:pointer}@media(max-width:720px){.topbar{padding:0 14px}.brand{font-size:17px}.container{padding:18px 14px 55px}.hero{padding:28px 22px;min-height:240px}.hero h1{font-size:32px}.hero-art{font-size:55px}.hero-art div{font-size:65px}.hero-art small{font-size:16px}}
</style><style data-internal-css="css/student-exam.css">
.student-exam-wrap{max-width:900px;margin:auto;padding:28px 20px 70px}.exam-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.exam-top h1{margin:5px 0}.progress-pill,.timer{padding:9px 13px;border-radius:999px;background:var(--soft);color:var(--primary);font-weight:900}.timer{font-variant-numeric:tabular-nums}.question-focus{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow);min-height:360px}.q-number{font-size:13px;color:var(--primary);font-weight:900}.q-text{font-size:23px;font-weight:800;margin:15px 0 25px}.answers{display:grid;gap:12px}.answer{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:15px;padding:15px;text-align:left;font-size:16px;cursor:pointer}.answer:hover{border-color:var(--primary)}.answer.correct{background:#e9f9ef;border-color:#25a764;color:#126b3d}.answer.wrong{background:#fff0f1;border-color:#df4651;color:#a31f2a}.answer.disabled{pointer-events:none}.feedback{margin-top:18px;padding:12px 14px;border-radius:13px;font-weight:800}.feedback.good{background:#e9f9ef;color:#126b3d}.feedback.bad{background:#fff0f1;color:#a31f2a}.exam-nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.outline{display:inline-flex}@media(max-width:600px){.exam-top{align-items:flex-start}.q-text{font-size:19px}.top-actions .timer{display:none}}

</style></head><body><header class="topbar"><button id="backExam" class="icon-btn">←</button><div class="brand">Student Exam</div><div class="top-actions"><div class="timer" id="timer">05:00</div><button class="icon-btn" id="themeBtn">☾</button><a href="profile.html" class="avatar">AK</a></div></header><main class="student-exam-wrap"><section class="exam-top"><div><p class="eyebrow">PRACTICE MODE</p><h1 id="examTitle">Model Question Set</h1><p id="examMeta" class="muted">Question 1</p></div><span class="progress-pill" id="progress">1 / 1</span></section><section class="question-focus" id="questionBox"></section><div class="exam-nav"><button id="prevBtn" class="outline">← Previous</button><button id="nextBtn" class="primary">Next Question →</button></div></main><script data-internal-js="js/app.js">
const THEME_KEY='smartEduTheme';

function applyTheme(){
  document.body.classList.toggle('dark', localStorage.getItem(THEME_KEY)==='dark');
  document.querySelectorAll('#themeBtn').forEach(btn=>{
    btn.textContent=document.body.classList.contains('dark')?'☀':'☾';
  });
}

function roleTarget(id){
  return id==='teacher'?'teacher-save.html':id==='computer'?'computer-save.html':'student-save.html';
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

async function loadJSON(path){
  const candidates=[path];
  if(location.pathname.includes('/frontend/')) candidates.push('../'+path);
  let last;
  for(const candidate of candidates){try{const r=await fetch(candidate,{cache:'no-store'});if(r.ok)return await r.json();last=new Error('HTTP '+r.status+' '+candidate)}catch(e){last=e}}
  throw last||new Error('Cannot load '+path);
}

function params(){ return new URLSearchParams(location.search); }

async function initRoles(){
  const grid=document.getElementById('roleGrid');
  if(!grid) return;
  const roles=await loadJSON('data/roles.json');
  const html=roles.map(r=>`
    <button class="role-card" data-role="${r.id}" type="button">
      <img src="${r.image}" alt="${escapeHtml(r.name)}">
      <div><h3>${escapeHtml(r.name)}</h3><p>${escapeHtml(r.description)}</p></div>
      <span>→</span>
    </button>`).join('');
  grid.innerHTML=html;
  document.querySelectorAll('.role-card').forEach(b=>{
    b.addEventListener('click',()=>location.href=roleTarget(b.dataset.role));
  });
}

function bindGlobal(){
  applyTheme();

  document.querySelectorAll('#themeBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      localStorage.setItem(THEME_KEY, localStorage.getItem(THEME_KEY)==='dark'?'light':'dark');
      applyTheme();
    });
  });

  document.getElementById('profileBtn')?.addEventListener('click',()=>location.href='profile.html');

  // Any avatar that is not already a link works as the profile button.
  document.querySelectorAll('.avatar:not(a)').forEach(a=>{
    if(a.id==='profileBtn') return;
    a.setAttribute('role','button');
    a.setAttribute('tabindex','0');
    a.addEventListener('click',()=>location.href='profile.html');
    a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')location.href='profile.html';});
  });

  // The purple logo is now the switch for the two question-edit pages.
  const pageMenu=document.getElementById('pageMenu');
  const pagePasswordModal=document.getElementById('pagePasswordModal');
  const pagePassword=document.getElementById('pagePassword');
  const pagePasswordMsg=document.getElementById('pagePasswordMsg');
  let pendingPage='';
  document.getElementById('pageSwitchBtn')?.addEventListener('click',()=>{
    pageMenu?.classList.remove('hidden');
  });
  document.getElementById('closePageMenu')?.addEventListener('click',()=>pageMenu?.classList.add('hidden'));
  document.getElementById('closePagePassword')?.addEventListener('click',()=>pagePasswordModal?.classList.add('hidden'));
  function openPagePassword(page){
    pendingPage=page;
    if(pagePassword){pagePassword.value='';pagePassword.focus();}
    if(pagePasswordMsg)pagePasswordMsg.textContent='';
    pagePasswordModal?.classList.remove('hidden');
    pageMenu?.classList.add('hidden');
  }
  document.getElementById('addPage1Btn')?.addEventListener('click',()=>openPagePassword('1'));
  document.getElementById('addPage2Btn')?.addEventListener('click',()=>openPagePassword('2'));
  function unlockSelectedPage(){
    if(pagePassword?.value==='AK1234'){
      if(pendingPage==='1'){
        sessionStorage.setItem('computerEditorUnlocked','1');
        location.href='computer-question-paper.html';
      }else if(pendingPage==='2'){
        sessionStorage.setItem('practiceEditorUnlocked','1');
        location.href='practice-question-paper.html?class=5&semester=1&subject=bangla';
      }
    }else if(pagePasswordMsg){
      pagePasswordMsg.textContent='this is wrong password';
    }
  }
  document.getElementById('unlockPage')?.addEventListener('click',unlockSelectedPage);
  pagePassword?.addEventListener('keydown',e=>{if(e.key==='Enter')unlockSelectedPage()});

  document.getElementById('closeProfilePanel')?.addEventListener('click',()=>{
    document.getElementById('profilePanel')?.classList.add('hidden');
  });
  document.querySelectorAll('.side-overlay').forEach(x=>x.addEventListener('click',e=>{
    if(e.target===x)x.classList.add('hidden');
  }));
}

document.addEventListener('DOMContentLoaded',()=>{
  bindGlobal();
  initRoles().catch(console.error);
});

</script><script data-internal-js="js/student-exam.js">
let data=null,index=0,answers={},remaining=300,timerId;

async function getData(){
  const teacher=sessionStorage.getItem('teacherExam');
  if(teacher){
    data=JSON.parse(teacher);
  }else{
    const file=params().get('file')||'data/class5/bangla/school-01.json';
    try{data=await loadJSON(file)}catch{data=await loadJSON('data/class5/bangla/school-01.json');}
  }
  document.getElementById('examTitle').textContent=data.name||data.title||'Practice';
  render();startTimer();
}

function render(){
  const q=data.questions[index];
  document.getElementById('progress').textContent=`${index+1} / ${data.questions.length}`;
  document.getElementById('examMeta').textContent=`${data.school_name||data.target||''} • ${data.subject_name||q.subject||''}`;
  let html=`<div class="q-number">Question ${index+1} • ${q.marks||1} Marks</div><div class="q-text">${escapeHtml(q.question)}</div>`;
  if(q.type==='mcq'){
    html+=`<div class="answers">${q.options.map((o,j)=>`<button class="answer ${answers[index]?.chosen===j?(answers[index].correct?'correct':'wrong'):''}" data-j="${j}" ${answers[index]?'disabled':''}>${String.fromCharCode(2458+j)}) ${escapeHtml(o)}</button>`).join('')}</div>`;
  }else if(q.type==='true_false'){
    html+=`<div class="answers"><button class="answer ${answers[index]?.value==='সত্য'?(answers[index].correct?'correct':'wrong'):''}" data-value="সত্য" ${answers[index]?'disabled':''}>সত্য</button><button class="answer ${answers[index]?.value==='মিথ্যা'?(answers[index].correct?'correct':'wrong'):''}" data-value="মিথ্যা" ${answers[index]?'disabled':''}>মিথ্যা</button></div>`;
  }else{
    html+=`<textarea id="shortAnswer" class="field answer-input" placeholder="তোমার উত্তর লিখো..." ${answers[index]?'disabled':''}>${escapeHtml(answers[index]?.value||'')}</textarea>`;
  }
  if(answers[index]) html+=`<div class="feedback ${answers[index].correct?'good':'bad'}">${answers[index].correct?'✓ সঠিক উত্তর':'✕ ভুল উত্তর'} <span>• উত্তর আর পরিবর্তন করা যাবে না</span></div>`;
  document.getElementById('questionBox').innerHTML=html;
  document.querySelectorAll('.answer[data-j]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.j))));
  document.querySelectorAll('.answer[data-value]').forEach(b=>b.addEventListener('click',()=>chooseTF(b.dataset.value)));
  document.getElementById('nextBtn').textContent=index===data.questions.length-1?'See Result →':'Next Question →';
  document.getElementById('prevBtn').disabled=index===0;
}

function choose(j){
  if(answers[index])return;
  const q=data.questions[index],correct=q.options[j]===q.answer;
  answers[index]={chosen:j,value:q.options[j],correct};
  render();
}
function chooseTF(value){
  if(answers[index])return;
  const q=data.questions[index],correct=value===q.answer;
  answers[index]={value,correct};render();
}
function next(){
  const q=data.questions[index];
  if(q.type!=='mcq'&&q.type!=='true_false'&&!answers[index]){
    const val=document.getElementById('shortAnswer')?.value.trim();
    if(!val){document.getElementById('shortAnswer')?.focus();return;}
    answers[index]={value:val,correct:normalize(val)===normalize(q.answer)};
    render();return;
  }
  if(index<data.questions.length-1){index++;render();}else finish();
}
function prev(){if(index>0){index--;render();}}
function finish(){
  const correct=Object.values(answers).filter(x=>x.correct).length;
  const attempted=Object.keys(answers).length;
  const totalMarks=data.questions.reduce((s,q)=>s+Number(q.marks||1),0);
  const obtained=Object.entries(answers).reduce((s,[i,a])=>s+(a.correct?Number(data.questions[i].marks||1):0),0);
  const percentage=totalMarks?Math.round(obtained/totalMarks*100):0;
  const student=JSON.parse(localStorage.getItem('studentProfile')||'{}');
  const teacher= data.teacher || data.target || 'Teacher';
  const teacherId=data.teacherId || String(teacher).toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const result={id:'result-'+Date.now(),paperId:data.id||('paper-'+(data.password||'')),paperPassword:data.password||'',teacher,teacherId,student:{name:student.name||'Student',id:student.id||''},studentName:student.name||'Student',title:data.name||data.title||'Practice Result',school:data.school_name||data.target||'',subject:data.subject_name||'',correct,total:data.questions.length,attempted,wrong:Math.max(0,attempted-correct),unattempted:Math.max(0,data.questions.length-attempted),obtained,totalMarks,percentage,date:new Date().toISOString(),answers,questions:data.questions};
  const history=JSON.parse(localStorage.getItem('studentResults')||'[]');history.unshift(result);localStorage.setItem('studentResults',JSON.stringify(history));
  const teacherResults=JSON.parse(localStorage.getItem('teacherResults')||'[]');teacherResults.unshift(result);localStorage.setItem('teacherResults',JSON.stringify(teacherResults));
  sessionStorage.setItem('examResult',JSON.stringify(result));sessionStorage.removeItem('teacherExam');location.href='student-result.html?resultId='+encodeURIComponent(result.id);
}
function normalize(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ');}
function startTimer(){clearInterval(timerId);remaining=300;timerId=setInterval(()=>{remaining--;const m=String(Math.floor(remaining/60)).padStart(2,'0'),s=String(remaining%60).padStart(2,'0');document.getElementById('timer').textContent=`${m}:${s}`;if(remaining<=0){clearInterval(timerId);finish();}},1000);}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
document.getElementById('nextBtn').addEventListener('click',next);
document.getElementById('prevBtn').addEventListener('click',prev);
document.getElementById('backExam').addEventListener('click',()=>{if(sessionStorage.getItem('teacherExam')) location.assign('./student-paper.html'); else history.back();});
getData().catch(console.error);

</script></body></html>
