.hero-art div{font-size:65px}.hero-art small{font-size:16px}}

.computer-editor{max-width:1200px;margin:auto;padding:28px 22px 70px}.create-banner{border:1px solid #dfe1ff;border-radius:24px;padding:24px 30px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#6b58e8,#4c80ee);color:#fff;box-shadow:var(--shadow);margin-bottom:18px}.create-banner .eyebrow{color:#fff}.create-banner h1{margin:4px 0;font-size:30px}.create-banner p:last-child{margin:0;opacity:.9}.banner-art{font-size:64px}.subject-tabs{padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}.subject-tab{border:1px solid var(--line);background:var(--card);padding:14px 12px;border-radius:13px;cursor:pointer;text-align:left;color:var(--text);font:inherit}.subject-tab strong{display:block}.subject-tab span{font-size:12px;color:var(--muted)}.subject-tab.active{border-color:#6a48df;background:var(--soft);box-shadow:inset 0 0 0 1px #6a48df}.editor-toolbar{padding:20px 22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.editor-toolbar h2{margin:2px 0;font-size:24px}.question-list{display:grid;gap:8px}.computer-q-row{display:grid;grid-template-columns:34px minmax(260px,1fr) 180px 90px 38px 38px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 4px 15px rgba(34,25,75,.04)}.q-num{width:25px;height:25px;border-radius:7px;background:#e9edff;color:#3158ca;display:grid;place-items:center;font-weight:800}.q-preview{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.q-type{font-size:12px;color:var(--muted);border-radius:20px;background:var(--soft);padding:6px 8px;text-align:center}.q-mark{font-size:12px;font-weight:800;background:#edf4ff;border-radius:20px;padding:6px;text-align:center}.mini-icon{border:0;background:transparent;cursor:pointer;font-size:19px}.mini-icon.edit{color:#2563d9}.mini-icon.delete{color:#df3f50}.bottom-actions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}.save-btn{border:1px solid #111;border-radius:14px;background:#fff000;color:#111;font-size:20px;font-weight:900;padding:13px 38px;cursor:pointer}.success-text{color:#1b8d4c;font-weight:700}.question-modal{max-width:760px}.question-modal .form-grid{display:grid;grid-template-columns:1fr 180px;gap:14px}.question-modal .field{display:flex;flex-direction:column;gap:7px}.question-modal .field.full{grid-column:1/-1}.question-modal input,.question-modal select,.question-modal textarea{border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--bg);color:var(--text);font:inherit}.option-editor{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.option-line{display:flex;gap:8px;align-items:center}.option-line b{width:28px}.option-line input{flex:1}.answer-row{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-top:10px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:850px){.subject-tabs{grid-template-columns:1fr 1fr}.computer-q-row{grid-template-columns:30px 1fr 90px 34px 34px}.q-type{display:none}}@media(max-width:560px){.create-banner{padding:20px;}.banner-art{font-size:42px}.subject-tabs{grid-template-columns:1fr}.editor-toolbar{align-items:flex-start;gap:12px;flex-direction:column}.computer-q-row{grid-template-columns:30px 1fr 32px 32px}.q-mark{display:none}.option-editor,.question-modal .form-grid,.answer-row{grid-template-columns:1fr}}

.selection-panel{padding:16px 20px;display:grid;grid-template-columns:180px 180px 1fr;gap:14px;align-items:end;margin-bottom:14px}.selection-panel .field{display:flex;flex-direction:column;gap:7px}.selection-panel select{border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--bg);color:var(--text);font:inherit}.selection-note{display:flex;flex-direction:column;gap:4px;color:var(--text);padding:9px 12px;border-radius:12px;background:var(--soft)}.selection-note span{font-size:12px;color:var(--muted)}@media(max-width:650px){.selection-panel{grid-template-columns:1fr}}

<body>
<header class="topbar"><a href="computer-room.html" class="icon-btn" aria-label="Back">←</a><div class="brand">Computer Question Paper</div><div class="top-actions"><button class="icon-btn" id="themeBtn">☾</button><div class="avatar">AK</div></div></header>
<main class="computer-editor">
<section class="create-banner"><div><p class="eyebrow">CREATE NEW</p><h1>Computer Question Paper</h1><p>Add questions, set marks and manage each subject. সর্বোচ্চ ২০টি প্রশ্ন।</p></div><div class="banner-art">📚</div></section>
<section class="selection-panel card">
  <div class="field"><label for="editorClass">Class</label><select id="editorClass"><option value="5">Class 5</option><option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option></select></div>
  <div class="field"><label for="editorSemester">Semester</label><select id="editorSemester"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
  <div class="selection-note"><strong>যে Class + Semester নির্বাচন করবেন</strong><span>সেই নির্দিষ্ট Question Paper-ই Edit হবে।</span></div>
</section>
<section class="subject-tabs card" id="subjectTabs"></section>
<section class="editor-toolbar card"><div><p class="eyebrow">QUESTION BANK</p><h2 id="subjectTitle">বাংলা</h2><p class="muted" id="questionCount">0 / 20 Questions</p></div><button id="addQuestion" class="primary">＋ Add Question</button></section>
<section id="questionList" class="question-list"></section>
<div class="bottom-actions"><button id="savePaper" class="save-btn">SAVE</button><a href="computer-room.html" class="outline">Back to Room</a><span id="saveMsg" class="success-text"></span></div>
</main>
<div id="editorModal" class="modal hidden"><div class="modal-card question-modal"><button id="closeEditor" class="close">×</button><p class="eyebrow" id="modalEyebrow">QUESTION 1</p><h2 id="modalTitle">Edit Question</h2><div class="form-grid"><div class="field"><label>Question Type</label><select id="qType"><option value="mcq">MCQ</option><option value="short">Short Answer</option><option value="true_false">True / False</option><option value="fill_blank">Fill in the Blank</option><option value="paragraph">Paragraph</option><option value="essay">Essay</option></select></div><div class="field"><label>Marks</label><input id="qMarks" type="number" min="1" max="20" value="1"></div><div class="field full"><label>Question *</label><textarea id="qText" rows="4" maxlength="1000" placeholder="Type your question..."></textarea></div></div><div id="qExtra"></div><div class="modal-actions"><button id="cancelEditor" class="outline">Cancel</button><button id="saveEditor" class="primary">Save Question</button></div><p id="editorError" class="danger"></p></div></div>
<script data-internal-js="js/app.js">
const THEME_KEY='smartEduTheme';

function applyTheme(){
  document.body.classList.toggle('dark', localStorage.getItem(THEME_KEY)==='dark');
  document.querySelectorAll('#themeBtn').forEach(btn=>{
    btn.textContent=document.body.classList.contains('dark')?'☀':'☾';
  });
}

function roleTarget(id){
  return id==='teacher'?'teacher-save.html':id==='computer'?'computer-save.html':'student-save.html';
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

async function loadJSON(path){
  const candidates=[path];
  if(location.pathname.includes('/frontend/')) candidates.push('../'+path);
  let last;
  for(const candidate of candidates){try{const r=await fetch(candidate,{cache:'no-store'});if(r.ok)return await r.json();last=new Error('HTTP '+r.status+' '+candidate)}catch(e){last=e}}
  throw last||new Error('Cannot load '+path);
}

function params(){ return new URLSearchParams(location.search); }

async function initRoles(){
  const grid=document.getElementById('roleGrid');
  if(!grid) return;
  const roles=await loadJSON('data/roles.json');
  const html=roles.map(r=>`
    <button class="role-card" data-role="${r.id}" type="button">
      <img src="${r.image}" alt="${escapeHtml(r.name)}">
      <div><h3>${escapeHtml(r.name)}</h3><p>${escapeHtml(r.description)}</p></div>
      <span>→</span>
    </button>`).join('');
  grid.innerHTML=html;
  document.querySelectorAll('.role-card').forEach(b=>{
    b.addEventListener('click',()=>location.href=roleTarget(b.dataset.role));
  });
}

function bindGlobal(){
  applyTheme();

  document.querySelectorAll('#themeBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      localStorage.setItem(THEME_KEY, localStorage.getItem(THEME_KEY)==='dark'?'light':'dark');
      applyTheme();
    });
  });

  document.getElementById('profileBtn')?.addEventListener('click',()=>location.href='profile.html');

  // Any avatar that is not already a link works as the profile button.
  document.querySelectorAll('.avatar:not(a)').forEach(a=>{
    if(a.id==='profileBtn') return;
    a.setAttribute('role','button');
    a.setAttribute('tabindex','0');
    a.addEventListener('click',()=>location.href='profile.html');
    a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')location.href='profile.html';});
  });

  // The purple logo is now the switch for the two question-edit pages.
  const pageMenu=document.getElementById('pageMenu');
  const pagePasswordModal=document.getElementById('pagePasswordModal');
  const pagePassword=document.getElementById('pagePassword');
  const pagePasswordMsg=document.getElementById('pagePasswordMsg');
  let pendingPage='';
  document.getElementById('pageSwitchBtn')?.addEventListener('click',()=>{
    pageMenu?.classList.remove('hidden');
  });
  document.getElementById('closePageMenu')?.addEventListener('click',()=>pageMenu?.classList.add('hidden'));
  document.getElementById('closePagePassword')?.addEventListener('click',()=>pagePasswordModal?.classList.add('hidden'));
  function openPagePassword(page){
    pendingPage=page;
    if(pagePassword){pagePassword.value='';pagePassword.focus();}
    if(pagePasswordMsg)pagePasswordMsg.textContent='';
    pagePasswordModal?.classList.remove('hidden');
    pageMenu?.classList.add('hidden');
  }
  document.getElementById('addPage1Btn')?.addEventListener('click',()=>openPagePassword('1'));
  document.getElementById('addPage2Btn')?.addEventListener('click',()=>openPagePassword('2'));
  function unlockSelectedPage(){
    if(pagePassword?.value==='AK1234'){
      if(pendingPage==='1'){
        sessionStorage.setItem('computerEditorUnlocked','1');
        location.href='computer-question-paper.html';
      }else if(pendingPage==='2'){
        sessionStorage.setItem('practiceEditorUnlocked','1');
        location.href='practice-question-paper.html?class=5&semester=1&subject=bangla';
      }
    }else if(pagePasswordMsg){
      pagePasswordMsg.textContent='this is wrong password';
    }
  }
  document.getElementById('unlockPage')?.addEventListener('click',unlockSelectedPage);
  pagePassword?.addEventListener('keydown',e=>{if(e.key==='Enter')unlockSelectedPage()});

  document.getElementById('closeProfilePanel')?.addEventListener('click',()=>{
    document.getElementById('profilePanel')?.classList.add('hidden');
  });
  document.querySelectorAll('.side-overlay').forEach(x=>x.addEventListener('click',e=>{
    if(e.target===x)x.classList.add('hidden');
  }));
}

document.addEventListener('DOMContentLoaded',()=>{
  bindGlobal();
  initRoles().catch(console.error);
});

</script><script data-internal-js="js/computer-question-paper.js">
const MAX=20;
const BANK_KEY='computerQuestionBanksV1';
const SEMESTERS=['1','2','3','4'];
const LOWER_SUBJECTS=[['bangla','বাংলা'],['english','ইংরেজি'],['physics','Physics'],['life-science','Life Science'],['mathematics','গণিত'],['geography','ভূগোল'],['history','ইতিহাস']];
const HIGHER_SUBJECTS=[...LOWER_SUBJECTS,['accountancy','Accountancy'],['commercial-law','Commercial Law'],['business-studies','Business Studies'],['computer-science','Computer Science'],['costing','Costing']];
let activeClass=Number(params().get('class')||JSON.parse(localStorage.getItem('computerProfile')||'{}').className?.match(/\d+/)?.[0]||12);
let activeSemester=String(params().get('semester')||JSON.parse(localStorage.getItem('computerProfile')||'{}').semester||'1').match(/[1-4]/)?.[0]||'1';
let activeSubject=params().get('subject')||'bangla',editingIndex=null,bank={};
if(![5,6,7,8,9,10,11,12].includes(activeClass))activeClass=12;
if(sessionStorage.getItem('computerEditorUnlocked')!=='1')location.href='computer-room.html';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function readBanks(){try{return JSON.parse(localStorage.getItem(BANK_KEY)||'{}')}catch{return {}}}
function key(){return `class${activeClass}|semester${activeSemester}|${activeSubject}`}
function subjects(){return activeClass<=10?LOWER_SUBJECTS:HIGHER_SUBJECTS}
function defaultQuestions(){
 const base=[
  {type:'mcq',question:'কম্পিউটারের মস্তিষ্ক বলা হয় কোন অংশকে?',options:['CPU','Monitor','Keyboard','Mouse'],answer:'CPU',marks:1},
  {type:'mcq',question:'কোনটি Input Device?',options:['Monitor','Printer','Keyboard','Speaker'],answer:'Keyboard',marks:1},
  {type:'mcq',question:'কোনটি Output Device?',options:['Mouse','Keyboard','Monitor','Scanner'],answer:'Monitor',marks:1},
  {type:'mcq',question:'CPU-এর পূর্ণরূপ কী?',options:['Central Processing Unit','Computer Personal Unit','Central Program Utility','Control Processing User'],answer:'Central Processing Unit',marks:1},
  {type:'mcq',question:'কীবোর্ডে Enter key সাধারণত কী কাজে ব্যবহৃত হয়?',options:['নতুন লাইন/নির্দেশ নিশ্চিত করতে','কম্পিউটার বন্ধ করতে','শব্দ কমাতে','ছবি তুলতে'],answer:'নতুন লাইন/নির্দেশ নিশ্চিত করতে',marks:1}
 ];
 let old=[];try{old=JSON.parse(localStorage.getItem('computerQuestionBanks')||'{}')}catch{}
 return old[activeSubject]?.length?old[activeSubject].slice(0,MAX):base;
}
function seed(){
 bank=readBanks();
 const k=key();
 if(!Array.isArray(bank[k])||!bank[k].length)bank[k]=defaultQuestions().map(q=>({...q,options:q.options?[...q.options]:undefined}));
 const base=bank[k].slice();
 while(bank[k].length<MAX&&bank[k].length){const src=base[bank[k].length%base.length];bank[k].push({...src,question:`${src.question} (প্রশ্ন ${bank[k].length+1})`})}
 bank[k]=bank[k].slice(0,MAX);
 localStorage.setItem(BANK_KEY,JSON.stringify(bank));
}
function renderTabs(){
 document.getElementById('subjectTabs').innerHTML=subjects().map(([id,name])=>`<button class="subject-tab ${id===activeSubject?'active':''}" data-subject="${id}"><strong>${name}</strong><span>${(bank[`class${activeClass}|semester${activeSemester}|${id}`]||[]).length} / ${MAX} Questions</span></button>`).join('');
 document.querySelectorAll('.subject-tab').forEach(b=>b.onclick=()=>{activeSubject=b.dataset.subject;editingIndex=null;seed();render()});
}
function render(){
 document.getElementById('editorClass').value=String(activeClass);document.getElementById('editorSemester').value=activeSemester;
 const list=subjects();if(!list.some(x=>x[0]===activeSubject))activeSubject=list[0][0];
 renderTabs();const name=list.find(x=>x[0]===activeSubject)?.[1]||activeSubject,qs=(bank[key()]||[]).slice(0,MAX);
 document.getElementById('subjectTitle').textContent=`Class ${activeClass} • Semester ${activeSemester} • ${name}`;
 document.getElementById('questionCount').textContent=`${qs.length} / ${MAX} Questions`;
 document.getElementById('questionList').innerHTML=qs.map((q,i)=>`<article class="computer-q-row"><span class="q-num">${i+1}</span><div class="q-preview" title="${esc(q.question)}">${esc(q.question)}</div><span class="q-type">${typeName(q.type)}</span><span class="q-mark">${Number(q.marks||1)} Mark</span><button class="mini-icon edit" data-edit="${i}" title="Edit">✎</button><button class="mini-icon delete" data-delete="${i}" title="Delete">🗑</button></article>`).join('');
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeQuestion(Number(b.dataset.delete)));
}
function typeName(t){return({mcq:'MCQ',short:'Short Answer',true_false:'True / False',fill_blank:'Fill in the Blank',paragraph:'Paragraph',essay:'Essay'})[t]||'Question'}
function openEditor(i){editingIndex=i;const q=bank[key()][i]||{type:'mcq',marks:1,question:'',options:['','','',''],answer:''};document.getElementById('modalEyebrow').textContent=`QUESTION ${i+1}`;document.getElementById('modalTitle').textContent='Edit Question';document.getElementById('qType').value=q.type||'mcq';document.getElementById('qMarks').value=q.marks||1;document.getElementById('qText').value=q.question||'';document.getElementById('editorError').textContent='';renderExtra(q);document.getElementById('editorModal').classList.remove('hidden')}
function addQuestion(){if((bank[key()]||[]).length>=MAX){alert('একটি Class + Semester + Subject-এ সর্বোচ্চ ২০টি প্রশ্ন রাখা যাবে।');return}editingIndex=bank[key()].length;bank[key()].push({type:'mcq',question:'',options:['','','',''],answer:'',marks:1});openEditor(editingIndex)}
function renderExtra(q={}){const type=document.getElementById('qType').value,box=document.getElementById('qExtra');if(type==='mcq'){const opts=q.options||['','','',''];box.innerHTML=`<div class="option-editor">${[0,1,2,3].map(i=>`<div class="option-line"><b>${String.fromCharCode(65+i)})</b><input id="opt${i}" value="${esc(opts[i]||'')}" placeholder="Option ${String.fromCharCode(65+i)}"></div>`).join('')}</div><div class="answer-row"><select id="qAnswer"><option value="">Correct option</option>${[0,1,2,3].map(i=>`<option value="${i}" ${(opts[i]||'')===q.answer?'selected':''}>${String.fromCharCode(65+i)}) ${esc(opts[i]||'Option '+String.fromCharCode(65+i))}</option>`).join('')}</select><input id="qExplanation" value="${esc(q.explanation||'')}" placeholder="Explanation (optional)"></div>`}else if(type==='true_false'){box.innerHTML=`<div class="answer-row"><select id="qAnswer"><option value="সত্য" ${q.answer==='সত্য'?'selected':''}>সত্য</option><option value="মিথ্যা" ${q.answer==='মিথ্যা'?'selected':''}>মিথ্যা</option></select><input id="qExplanation" value="${esc(q.explanation||'')}" placeholder="Explanation (optional)"></div>`}else box.innerHTML=`<div class="answer-row"><input id="qAnswer" value="${esc(q.answer||'')}" placeholder="Correct / Model Answer"><input id="qExplanation" value="${esc(q.explanation||'')}" placeholder="Explanation (optional)"></div>`}
function saveEditor(){const err=document.getElementById('editorError'),text=document.getElementById('qText').value.trim(),type=document.getElementById('qType').value,marks=Math.max(1,Math.min(20,Number(document.getElementById('qMarks').value)||1));if(!text){err.textContent='Question লিখুন।';return}let q={type,question:text,marks};if(type==='mcq'){q.options=[0,1,2,3].map(i=>document.getElementById('opt'+i).value.trim());if(q.options.some(x=>!x)){err.textContent='MCQ-এর চারটি option পূরণ করুন।';return}const ai=Number(document.getElementById('qAnswer').value);if(!Number.isInteger(ai)){err.textContent='Correct option নির্বাচন করুন।';return}q.answer=q.options[ai]}else{q.answer=document.getElementById('qAnswer').value.trim();if(!q.answer){err.textContent='Correct / Model Answer লিখুন।';return}}q.explanation=document.getElementById('qExplanation')?.value.trim()||'';bank[key()][editingIndex]=q;localStorage.setItem(BANK_KEY,JSON.stringify(bank));closeEditor();render();document.getElementById('saveMsg').textContent='✓ Question saved.'}
function removeQuestion(i){if(!confirm(`Question ${i+1} delete করবেন?`))return;bank[key()].splice(i,1);localStorage.setItem(BANK_KEY,JSON.stringify(bank));render()}
function closeEditor(){document.getElementById('editorModal').classList.add('hidden')}
document.getElementById('editorClass').onchange=e=>{activeClass=Number(e.target.value);activeSubject=subjects()[0][0];seed();render()};
document.getElementById('editorSemester').onchange=e=>{activeSemester=e.target.value;seed();render()};
document.getElementById('addQuestion').onclick=addQuestion;document.getElementById('saveEditor').onclick=saveEditor;document.getElementById('cancelEditor').onclick=closeEditor;document.getElementById('closeEditor').onclick=closeEditor;document.getElementById('qType').onchange=()=>renderExtra({});document.getElementById('savePaper').onclick=()=>{localStorage.setItem(BANK_KEY,JSON.stringify(bank));document.getElementById('saveMsg').textContent=`✓ Class ${activeClass}, Semester ${activeSemester} question paper saved.`};
seed();render();

</script>
</body></html>
