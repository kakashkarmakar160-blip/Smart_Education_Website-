<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMR Examination</title>
<style>
*{box-sizing:border-box}:root{--blue:#075a9f;--blue2:#0b6dbb;--line:#b7cad9;--soft:#eef7fd;--text:#173b59;--muted:#63778a;--green:#11a85b;--red:#e5232d;--card:#fff}body{margin:0;background:#edf3f7;color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif}.top{background:linear-gradient(90deg,#004f95,#0a65ac);color:#fff;min-height:82px;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:10px;min-width:245px}.brand img{width:56px;height:56px;object-fit:contain}.brand-name{font-size:23px;font-weight:900;line-height:1.05}.brand-name span{color:#ffd11a}.brand small{display:block;font-size:11px;margin-top:5px}.exam-meta{display:flex;align-items:center;gap:14px}.class-pill,.timer,.profile{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;font-weight:800}.timer{min-width:135px;text-align:center;font-size:18px}.profile{display:flex;align-items:center;gap:7px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#d9ecff;color:#0b5b99}.info-strip{max-width:1500px;margin:10px auto 0;padding:0 14px;display:grid;grid-template-columns:1.25fr 1.25fr 1fr 1fr .75fr}.info-cell{background:#e8f5ff;border:1px solid #b5d6ee;padding:10px 14px;font-size:13px;min-height:50px}.info-cell b{color:#0b64a9;margin-right:5px}.page{max-width:1500px;margin:auto;padding:10px 14px 30px}.sheet-head{background:linear-gradient(90deg,#075a9f,#0b6dbb);color:#fff;padding:10px 14px;font-size:17px;font-weight:900;display:flex;justify-content:space-between;border-radius:4px 4px 0 0}.omr-box{background:#fff;border:1px solid #a9c5d9;padding:12px}.top-fields{display:grid;grid-template-columns:1.8fr 1fr;gap:10px}.fieldbox{border:2px solid #2c6b9c;padding:9px;min-height:62px}.fieldbox label{display:block;color:#075a9f;font-weight:900;font-size:13px;margin-bottom:7px}.fieldbox input,.fieldbox select{width:100%;border:1px solid #c4d5e1;background:#f9fcfe;border-radius:3px;padding:9px;font:inherit;color:var(--text);outline:none}.mid-fields{display:grid;grid-template-columns:1.15fr 1.15fr 1.25fr .85fr .9fr;gap:8px;margin-top:10px}.digit-omr{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;max-height:205px;overflow:hidden}.digit-col{display:flex;flex-direction:column;gap:2px;align-items:center}.digit-bubble{width:20px;height:20px;border:1px solid #89a4b7;border-radius:50%;background:#fff;color:#173b59;font-size:10px;line-height:18px;padding:0;cursor:pointer}.digit-bubble.active{background:#0b66ad;border-color:#0b66ad;color:#fff}.digit-bubble.locked{cursor:not-allowed}.digit-input{margin-bottom:5px!important;text-align:center;font-weight:900;background:#fff!important}.set-list{display:grid;gap:7px;margin-top:5px}.set-list button{border:0;background:transparent;display:flex;align-items:center;justify-content:space-between;color:#173b59;font-weight:900;font-size:14px;cursor:pointer;padding:2px 4px}.set-list .set-bubble{width:22px;height:22px;border:2px solid #8aa4b8;border-radius:50%;display:inline-grid;place-items:center}.set-list button.active .set-bubble{background:#0b66ad;border-color:#0b66ad;color:#fff}.set-list button.locked{cursor:not-allowed}.bottom-fields{display:grid;grid-template-columns:1.6fr 1.6fr;margin-top:10px;gap:8px}.section-title{color:#075a9f;font-weight:900;font-size:13px;margin-bottom:5px}.question-card{border:3px solid var(--red);background:#fff;margin-top:12px;padding:12px}.qtop{display:flex;align-items:center;gap:12px}.qno{background:#0a66ad;color:#fff;border-radius:7px;padding:9px 14px;font-weight:900}.qtext{font-size:20px;font-weight:800;white-space:pre-wrap;line-height:1.55;margin:10px 0 12px}.options{display:grid;gap:8px}.opt{display:grid;grid-template-columns:32px 44px 1fr;align-items:center;gap:10px;border:1px solid #c7d8e4;background:#f8fcff;padding:7px;border-radius:9px;color:var(--text);cursor:pointer;text-align:left;font-size:15px}.opt input{display:none}.opt .radio{width:22px;height:22px;border:2px solid #88a4b8;border-radius:50%;display:block}.opt .letter{width:38px;height:38px;border-radius:50%;background:#d9efff;color:#0b67ad;display:grid;place-items:center;font-weight:900;font-size:17px}.opt.selected{border-color:#0a66ad;background:#eef8ff}.opt.selected .radio{border-color:#0a66ad;background:#0a66ad;box-shadow:inset 0 0 0 5px #fff}.locked{opacity:.98}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:10px}.nav button{border:0;border-radius:7px;padding:12px 24px;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.back{background:#0870d0}.next{background:#12ad61}.nav button:disabled{opacity:.45;cursor:not-allowed}.answer-sheet{margin-top:10px;border:2px solid #6aa9d4;background:#fff}.answer-title{text-align:center;background:linear-gradient(90deg,#2195df,#40a9e9);color:#fff;padding:7px;font-weight:900}.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:8px}.sheet-col{border:1px solid #c4d6e2}.sheet-row{display:grid;grid-template-columns:42px 1fr;align-items:center;min-height:36px;border-bottom:1px solid #d2dee7}.sheet-row:last-child{border-bottom:0}.qnum{text-align:center;font-weight:900;font-size:13px}.bubbles{display:flex;justify-content:space-around;gap:4px}.bubble{width:24px;height:24px;border:2px solid #7e9caf;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:#fff;color:#173b59;cursor:pointer}.bubble.active{background:#0b66ad;border-color:#0b66ad;color:#fff}.bubble.locked{cursor:not-allowed}.instructions{text-align:center;color:#286d9f;font-size:12px;padding:8px}.field-help{font-size:10px;color:#63778a;margin-top:4px}.hidden{display:none}@media(max-width:1050px){.top{flex-wrap:wrap}.exam-meta{width:100%;justify-content:flex-end}.info-strip{grid-template-columns:repeat(3,1fr)}.mid-fields{grid-template-columns:repeat(3,1fr)}.bottom-fields{grid-template-columns:1fr}.sheet-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.top{padding:9px 10px}.brand{min-width:0}.brand img{width:45px;height:45px}.brand-name{font-size:17px}.exam-meta{gap:5px}.class-pill{font-size:11px;padding:8px}.timer{min-width:98px;font-size:14px;padding:8px}.profile{font-size:11px;padding:5px}.profile .avatar{width:28px;height:28px}.info-strip{grid-template-columns:1fr 1fr}.top-fields,.mid-fields,.bottom-fields{grid-template-columns:1fr}.fieldbox{min-height:auto}.page{padding:8px}.qtext{font-size:17px}.opt{grid-template-columns:25px 38px 1fr;font-size:13px}.sheet-grid{grid-template-columns:1fr 1fr;padding:4px}.sheet-row{grid-template-columns:32px 1fr}.bubble{width:22px;height:22px;font-size:10px}.nav button{padding:11px 14px;font-size:13px}.digit-omr{max-height:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="smart-hat.png" alt="Smart Education"><div class="brand-name">Smart <span>Education</span><small>Learn Today&nbsp; Build Tomorrow</small></div></div>
  <div class="exam-meta"><div class="class-pill" id="classMeta">OMR Examination</div><div class="timer" id="timer">05:00</div><div class="profile"><span class="avatar" id="avatar">AK</span><span id="profileName">Student</span>⌄</div></div>
</header>
<div class="info-strip">
  <div class="info-cell"><b>Student Name :</b><span id="infoName">—</span></div>
  <div class="info-cell"><b>Registration No. :</b><span id="infoReg">—</span></div>
  <div class="info-cell"><b>Roll No. :</b><span id="infoRoll">—</span></div>
  <div class="info-cell"><b>Subject :</b><span id="infoSubject">—</span></div>
  <div class="info-cell"><b>Set :</b><span id="infoSet">W</span></div>
</div>
<main class="page">
  <div class="sheet-head"><span>OMR ANSWER SHEET</span><span id="pageNo">Pg-1</span></div>
  <section class="omr-box">
    <div class="top-fields">
      <div class="fieldbox"><label>1. INSTITUTE NAME :</label><input id="institute" placeholder="Institute name"></div>
      <div class="fieldbox"><label>OMR ANSWER SHEET NO.</label><input id="omrNo" placeholder="Answer sheet no."></div>
    </div>
    <div class="mid-fields">
      <div class="fieldbox"><label>2. REGISTRATION NO.</label><input class="digit-input" id="regValue" readonly><div class="digit-omr" id="regGrid"></div></div>
      <div class="fieldbox"><label>3. ROLL NO.</label><input class="digit-input" id="rollValue" readonly><div class="digit-omr" id="rollGrid"></div></div>
      <div class="fieldbox"><label>4. QUESTION BOOKLET SL. NO.</label><input class="digit-input" id="bookletValue" readonly><div class="digit-omr" id="bookletGrid"></div></div>
      <div class="fieldbox"><label>5. QUESTION BOOKLET SET</label><div class="set-list" id="setList"></div></div>
      <div class="fieldbox"><label>6. SUBJECT CODE</label><input class="digit-input" id="subjectCodeValue" readonly><div class="digit-omr" id="subjectCodeGrid"></div></div>
    </div>
    <div class="bottom-fields">
      <div class="fieldbox"><label>7. NAME OF THE STUDENT</label><input id="studentNameBox"></div>
      <div class="fieldbox"><label>11. SUBJECT</label><input id="subjectBox"></div>
    </div>
  </section>
  <section class="question-card" id="qcard"></section>
  <section class="answer-sheet"><div class="answer-title">12. ANSWER</div><div class="sheet-grid" id="sheet"></div><div class="instructions">Select A, B, C or D. Once an answer is selected, that question is locked and cannot be changed.</div></section>
</main>
<script>
let data=JSON.parse(sessionStorage.getItem('teacherExam')||'null');let info=JSON.parse(sessionStorage.getItem('omrStudentInfo')||'null');if(!data||!info){location.href='student-paper.html';}
const all=Array.isArray(data?.questions)?data.questions:[];const setName=String(info?.set||'W').toUpperCase();const questions=all.filter(q=>q.type==='omr'&&String(q.omrSet||'W').toUpperCase()===setName).slice(0,40);let index=0,answers={},remaining=Number(questions[0]?.timerSeconds||300),timerId;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function parseQ(text){const lines=String(text||'').split(/\r?\n/);const opts={};const base=[];for(const line of lines){const m=line.match(/^\s*([ABCD])\s*[\)\.\:\-]\s*(.+)\s*$/i);if(m)opts[m[1].toUpperCase()]=m[2].trim();else base.push(line)}return{base:base.join('\n').trim(),opts};}
function subjectOf(){return data?.subject||data?.targetSubject||data?.questions?.find(q=>q.type==='omr')?.subject||'—';}
function setMeta(){const name=info?.name||'Student';document.getElementById('profileName').textContent=name;document.getElementById('infoName').textContent=name;document.getElementById('infoReg').textContent=info?.registrationNo||'—';document.getElementById('infoRoll').textContent=info?.rollNo||'—';document.getElementById('infoSet').textContent=setName;document.getElementById('infoSubject').textContent=subjectOf();document.getElementById('studentNameBox').value=name;document.getElementById('subjectBox').value=subjectOf();document.getElementById('classMeta').textContent=data?.class_name||data?.className||data?.target||'OMR Examination';document.getElementById('avatar').textContent=name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();}
const fieldState={reg:[],roll:[],booklet:[],subjectCode:[]};const fieldMax={reg:9,roll:8,booklet:8,subjectCode:5};
function renderDigitGrid(id,key){const el=document.getElementById(id);el.innerHTML='';for(let col=0;col<fieldMax[key];col++){const c=document.createElement('div');c.className='digit-col';for(let d=0;d<=9;d++){const b=document.createElement('button');b.type='button';b.className='digit-bubble';b.textContent=d;b.dataset.col=col;b.dataset.d=d;b.onclick=()=>chooseDigit(key,col,d,b);c.appendChild(b)}el.appendChild(c)}}
function chooseDigit(key,col,d,b){if(fieldState[key][col]!==undefined)return;fieldState[key][col]=String(d);b.classList.add('active','locked');const value=fieldState[key].map(x=>x??'').join('').replace(/\s/g,'');document.getElementById(key+'Value').value=value;syncTopField(key,value);}
function syncTopField(key,value){if(key==='reg')document.getElementById('infoReg').textContent=value||'—';}
function renderSets(){const box=document.getElementById('setList');box.innerHTML=['W','X','Y','Z'].map(s=>`<button type="button" class="${s===setName?'active locked':''}" data-set="${s}"><span>${s}</span><span class="set-bubble">${s===setName?'✓':''}</span></button>`).join('');box.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{if(b.dataset.set!==setName)return;});}
function render(){const q=questions[index];if(!q)return;document.getElementById('pageNo').textContent=`Pg-${Math.floor(index/40)+1}`;const parsed=parseQ(q.question);const chosen=answers[index]?.value||'';const opts=['A','B','C','D'].map(l=>`<button class="opt ${chosen===l?'selected locked':''}" data-a="${l}" ${chosen?'disabled':''}><span class="radio"></span><span class="letter">${l}</span><span>${esc(parsed.opts[l]||'Option '+l)}</span></button>`).join('');document.getElementById('qcard').innerHTML=`<div class="qtop"><span class="qno">Q. ${index+1}</span></div><div class="qtext">${esc(parsed.base||q.question)}</div><div class="options">${opts}</div>${chosen?'<div style="margin-top:8px;color:#0a7b45;font-weight:800">✓ Answer selected. এই প্রশ্নের উত্তর আর পরিবর্তন করা যাবে না।</div>':''}<div class="nav"><button class="back" id="qback">← Back Question</button><button class="next" id="qnext">${index===questions.length-1?'SUBMIT EXAM →':'Next Question →'}</button></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.a));document.getElementById('qback').onclick=prev;document.getElementById('qnext').onclick=next;renderSheet();}
function choose(letter){if(answers[index])return;const q=questions[index];answers[index]={value:letter,correct:String(letter).toUpperCase()===String(q.answer||'').toUpperCase()};render();}
function bubbleClick(i,l){if(answers[i]){index=i;render();return}index=i;choose(l)}
function renderSheet(){const cols=[[],[],[],[]];for(let i=0;i<questions.length;i++)cols[Math.floor(i/10)].push(i);document.getElementById('sheet').innerHTML=cols.filter(c=>c.length).map(c=>`<div class="sheet-col">${c.map(i=>`<div class="sheet-row"><div class="qnum">${i+1}</div><div class="bubbles">${['A','B','C','D'].map(l=>`<button class="bubble ${answers[i]?.value===l?'active locked':''}" ${answers[i]?'disabled':''} data-i="${i}" data-a="${l}">${l}</button>`).join('')}</div></div>`).join('')}</div>`).join('');document.querySelectorAll('.bubble').forEach(b=>b.onclick=()=>bubbleClick(Number(b.dataset.i),b.dataset.a));}
function next(){if(!answers[index]){alert('এই প্রশ্নের একটি answer নির্বাচন করুন।');return}if(index<questions.length-1){index++;render()}else finish()}
function prev(){if(index>0){index--;render()}}
async function finish(){const correct=Object.values(answers).filter(a=>a.correct).length;const attempted=Object.keys(answers).length;const total=questions.length;const totalMarks=questions.reduce((s,q)=>s+Number(q.marks||1),0);const obtained=Object.entries(answers).reduce((s,[i,a])=>s+(a.correct?Number(questions[i].marks||1):0),0);const percentage=totalMarks?Math.round(obtained/totalMarks*100):0;let profile={};try{profile=await smartEduAuth.profile()||{}}catch{}const user=await smartEduAuth.user();const studentName=info.name||profile.name||'Student';const teacher=data.teacher_name||data.teacher||data.target||'Teacher';const teacherId=data.teacher_user_id||data.teacherId||'';const paperId=data.id||data.paperId||null;const accessCode=(data.access_code||data.password||'').toUpperCase();const resultId='result-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);const result={id:resultId,paperId,paperPassword:accessCode,access_code:accessCode,teacher,teacherId,teacher_user_id:teacherId,student:{name:studentName,id:user?.id||''},studentName,student_user_id:user?.id||'',registrationNo:info.registrationNo,rollNo:info.rollNo,omrSet:setName,examType:'OMR',title:data.name||'OMR Examination',school:data.target||'',subject:subjectOf(),correct,total,attempted,wrong:attempted-correct,unattempted:Math.max(0,total-attempted),obtained,totalMarks,percentage,date:new Date().toISOString(),answers,questions,awardedMarks:questions.map((q,i)=>answers[i]?.correct?Number(q.marks||1):0),studentDetails:{name:studentName,registrationNo:info.registrationNo,rollNo:info.rollNo,omrAnswerSheetNo:document.getElementById('omrNo').value,institute:document.getElementById('institute').value,subjectCode:document.getElementById('subjectCodeValue').value,subject:document.getElementById('subjectBox').value}};const history=JSON.parse(localStorage.getItem('studentResults')||'[]');history.unshift(result);localStorage.setItem('studentResults',JSON.stringify(history));const tr=JSON.parse(localStorage.getItem('teacherResults')||'[]');tr.unshift(result);localStorage.setItem('teacherResults',JSON.stringify(tr));if(window.supabaseClient&&user?.id&&teacherId&&paperId){const row={result_id:resultId,paper_id:paperId,access_code:accessCode||null,teacher_user_id:teacherId,student_user_id:user.id,student_name:studentName,result,updated_at:new Date().toISOString()};const a=await window.supabaseClient.from('teacher_exam_results').insert(row);if(a.error){alert('Result তৈরি হয়েছে, কিন্তু database-এ save হয়নি।\nSupabase error: '+a.error.message)}else{const b=await window.supabaseClient.from('student_results').upsert(row,{onConflict:'result_id'});if(b.error)console.error('student_results sync',b.error)}}else{alert('Result তৈরি হয়েছে, কিন্তু database-এ save হয়নি। Student session বা paper information পাওয়া যায়নি।')}sessionStorage.setItem('examResult',JSON.stringify(result));sessionStorage.removeItem('teacherExam');sessionStorage.removeItem('omrStudentInfo');location.href='student-result.html?resultId='+encodeURIComponent(resultId)}
function startTimer(){const draw=()=>{const h=Math.floor(remaining/3600),m=Math.floor((remaining%3600)/60),s=remaining%60;document.getElementById('timer').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`};draw();timerId=setInterval(()=>{remaining--;draw();if(remaining<=0){clearInterval(timerId);finish()}},1000)}
['reg','roll','booklet','subjectCode'].forEach(k=>renderDigitGrid(k+'Grid',k));setMeta();renderSets();render();startTimer();
</script>
</body></html>
