<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMR Examination</title>
<style>
*{box-sizing:border-box}:root{--bg:#eef3f7;--card:#fff;--text:#15304b;--muted:#718094;--line:#b9c5cf;--primary:#17639d;--primary2:#0f568d;--soft:#e9f2fa;--shadow:0 8px 24px rgba(30,60,90,.08)}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif}.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-weight:900;font-size:23px}.sub{color:var(--muted)}.timer{font-weight:900;background:var(--soft);padding:9px 12px;border-radius:9px}.wrap{max-width:1250px;margin:auto;padding:18px}.head{background:var(--card);border:1px solid var(--line);padding:20px;border-radius:6px;display:flex;justify-content:space-between;gap:16px;align-items:center}.head h1{margin:4px 0}.badge{border:2px solid var(--primary);padding:12px 20px;font-weight:900}.qcard,.sheet{background:var(--card);border:1px solid var(--line);margin-top:16px;padding:22px;border-radius:6px}.qno{font-weight:900;background:var(--primary);color:#fff;display:inline-block;padding:8px 13px;border-radius:7px}.question{font-size:22px;font-weight:800;white-space:pre-wrap;line-height:1.65;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{border:2px solid var(--line);background:var(--card);padding:14px;border-radius:9px;text-align:left;font-size:17px;color:var(--text);cursor:pointer}.opt.locked{border-color:var(--primary);background:var(--soft);font-weight:900;pointer-events:none}.lock{margin-top:12px;color:var(--muted);font-size:13px}.sheet-title{text-align:center;font-size:25px;font-weight:900;margin-bottom:12px}.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line)}.col{border-right:1px solid var(--line)}.col:last-child{border-right:0}.row{display:grid;grid-template-columns:44px 1fr;border-bottom:1px solid var(--line);min-height:45px;align-items:center}.row:last-child{border-bottom:0}.num{font-weight:900;text-align:center}.bubbles{display:flex;justify-content:space-around;gap:4px}.bubble{width:27px;height:27px;border:2px solid #8292a0;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}.bubble.active{background:var(--primary);border-color:var(--primary);color:#fff}.nav{display:flex;justify-content:space-between;gap:12px;margin:16px 0}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 18px;border-radius:8px;font-weight:900;cursor:pointer}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn:disabled{opacity:.45}.hidden{display:none}@media(max-width:750px){.head{align-items:flex-start}.options{grid-template-columns:1fr}.question{font-size:18px}.sheet-grid{grid-template-columns:1fr 1fr}.title{font-size:17px}.top{padding:12px}.wrap{padding:10px}.bubble{width:24px;height:24px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body><header class="top"><div><div class="title">OMR EXAMINATION</div><div class="sub" id="studentLine">Student</div></div><div class="timer" id="timer">05:00</div></header><main class="wrap"><section class="head"><div><div class="sub">Question Booklet Set</div><h1 id="setTitle">W</h1></div><div class="badge" id="progress">QUESTION 1 / 40</div></section><section class="qcard" id="qcard"></section><section class="sheet"><div class="sheet-title">12. ANSWER</div><div class="sheet-grid" id="sheet"></div><div class="sub" style="text-align:center;margin-top:10px">Select A, B, C or D for the current question. Once selected, that question's answer is locked and cannot be changed.</div></section><div class="nav"><button class="btn" id="back">← BACK</button><button class="btn primary" id="next">NEXT QUESTION →</button></div></main>
<script>
let data=JSON.parse(sessionStorage.getItem('teacherExam')||'null');let info=JSON.parse(sessionStorage.getItem('omrStudentInfo')||'null');if(!data||!info){location.href='student-paper.html';}
const all=Array.isArray(data?.questions)?data.questions:[];const questions=all.filter(q=>q.type==='omr'&&String(q.omrSet||'W').toUpperCase()===String(info?.set||'W').toUpperCase()).slice(0,40);let index=0,answers={},remaining=300,timerId;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function parseQ(text){const lines=String(text||'').split(/\r?\n/);const opts={};const base=[];for(const line of lines){const m=line.match(/^\s*([ABCD])\s*[\)\.\:\-]\s*(.+)\s*$/i);if(m)opts[m[1].toUpperCase()]=m[2].trim();else base.push(line);}return {base:base.join('\n').trim(),opts};}
function render(){const q=questions[index];if(!q)return;document.getElementById('progress').textContent=`QUESTION ${index+1} / ${questions.length}`;document.getElementById('setTitle').textContent=info.set;document.getElementById('studentLine').textContent=`${info.name} • Registration No. ${info.registrationNo}`;const parsed=parseQ(q.question);const chosen=answers[index]?.value||'';const opts=['A','B','C','D'].map(l=>`<button class="opt ${chosen===l?'locked':''}" data-a="${l}" ${chosen?'disabled':''}><b>${l})</b> ${esc(parsed.opts[l]||'Option '+l)}</button>`).join('');document.getElementById('qcard').innerHTML=`<span class="qno">QUESTION ${index+1}</span><div class="question">${esc(parsed.base||q.question)}</div><div class="options">${opts}</div>${chosen?'<div class="lock">✓ Answer selected. এই প্রশ্নের উত্তর আর পরিবর্তন করা যাবে না।</div>':''}`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.a));renderSheet();document.getElementById('back').disabled=index===0;document.getElementById('next').textContent=index===questions.length-1?'SUBMIT EXAM →':'NEXT QUESTION →';}
function choose(letter){if(answers[index])return;const q=questions[index];const correct=String(letter).toUpperCase()===String(q.answer||'').toUpperCase();answers[index]={value:letter,correct};render();}
function renderSheet(){const cols=[[],[],[],[]];for(let i=0;i<questions.length;i++)cols[Math.floor(i/10)].push(i);document.getElementById('sheet').innerHTML=cols.filter(c=>c.length).map(c=>`<div class="col">${c.map(i=>`<div class="row"><div class="num">${i+1}</div><div class="bubbles">${['A','B','C','D'].map(l=>`<span class="bubble ${answers[i]?.value===l?'active':''}">${l}</span>`).join('')}</div></div>`).join('')}</div>`).join('');}
function next(){if(!answers[index]){alert('এই প্রশ্নের একটি answer নির্বাচন করুন।');return;}if(index<questions.length-1){index++;render();}else finish();}
function prev(){if(index>0){index--;render();}}
async function finish(){const correct=Object.values(answers).filter(a=>a.correct).length;const attempted=Object.keys(answers).length;const total=questions.length;const totalMarks=questions.reduce((s,q)=>s+Number(q.marks||1),0);const obtained=Object.entries(answers).reduce((s,[i,a])=>s+(a.correct?Number(questions[i].marks||1):0),0);const percentage=totalMarks?Math.round(obtained/totalMarks*100):0;let profile={};try{profile=await smartEduAuth.profile()||{};}catch{}const user=await smartEduAuth.user();const studentName=info.name||profile.name||'Student';const teacher=data.teacher_name||data.teacher||data.target||'Teacher';const teacherId=data.teacher_user_id||data.teacherId||'';const paperId=data.id||data.paperId||null;const accessCode=(data.access_code||data.password||'').toUpperCase();const resultId='result-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);const result={id:resultId,paperId,paperPassword:accessCode,access_code:accessCode,teacher,teacherId,teacher_user_id:teacherId,student:{name:studentName,id:user?.id||''},studentName,student_user_id:user?.id||'',registrationNo:info.registrationNo,omrSet:info.set,examType:'OMR',title:data.name||'OMR Examination',school:data.target||'',subject:'',correct,total,attempted,wrong:attempted-correct,unattempted:Math.max(0,total-attempted),obtained,totalMarks,percentage,date:new Date().toISOString(),answers,questions,awardedMarks:questions.map((q,i)=>answers[i]?.correct?Number(q.marks||1):0)};const history=JSON.parse(localStorage.getItem('studentResults')||'[]');history.unshift(result);localStorage.setItem('studentResults',JSON.stringify(history));const tr=JSON.parse(localStorage.getItem('teacherResults')||'[]');tr.unshift(result);localStorage.setItem('teacherResults',JSON.stringify(tr));if(window.supabaseClient&&user?.id&&teacherId&&paperId){const row={result_id:resultId,paper_id:paperId,access_code:accessCode||null,teacher_user_id:teacherId,student_user_id:user.id,student_name:studentName,result,updated_at:new Date().toISOString()};const a=await window.supabaseClient.from('teacher_exam_results').insert(row);if(a.error){alert('Result তৈরি হয়েছে, কিন্তু database-এ save হয়নি।\nSupabase error: '+a.error.message);}else{const b=await window.supabaseClient.from('student_results').upsert(row,{onConflict:'result_id'});if(b.error)console.error('student_results sync',b.error);}}else{alert('Result তৈরি হয়েছে, কিন্তু database-এ save হয়নি। Student session বা paper information পাওয়া যায়নি।');}sessionStorage.setItem('examResult',JSON.stringify(result));sessionStorage.removeItem('teacherExam');sessionStorage.removeItem('omrStudentInfo');location.href='student-result.html?resultId='+encodeURIComponent(resultId);}
function startTimer(){timerId=setInterval(()=>{remaining--;document.getElementById('timer').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;if(remaining<=0){clearInterval(timerId);finish();}},1000);}
document.getElementById('next').onclick=next;document.getElementById('back').onclick=prev;if(!questions.length){alert(`Set ${info?.set||'W'}-এ কোনো OMR question নেই।`);location.href='omr-start.html';}else{render();startTimer();}
</script></body></html>
