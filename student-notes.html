<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes • Smart Education</title>
<style>*{box-sizing:border-box}:root{--bg:#f7f8fc;--card:#fff;--text:#111a35;--muted:#687089;--line:#e7e8f0;--primary:#5b22c9;--soft:#f1edff;--shadow:0 12px 40px rgba(34,25,75,.08)}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans Bengali',sans-serif}.topbar{height:70px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.icon-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text)}.brand{font-size:21px;font-weight:800}.wrap{max-width:1000px;margin:auto;padding:28px 18px 70px}.search.card,.paper.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.search{display:flex;gap:10px;align-items:end}.field{flex:1}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}button{cursor:pointer}.primary,.outline{border-radius:12px;padding:12px 18px;font-weight:800}.primary{background:linear-gradient(135deg,#5b22c9,#7744e8);color:#fff;border:0}.outline{background:var(--card);color:var(--text);border:1px solid var(--line)}.paper{margin-top:20px;position:relative;overflow:hidden}.paper-head{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}.paper-head h1{margin:0 0 6px}.paper-body{font-size:17px;line-height:1.8}.paper-body img{max-width:100%;height:auto}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}.muted{color:var(--muted)}.hidden{display:none!important}.error{color:#c42f3c}.loading{text-align:center;padding:30px}.wm{position:absolute;inset:0;display:grid;place-items:center;opacity:.08;pointer-events:none;font-size:100px;transform:rotate(-30deg)}@media(max-width:650px){.topbar{padding:0 14px}.search{flex-direction:column;align-items:stretch}.paper{padding:18px}.paper-body{font-size:16px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script></head><body><header class="topbar"><a href="student-profile.html" class="icon-btn">←</a><div class="brand">📚 Notes</div><span></span></header><main class="wrap"><section class="search card"><div class="field"><label>Enter Notes Code</label><input id="code" placeholder="যেমন NT-7K4P92" autocomplete="off"></div><button class="primary" id="openBtn">Open Notes</button></section><section id="paper" class="paper card hidden"></section><div id="msg" class="loading muted">Notes Code দিয়ে একটি published Notes খুলুন।</div></main><script>const $=id=>document.getElementById(id);function showMsg(x,c='loading'){const m=$('msg');m.className=c;m.textContent=x;m.classList.remove('hidden')}$('openBtn').onclick=load;$('code').addEventListener('keydown',e=>{if(e.key==='Enter')load()});async function load(){const code=$('code').value.trim().toUpperCase();if(!code)return showMsg('Notes Code দিন।','loading');showMsg('Notes খোঁজা হচ্ছে…');const {data,error}=await supabaseClient.from('notes').select('*').eq('note_code',code).eq('published',true).maybeSingle();if(error||!data){$('paper').classList.add('hidden');return showMsg('এই code-এর কোনো published Notes পাওয়া যায়নি।','error')}showMsg('');$('msg').classList.add('hidden');const body=DOMPurify.sanitize(data.content_html,{ADD_ATTR:['style','class','target']});$('paper').innerHTML=`<div class="paper-head"><h1>${esc(data.title)}</h1><div class="muted">${esc(data.subject||'')} ${data.chapter?'• '+esc(data.chapter):''}</div><div class="muted">Class ${esc(data.class_name||'')} • ${esc(data.semester||'')} • ${esc(data.teacher_name||'')}</div></div><div class="paper-body">${body}</div><div class="actions"><button class="primary" id="pdf">📥 Save as PDF</button></div>`;if(data.background_logo_url){$('paper').style.backgroundImage=`url("${data.background_logo_url}")`;$('paper').style.backgroundRepeat='no-repeat';$('paper').style.backgroundPosition='center';$('paper').style.backgroundSize='420px auto'}$('paper').classList.remove('hidden');$('pdf').onclick=()=>pdf(data)}function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}async function pdf(n){const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-100000px;top:0;width:794px;background:#fff;color:#111;padding:45px;font-family:Arial,\'Noto Sans Bengali\',sans-serif;line-height:1.6';holder.innerHTML=`<h1>${esc(n.title)}</h1><p>${esc(n.subject||'')} • ${esc(n.chapter||'')}</p><hr>${DOMPurify.sanitize(n.content_html,{ADD_ATTR:['style','class']})}`;if(n.background_logo_url){holder.style.backgroundImage=`url(\"${n.background_logo_url}\")`;holder.style.backgroundRepeat='no-repeat';holder.style.backgroundPosition='center';holder.style.backgroundSize='420px auto'}document.body.appendChild(holder);const canvas=await html2canvas(holder,{scale:1.5,useCORS:true,backgroundColor:'#fff'});const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','pt','a4');const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),imgW=pw-60,pageH=Math.floor(canvas.width*ph/imgW);const page=document.createElement('canvas');page.width=canvas.width;page.height=pageH;let off=0;while(off<canvas.height){const ctx=page.getContext('2d');ctx.clearRect(0,0,page.width,page.height);ctx.drawImage(canvas,0,off,canvas.width,Math.min(pageH,canvas.height-off),0,0,canvas.width,Math.min(pageH,canvas.height-off));if(off>0)pdf.addPage();pdf.addImage(page.toDataURL('image/jpeg',.9),'JPEG',30,30,imgW,Math.min(pageH,canvas.height-off)*imgW/canvas.width);off+=pageH}pdf.save((n.title||'Smart-Education-Notes').replace(/[^a-z0-9\u0980-\u09ff\- ]/gi,'').trim().replace(/\s+/g,'-')+'.pdf');holder.remove()}</script></body></html>
